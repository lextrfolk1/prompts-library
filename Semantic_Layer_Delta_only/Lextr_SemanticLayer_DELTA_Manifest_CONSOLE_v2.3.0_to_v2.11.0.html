 (expose/round-trip), LP-16 (catalog shows governed allowed values), LP-17 (register captures the full set). Adds LP-43 (Domain registration + governed AI resolve). Extends the LP-39 completeness gate with a UI->contract round-trip check so this class of drift cannot recur.",review_status:"INCREMENTAL manifest. Contains ONLY the work a v2.3.0 build still has to do: 23 new logic points and 12 amended ones. The 9 unchanged points (LP-02, 04, 07, 08, 09, 10, 11, 13, 21) are deliberately ABSENT \u2014 they are already built to contract and must not be modified. Every sub-task listed here is work that still needs doing.",changelog_v2_9_1:"Final review + Consumer Traversal Contract. Additive DOCUMENTATION only (no schema change): adds a machine-readable consumer_traversal block so a downstream consumer (Lextr Intelligence / Lexie) can start at base objects and classify each attribute as PLAIN, BOOLEAN, ENUMERATION (inline), REFERENCE DOMAIN (registered or table-backed), or OBJECT LINK (relationship/FK), with the exact field to read and endpoint to resolve. Uses existing v2.9.0 fields (domain_mode_cd, fk_flg, semantic_relationship_catalog). Manifest integrity re-verified.",changelog_v2_9_2:"Consumer Traversal Contract extended for INDEPENDENT REFERENCE OBJECTS and BOUNDED AGENTS. Additive documentation only (no schema change): (1) two entry points \u2014 inventory (reaches everything registered, incl. independent reference objects) vs traversal (connected structure only); (2) object roles (BASE / REFERENCE / DOMAIN-BACKING) with derivation; (3) an explicit note that independent reference objects are reachable ONLY via the inventory; (4) a bounded-scope definition \u2014 the agent reasons over an explicit exposed/approved/workspace-scoped set and never expands it by traversal. Optional additive object_role_cd flagged for owner approval.",changelog_v2_9_3:"Promoted LP-41 Tenant Workspaces from PROPOSED to COMMITTED (owner-approved 2026-08-19). Tenant Workspaces are the enforcement home for bounded-agent scope \u2014 the explicit per-tenant set of objects a consumer/agent (e.g. Lextr Intelligence / Lexie) may operate over. Tables (meta.tenant_workspace + meta.tenant_workspace_object; additive V8) are now committed contract. LP-42 Logical Hierarchies remains PROPOSED.",changelog_v2_10_0:"Domain Values / Enumerations at scale \u2014 incorporates the Lextr Intelligence ASK. Adds meta.domain_value_synonym (governed vocabulary; UNIQUE NULLS NOT DISTINCT; tenant-overrides-GLOBAL as tracked exception) and meta.domain_value_source_map (canonical<-source code); adds domain_catalog.version_nbr + value_count_nbr, domain_value.ai_exposure_cd, and the DOMAIN_MAX_ENUMERATE_CARDINALITY preset. Amends LP-43 for DETERMINISTIC phrase resolution (EXACT|AMBIGUOUS|UNRESOLVED + required resolution_basis + version; no fuzzy/stemming/embedding; paginated trigram search; cardinality refusal; as-of past-version resolve), LP-12 (SYNONYM_AUTHOR four-eyes), LP-27 (domain drift signal), and POL-DM-001 scope. Removes YN_FLAG \u2014 booleans are two-value ENUM_LIST (per-attribute descriptions + synonyms; existing YN_FLAG attrs need a curated data migration). FIXES a v2.9.0 bug: the DOMAIN_INLINE_MAX_CARDINALITY seed used non-existent policy_preset columns (would fail flyway migrate).",changelog_v2_11_0:"SL-side items completable without Core. COMMITTED (Locale, no Core dependency): meta.domain_value_text (localized value_desc + ai_context per locale, en-US fallback; value_cd never translated); LP-43 normalisation switched to Unicode case-folding + declared form (not LOWER()); DOMAIN_RESOLVE_TTL_SECONDS preset (version/as-of-pinned resolve is immutable). Attribute-name localization DEFERRED (recorded gap on LP-05). PROPOSED (pending owner rulings + Core workflow stages): LP-44 Attribute Promotion + V16 provenance columns.",release:"FINAL v2.11.0",release_date:"2026-08-26",delta_from:"2.3.0",delta_to:"2.11.0+fable.1",delta_note:"Every generated work prompt in this console is delta-aware: a NEW point says build from scratch, an AMENDED point says modify existing code and lists exactly what was added and removed."},build_context:{pinned_stack:{backend:"Java 17, Spring Boot 3.2.5, Spring Cloud Gateway; Controller->Service->DAO->Impl; NamedParameterJdbcTemplate (no JPA); SQL externalized in queries.properties via SQLQueryLoaderUtil; Jackson SNAKE_CASE",python_service:"FastAPI (Uvicorn, Pydantic) \u2014 semantic-service host; Dask where needed",database:"PostgreSQL 16, SQL-first, Flyway-owned DDL (no JPA); pgvector where AI",graph:"Neo4j (Spring Data Neo4j); Cytoscape.js for graph visualization",analytics:"ClickHouse (Lextr-native semantic-service; NO Cube.dev)",frontend:"React 18, MUI, Redux, AG Grid (Core standard); Vite build",cache_realtime:"Redis; STOMP/SockJS; pg_notify/WebSocket live updates",messaging:"Kafka",identity_authz:"Keycloak (OIDC/OAuth2) + OPA",deploy:"Docker, Kubernetes, Helm; GCP + on-prem",observability:"Prometheus, ELK, SonarQube"},governance_constraints:["Microservices only \u2014 never monolithic","All authorization/business policy externalized to OPA \u2014 none in code",">=90% unit-test coverage on new/changed code; tests live inside each logic point","Self-healing on core path: retries, circuit-breaking, graceful degradation, health/recovery hooks [resilience library to confirm \u2014 P-07]","Low-code: prefer reuse > configuration > extension point > new code","Standards adherence: naming, datatypes, field lengths, must-have fields","Configurable logo (TENANT.logoUrl) + client-pointable CSS (TENANT.cssOverrideUrl); multi-tenant theming","Tenancy key = client_id; isolation OPA-enforced (no RLS day one; RLS = future option)","Audit: metadata changes recorded to meta.metadata_change_history","If a standard is absent, ASK the SME \u2014 do not assume","Cross-cutting production-readiness is delivered as first-class logic points (Global Standards wave LP-34..LP-40), not only as bars: API docs, logging/diagnostics, datasource wiring, external config, global exception handling, coverage+completeness gate, app observability/resilience apply horizontally across every controller/service.","Completeness gate (LP-39): generation fails when a required cross-cutting concern is absent, when an entity with a write has no GET/list read, or when a screen has no backing read API."]},ddl_body:`-- =============================================================================
-- Lextr Semantic Layer \u2014 INCREMENTAL DDL  v2.3.0 -> v2.11.0
-- For a build that already applied the v2.3.0 baseline (16 tables).
-- Apply IN ORDER, as additive Flyway migrations. Never edit a landed migration.
--
-- Adds 23 tables and 27 columns on meta.attribute_catalog.
-- PROPOSED sections are marked and must NOT be applied without owner approval:
--   \xB7 meta.logical_hierarchy / logical_hierarchy_level   (LP-42, migration V9)
--   \xB7 attribute promotion provenance columns             (LP-44, migration V16)
-- =============================================================================

-- ---- extensions ----
CREATE EXTENSION IF NOT EXISTS pg_trgm;

-- ---- new tables ----

-- meta.attribute_pairing_catalog
CREATE TABLE meta.attribute_pairing_catalog (
    id                              bigserial    PRIMARY KEY,
    pairing_cd                      varchar(80)  NOT NULL UNIQUE,
    pairing_nm                      varchar(200) NOT NULL,
    schema_cd                       varchar(30)  NOT NULL,
    object_cd                       varchar(50)  NOT NULL,
    display_attribute_cd            varchar(32)  NOT NULL,        -- what the user sees/filters on
    filter_attribute_cd             varchar(32)  NOT NULL,        -- what SQL actually uses (indexed)
    pairing_type_cd                 varchar(30)  NOT NULL DEFAULT 'LABEL_TO_KEY',
    lookup_strategy_cd              varchar(30)  NOT NULL DEFAULT 'CACHED_LOOKUP',
    lookup_inline_map_jsonb         jsonb,                        -- INLINE_MAP: {display:filter}
    lookup_sql_template_txt         text,                         -- RUNTIME_QUERY template
    lookup_cache_enabled_flg        boolean      NOT NULL DEFAULT true,
    lookup_cache_ttl_seconds_nbr    integer      NOT NULL DEFAULT 3600,
    cardinality_cd                  varchar(20)  NOT NULL DEFAULT 'ONE_TO_ONE',
    is_bidirectional_flg            boolean      NOT NULL DEFAULT false,
    is_cross_engine_flg             boolean      NOT NULL DEFAULT false,  -- POL-CE-002 gate
    filter_attribute_indexed_flg    boolean      NOT NULL DEFAULT true,   -- activation gate
    filter_attribute_index_type_cd  varchar(20),
    performance_gain_pct_est_nbr    integer,
    ai_context_txt                  text,
    client_id                       varchar(40),                  -- NULL = GLOBAL
    lifecycle_status_cd             varchar(30)  NOT NULL DEFAULT 'DRAFT',
    governance_review_status_cd     varchar(30)  NOT NULL DEFAULT 'PENDING',
    version_nbr                     integer      NOT NULL DEFAULT 1,
    created_ts                      timestamptz  NOT NULL DEFAULT now(),
    created_by                      varchar(100) NOT NULL DEFAULT current_user,
    updated_ts                      timestamptz,
    updated_by                      varchar(100),
    CONSTRAINT uq_apc_object_pair UNIQUE (schema_cd, object_cd,
                                          display_attribute_cd, filter_attribute_cd),
    CONSTRAINT fk_apc_object FOREIGN KEY (schema_cd, object_cd)
        REFERENCES meta.object_catalog (schema_cd, object_cd),
    CONSTRAINT ck_apc_type CHECK (pairing_type_cd IN
        ('LABEL_TO_KEY','NAME_TO_CODE','DESCRIPTION_TO_ID','DISPLAY_TO_FILTER')),
    CONSTRAINT ck_apc_strategy CHECK (lookup_strategy_cd IN
        ('CACHED_LOOKUP','INLINE_MAP','RUNTIME_QUERY')),
    CONSTRAINT ck_apc_cardinality CHECK (cardinality_cd IN
        ('ONE_TO_ONE','MANY_TO_ONE','ONE_TO_MANY')),
    CONSTRAINT ck_apc_diff_attrs CHECK (display_attribute_cd <> filter_attribute_cd),
    CONSTRAINT ck_apc_lifecycle CHECK (lifecycle_status_cd IN
        ('DRAFT','REVIEW','APPROVED','ACTIVE','DEPRECATED','RETIRED'))
    -- [ASSUMED-6] The "filter attribute must be indexed" activation gate is enforced in the
    --             service layer (checks pg_indexes), NOT as a DB constraint, consistent with

    CONSTRAINT uq_dvs UNIQUE NULLS NOT DISTINCT (domain_cd, synonym_txt, locale_cd, client_id)

Data access is enforced at the shared Keycloak(OIDC)+OPA gateway in front of every endpoint, so the same rules apply to analysts, rules, reports, and AI. Two policies run on every request: POL-AC-001 ring-fences access (deny-by-default; tenant/client isolation; role/purpose-based authorization; need-to-know), and POL-DC-001 applies each object/attribute's data classification (Public/Internal/Confidential/Restricted, plus PII, MNPI, CSI, CDE, jurisdiction) to mask, restrict, or deny, and to gate AI exposure (ALLOWED/RESTRICTED/BLOCKED). Classification is captured at registration and is a governed property, not discretionary. This is the control set that lets model inputs satisfy MRM (SR 11-7 / OCC 2011-12) and firm-wide BCBS 239 expectations. Policies are externalized (configurable, never in code) and every access decision is logged.`,scope:"Additive migration V6 adds a GOVERNED classification lookup and attribute-level classification (object-level classification + PII/confidential/masking already exist in the V1 baseline), plus optional ring-fence grants. POL-AC-001 (deny-by-default access: tenant isolation + role/purpose authorization) and POL-DC-001 (classification-driven masking/restriction + AI exposure) are authored and added to the LP-14 bundle. The shared read/exposure service applies both on every request and masks/withholds fields the caller is not entitled to; cross-tenant access is always denied. Every decision is audited.",manifest_of_steps:["Land V6__classification.sql (governed ref + attribute-level classification + grants; object-level already in baseline)","Author POL-AC-001 (deny-by-default; tenant isolation; role/purpose authorization)","Author POL-DC-001 (classification-driven masking/restriction; AI exposure tier)","Enforce both in the shared read/exposure path; mask/withhold unentitled fields","Add POL-AC-001 + POL-DC-001 to the LP-14 OPA bundle","Audit every access decision to meta.metadata_change_history"],tests_must_cover:["cross-tenant read A coded attribute's valid values are a governed codeset (code+description), not UI mock. This point registers/reads governed domains (domain_catalog + domain_value; source INLINE|ENUMERATED|REFERENCE_TABLE) and exposes a governed AI resolve so consumers and Lexie ground on the certified, tenant-scoped, current allowed values \u2014 the critical grounding piece for Vertical AI.`,scope:"Additive V10 (domain_catalog + domain_value) + V11 (attribute_catalog domain columns). GET/POST /domains (+values); source_type ENUMERATED (rows) | REFERENCE_TABLE (project ref_table code/desc cols) | INLINE (attribute domain_values_jsonb). POST /semantic/resolve-domain (attribute or domain_cd, tenant, as-of date) -> ACTIVE allowed values with description + AI context; policy-gated (POL-DM-001); every resolve audited. Catalog (LP-16) and Register (LP-17) consume this \u2014 no client-side value maps. DETERMINISTIC PHRASE RESOLUTION (ASK 1-8): resolve a normalised phrase (lower/trim/collapse-space, EXACT compare only \u2014 NO fuzzy/stemming/embedding/nearest) against code, description or ACTIVE synonym. Outcome is a closed set of three: EXACT (one match + resolution_basis), AMBIGUOUS (>1 match -> ALL candidates, never a best guess), UNRESOLVED (0 matches -> domain cardinality + search handle). resolution_basis (CODE|DESCRIPTION|SYNONYM|SOURCE_MAPPING + matched text) is REQUIRED on every resolved value, for the evidence trail. Return per value: value_cd, value_desc, ai_context_txt, lifecycle_status_cd, effective dates, and domain_catalog.version_nbr. Synonyms live in meta.domain_value_synonym (governed vocabulary; tenant rows may override GLOBAL as a tracked exception, override_global_flg; resolution considers GLOBAL + caller tenant, TENANT wins). Source codes map via meta.domain_value_source_map (resolution_basis=SOURCE_MAPPING). Scale: value_count_nbr on domain_catalog (service-maintained); GET /domains/{domain_cd}/values?q=&limit=&cursor= (prefix/substring, paginated, trigram-indexed); above DOMAIN_MAX_ENUMERATE_CARDINALITY the full-set resolve REFUSES (policy) and directs to search. Versioning: version_nbr bumped in-service on any value/synonym/mapping change; as_of resolves at the past version so a saved report re-explains as at its authoring date. Per-value ai_exposure_cd (inherits attribute, never wider). YN_FLAG removed \u2014 booleans are two-value ENUM_LIST. LOCALE: description + ai_context resolve in the caller's locale via meta.domain_value_text (locale -> en-US -> domain_value.value_desc fallback); value_cd is never translated. Normalisation for deterministic match is UNICODE CASE-FOLDING with a declared normalisation form (NFC + full case-fold + trim + collapse whitespace), done in-service \u2014 never SQL LOWER() (which is wrong for Turkish i, German ss, and accents). TTL: a 'latest' resolve may be cached up to DOMAIN_RESOLVE_TTL_SECONDS; a resolve pinned to version_nbr/as_of is immutable and cacheable indefinitely.",manifest_of_steps:["Land V10 domain store + V11 attribute domain columns","GET/POST domains + values; source-type handling (ENUMERATED/REFERENCE_TABLE/INLINE)","REFERENCE_TABLE: project ref_table (code_col, desc_col); validate table + columns exist","POST /semantic/resolve-domain: tenant + as-of + lifecycle filter; return code+desc+ai_context","POL-DM-001 gate + audit; wire LP-16 catalog + LP-17 register to the resolve","Land V12 synonyms + V13 source-map + V14 (version/count/per-value AI + YN_FLAG removal)","Normalise phrase (lower/trim/collapse) then EXACT match on code/desc/ACTIVE synonym \u2014 no fuzzy/stemming/embedding","Return EXACT | AMBIGUOUS (all candidates) | UNRESOLVED (cardinality + search handle); resolution_basis + version on every value","Synonym precedence: GLOBAL + tenant; TENANT overrides GLOBAL (override_global_flg tracked exception)","GET /domains/{domain_cd}/values?q=&limit=&cursor= (trigram) ; refuse full-set above DOMAIN_MAX_ENUMERATE_CARDINALITY","Bump domain version_nbr in-service on value/synonym/mapping change; as_of resolves at past version","Route synonym authoring through LP-12 SYNONYM_AUTHOR (four-eyes); resolve uses ACTIVE + certified synonyms only","Localize description/ai_context via domain_value_text (locale -> en-US fallback); value_cd untouched","Normalise with Unicode case-folding + declared form (NFC), not LOWER()","Return / honour DOMAIN_RESOLVE_TTL_SECONDS; version/as-of-pinned resolve is immutable"],tests_must_cover:["ENUMERATED resolves domain_value rows; REFERENCE_TABLE projects ref-table code/desc; INLINE reads jsonb","resolve is tenant-scoped + as-of-date + lifecycle-filtered (ACTIVE only)","POL-DM-001 denies cross-tenant / unauthorized","AI resolve returns per-value ai_context where present","coverage >=90%","phrase matching one ACTIVE synonym -> EXACT with resolution_basis=SYNONYM","phrase matching two values -> AMBIGUOUS with EVERY candidate (never a best guess)","unknown phrase -> UNRESOLVED with cardinality + search handle (not an empty success)","synonym colliding within domain/locale/tenant -> rejected at WRITE by uq_dvs","RETIRED value excluded from resolve but still resolvable as_of a past date","resolve above DOMAIN_MAX_ENUMERATE_CARDINALITY refuses and names the policy","source-mapped code resolves with resolution_basis=SOURCE_MAPPING","tenant synonym overrides GLOBAL for the same phrase; override flagged (override_global_flg)","cross-tenant resolve denied naming POL-DM-001; every resolve audited with domain + version + basis","no fuzzy/stemming/embedding path exists (deterministic compare only)","French phrase matches a French synonym AND the value returns a French description (locale-aware)","Turkish dotted/dotless i and German ss fold correctly (deterministic, not LOWER)","missing locale falls back to en-US then to value_desc; value_cd never translated","version/as-of-pinned resolve marked immutable; latest resolve carries the TTL"],pre_build_knowledge:["Domain source types: INLINE (attribute jsonb) | ENUMERATED (domain_value) | REFERENCE_TABLE (project a ref table)","Link, don't copy: REF_DOMAIN resolves live from source (always current)","Grounding contract for Vertical AI: code + description + ai_context, certified + tenant-scoped [v2.9.0]","The layer is DETERMINISTIC: fuzzy/approximate matching stays with the CONSUMER, never the layer [v2.10.0 ASK 3]","resolution_basis + domain version are REQUIRED for the evidence trail [v2.10.0]","Booleans are two-value ENUM_LIST (YN_FLAG removed) so they carry descriptions + synonyms [v2.10.0 ASK 2a]","Tenant synonym overrides GLOBAL as a TRACKED exception, never silently [v2.10.0]","Metadata is localized, the CODE is not: value_cd never translated; value_desc/ai_context are per-locale [v2.11.0]","Deterministic match uses Unicode case-folding, not LOWER() \u2014 required once text is multilingual [v2.11.0]"],fixed_contracts:["meta.domain_catalog (V10)","meta.domain_value (V10)","attribute_catalog domain columns (V11)","governance.policy_preset DOMAIN_INLINE_MAX_CARDINALITY","meta.domain_value_synonym (V12)","meta.domain_value_source_map (V13)","domain_catalog.version_nbr + value_count_nbr (V14)","domain_value.ai_exposure_cd (V14)","governance.policy_preset DOMAIN_MAX_ENUMERATE_CARDINALITY","meta.domain_value_text (V15)","governance.policy_preset DOMAIN_RESOLVE_TTL_SECONDS"],decisions_referenced:[],pending_items:["POL-DM-001 (domain resolve policy) to author in the OPA bundle (LP-14)"],reference_pointers:{prototype:"Data Catalog + Attribute registration (behavior only)"},lang_tags:["SQL","JAVA","REGO","TS"],layer:"shared",subtasks:[{sub_id:"LP-43.1",lang:"SQL",layer:"shared",scope:"SQL in queries.properties (no inline SQL/JPA); NamedParameterJdbcTemplate.",tests_must_cover:["loads from queries.properties","params bind","SNAKE_CASE columns"],status:"blocked",claimed_by:"",disposition:"UNRESOLVED",conformance_test_passed:!1,adjustments:[]},{sub_id:"LP-43.2",lang:"JAVA",layer:"shared",scope:"Controller+Service+DAO/Impl; SNAKE_CASE Jackson.",tes Lextr Intelligence UC10 lets an analyst derive a report-local attribute (a maturity band, a utilisation ratio) grounded on SL attributes only. PROMOTION is the moment that working definition becomes shared meaning in the catalog \u2014 the SL's invariant. Until the rulings below are confirmed and Core supplies the workflow stages, the promotion control stays ABSENT rather than approximated.`,scope:"Additive V16 provenance on attribute_catalog (attr_origin_cd SOURCE_DERIVED|PROMOTED_DERIVED, promoted_from_report_id, derivation_expression_txt, expression_author_cd incl. ASSISTANT_DRAFTED_HUMAN_APPROVED). Promotion routes through attribute registration (LP-03/LP-17) and a new four-eyes wkfl.workflow_task type ATTRIBUTE_PROMOTION (LP-12). SL RECOMMENDED RULINGS (owner to confirm): (1) four-eyes, not the author alone; (2) provenance visible; (3) NO silent rebind \u2014 existing report-local copies stay and are FLAGGED for their owners to rebind; (4) demote/retire via standard lifecycle, reports using a retired promoted attr flagged/counted; (5) the expression SURVIVES promotion, and if the SL re-expresses it against its own model an EQUIVALENCE CHECK must pass first (so a promoted attr cannot silently compute a different number). Report-local attributes render visibly distinct from SL attributes.",manifest_of_steps:["Land V16 provenance (PROPOSED)","Add ATTRIBUTE_PROMOTION four-eyes task (LP-12) wired to Core workflow stages","Promote via attribute registration; stamp provenance + expression_author","Rule out silent rebind: flag report-local copies for owner rebind","Lifecycle demote/retire; equivalence check if re-expressed"],tests_must_cover:["promotion requires four-eyes approval before the attribute is ACTIVE","promoted attr is distinguishable from source-derived (attr_origin_cd + provenance visible)","existing report-local copies are NOT silently rebound \u2014 they are flagged","re-expressed promoted attr fails promotion unless equivalence check passes","assistant- sal. Treat 'unreferenced' as a normal, expected state for reference objects.",bounded_scope:{principle:"Bounded, not autonomous: an agent reasons within an EXPLICIT governed set, enumerated once from the inventory. It does not autonomously crawl or discover new authority.",scope_set:"The agent's world = registered objects where semantic_layer_enabled_flg = true AND ai_approved_flg = true AND ai_governance_cd allows AI, with attributes filtered by ai_exposed_flg, scoped by tenant (client_id) and \u2014 if used \u2014 a Tenant Workspace (LP-41). Independent reference objects are IN scope when they meet these flags, regardless of whether anything links to them.",note:"Traversal ENRICHES objects already in scope (resolves domains, follows links); it never expands the boundary. Anything outside the exposed/approved/workspace set is invisible to the agent by construction \u2014 that is the bound."},optional_schema:"Optional (owner-approval): add object_role_cd (BASE|FACT|DIMENSION|REFERENCE|DOMAIN_BACKING|BRIDGE) to meta.object_catalog for an explicit marker. Until then, object role is DERIVED as in object_roles above.",phrase_resolution_note:"To resolve an analyst's PHRASE to a code, POST /semantic/resolve-domain in phrase mode: deterministic EXACT match on code/description/ACTIVE synonym -> EXACT | AMBIGUOUS (all candidates) | UNRESOLVED. The layer never guesses; ambiguity is surfaced. Booleans are two-value ENUM_LIST (YN_FLAG removed), so they carry descriptions + synonyms like any coded attribute."},lang_tax:{JAVA:{label:"Java / Spring",maps_to_tech:"BE"},SQL:{label:"PostgreSQL / Flyway",maps_to_tech:"DATA"},REGO:{label:"OPA / Rego",maps_to_tech:"POLICY"},TS:{label:"React / TypeScript",maps_to_tech:"FE"},CYTO:{label:"Cytoscape.js (JS)",maps_to_tech:"GRAPH/VIZ"},CYPHER:{label:"Cypher / Neo4j",maps_to_tech:"GRAPH/VIZ"},PY:{label:"Python / FastAPI",maps_to_tech:"BE"}},disposition_model:{purpose:"Against the existing Lextr Core codebase, each sub-task is first RESOLVED (d
