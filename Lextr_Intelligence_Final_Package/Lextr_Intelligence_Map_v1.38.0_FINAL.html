<style>
:root{
  /* Tenant-configurable: a client points a stylesheet at these and nothing else changes. */
  --ink:#12161c; --text:#33404f; --muted:#69788a; --line:#d8dee6; --soft:#f2f5f8;
  --bg:#fbfcfd; --blue:#2f5fd0; --amber:#b8770a; --green:#1f7a48; --red:#b3261e;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--font)}
header{padding:18px 22px 0;border-bottom:1px solid var(--line);background:#fff}
h1{margin:0;font-size:17px;color:var(--ink);letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted);margin:4px 0 14px}
.tabs{display:flex;gap:2px}
.tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
  border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0;background:none}
.tab[aria-selected=true]{color:var(--ink);background:var(--bg);border-color:var(--line);
  margin-bottom:-1px;padding-bottom:10px}
main{padding:20px 22px 60px;max-width:1180px}
h2{font-size:14.5px;color:var(--ink);margin:22px 0 8px}
h2:first-child{margin-top:4px}
p{margin:6px 0 10px;max-width:80ch}
.note{font-size:12.3px;color:var(--muted);max-width:80ch}
.call{border-left:3px solid var(--blue);background:var(--soft);padding:10px 13px;
  border-radius:0 5px 5px 0;margin:10px 0;font-size:13px;color:var(--ink);max-width:82ch}
.call.warn{border-color:var(--amber)} .call.stop{border-color:var(--red)}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:12.4px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  background:var(--soft);position:sticky;top:0}
code{font-family:var(--mono);font-size:11.5px;background:var(--soft);padding:1px 4px;border-radius:3px}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;
  border:1px solid currentColor;white-space:nowrap}
.committed{color:var(--green)} .proposed{color:var(--blue)} .blocked{color:var(--red)}
.in_progress{color:var(--amber)} .ready{color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
input[type=search],select{font:12.5px var(--font);padding:6px 9px;border:1px solid var(--line);
  border-radius:5px;background:#fff;color:var(--text)}
input[type=search]{min-width:220px}
.wave{margin:14px 0}
.wavehd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.node{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 11px;cursor:pointer}
.node:hover{border-color:var(--blue)}
.node.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,95,208,.13)}
.node.dep{border-color:var(--amber);background:#fffdf7}
.node.dependant{border-color:var(--green);background:#f7fdfa}
.nid{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:700}
.ntitle{font-size:12px;margin:3px 0 5px;color:var(--text);line-height:1.35}
.nmeta{font-size:10.5px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}
.legend{font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;border:1px solid;margin-right:4px;vertical-align:-1px}
.detail{border:1px solid var(--line);background:#fff;border-radius:6px;padding:12px 14px;margin:12px 0}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:12.3px}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--text)}
.marker{border-left:3px solid var(--green);padding:7px 11px;background:#fff;border:1px solid var(--line);
  border-left-width:3px;border-radius:0 5px 5px 0;margin:6px 0;font-size:12.3px}
.marker.confidence{border-left-color:var(--blue)}
.marker.completeness{border-left-color:var(--green)}
.marker.accuracy{border-left-color:var(--red)}
.marker.assurance{border-left-color:var(--amber)}
.mk{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hidden{display:none}
.count{font-size:11.5px;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{font:12.5px var(--font);font-weight:600;padding:6px 12px;border:none;
  background:#fff;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.player{display:flex;gap:6px;align-items:center;margin:10px 0;flex-wrap:wrap}
.player button,.lnk{font:12.5px var(--font);font-weight:600;padding:6px 11px;
  border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);cursor:pointer}
.player button:hover,.lnk:hover{border-color:var(--blue)}
.stage{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff;padding:6px}
.crumb{font-size:12px;color:var(--muted);margin:2px 0 10px}
.crumb b{color:var(--ink)} .crumb a{color:var(--blue);cursor:pointer;text-decoration:none}
.step-detail{border:1px solid var(--blue);border-left-width:3px;background:#fff;
  border-radius:0 6px 6px 0;padding:11px 14px;margin:10px 0}
.step-detail.proto{border-color:var(--amber)}
.verbatim{font-family:var(--mono);font-size:11.5px;background:var(--soft);

details{margin:6px 0;font-size:12.3px} summary{cursor:pointer;color:var(--ink);font-weight:600}
details ul{margin:6px 0 10px 0;padding-left:18px} details li{margin:4px 0;color:var(--text)}
.lanechip{font-family:var(--mono);font-size:10px;color:var(--muted)}

#lxrhp{position:fixed;top:0;right:0;width:400px;height:100vh;background:#fff;
  border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(18,22,28,.09);

#lxrhp.on{display:block}
#lxrhp h3{margin:0 0 2px;font-size:15px;color:var(--ink)}
#lxrhp h4{margin:16px 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
#lxrhp .x{position:absolute;top:12px;right:14px;cursor:pointer;font-size:18px;color:var(--muted);
  background:none;border:none}
#lxrhp .scr{border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin:7px 0;background:#fff}
#lxrhp .scr b{font-size:13.5px;color:var(--ink)}
#lxrhp .scr .g{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#lxrhp .scr p{margin:5px 0 0;font-size:12.3px;color:var(--text)}
#lxrhp .none{color:var(--muted);font-style:italic;font-size:12.4px}
.tblchip{display:inline-block;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);
  border-radius:4px;padding:1px 6px;margin:0 4px 4px 0;background:var(--soft);color:var(--ink)}

.tblchip.pending{border-color:var(--green);color:var(--green)}
.tblchip.retiring{border-color:var(--red);color:var(--red);text-decoration:line-through}

.scrcard .bd{padding:11px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.erbox{cursor:pointer}
.erbox:hover rect.body{fill:rgba(47,95,208,.10)}
.er-sel rect.body{fill:rgba(47,95,208,.14)}

.coltbl{font-size:11.8px}

.dim{opacity:.15}
.tierlbl{font-size:10px;font-weight:700;letter-spacing:.06em}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin:10px 0}
.mini > div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff}
.mini b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;

.mini span{font-size:17px;font-weight:700;color:var(--ink)}

.twocol ul{margin:4px 0;padding-left:16px} .twocol li{margin:5px 0;font-size:12.3px}

the NL ↔ Core operation protocol", "status": "proposed", "layer": "product_specific", "wave": "Wave 8", "dep": ["LP-24", "LP-13"], "lanes": 8, "langs": ["JAVA", "PY", "REGO", "TEST", "TS"], "stack": ["AI-RUNTIME", "BE", "POLICY", "FE"], "scope": "The bidirectional protocol between the embedded assist and Core's report builder. CORE REMAINS THE SINGLE OWNER of the in-progress definition; the assist emits OPERATIONS against Core's state and never a whole definition. Includes the closed op vocabulary (8: the 5 built plus set_parameter_default, search_report_store, resolve_line_lineage), preview-before-apply, idempotent apply, echo suppression, optimistic concurrency, fork-on-refine, per-kind refine modes, and the instance/store outcome. EXCLUDES: derived attributes (LP-42), domain-value resolution (LP-43-INT), the graph traversal contract itself (LP-44/ASK_KG_LINE_LINEAGE)."}, {"id": "LP-42", "title": "UC10 Derived attributes — report-local, with a governed promotion path", "status": "proposed", "layer": "product_specific", "wave": "Wave 8", "dep": ["LP-41"], "lanes": 5, "langs": ["JAVA", "PY", "REGO", "TEST", "TS"], "stack": ["AI-RUNTIME", "BE", "POLICY", "FE"], "scope": "SPLIT DELIBERATELY IN TWO. (A) REPORT-LOCAL derivation — fully specifiable and buildable now: a derived attribute is scoped to one report, marked ƒ(x), sits INLINE with the Semantic Layer's own attributes in every list its type belongs to, and is selected on creation. Expressions are grounded on SL attributes only — never a physical column, never free SQL. Candidate definitions for conventions (maturity bands) come from the KNOWLEDGE HUB and training corpus WITH PROVENANCE, offered as proposals the analyst chooses between. (B) PROMOTION to the Semantic Layer — specified here, NOT buildable yet: no contract exists (see pending). Until it does, promotion is unavailable rather than approximated."}, {"id": "LP-45", "title": "UC10 Report Store — the INSTANCE outcome (regulatory first)", "status": "proposed", "layer": "product_specific", "wave": "Wave 8", "dep": ["LP-41"], "lanes": 5, "langs": ["JAVA", "PY", "REGO", "TEST", "TS"], "stack": ["AI-RUNTIME", "BE", "POLICY", "FE"], "scope": "The INSTANCE ask outcome and everything that makes it safe. (1) search_report_store — metadata only, gated, tenant-scoped. (2) The answer-first render: what the artefact IS — status, filed date, who filed it, formats, size — and an opaque storage_ref the HOST resolves. (3) Amendment lineage: default to the latest submitted, keep superseded versions visible. (4) The non-regulatory HAND-OFF: recognise the intent, direct to Core's store, and do NOT claim a copy exists. EXCLUDES: reading any content, constructing any URL, and canned/ad-hoc store contracts (future)."}, {"id": "LP-46", "title": "Domain-value resolution — the Intelligence half of the SL compact", "status": "proposed", "layer": "cross_product", "wave": "Wave 8", "dep": ["LP-41"], "lanes": 5, "langs": ["JAVA", "PY", "SQL", "TEST", "TS"], "stack": ["AI-RUNTIME", "BE", "FE", "DATA"], "scope": "THE FIVE-POINT COMPACT. (1) never infer a value the layer did not return; (2) surface an AMBIGUOUS result with ALL its candidates and never pick; (3) display value_desc, never the raw value_cd; (4) record domain_cd + version_nbr + resolution_basis in the evidence trail for EVERY resolved filter value; (5) do not cache a resolved value beyond the layer's stated TTL. Plus the adapter for POST /semantic/resolve-domain. EXCLUDES the layer's own delivery, and the two SL locale gaps, which belong to LP-40."}, {"id": "LP-44", "title": "Knowledge-graph access layer — the contract four consumers already assume", "status": "proposed", "layer": "cross_product", "wave": "Wave 9", "dep": [], "lanes": 4, "langs": ["JAVA", "PY", "REGO", "TEST"], "stack": ["AI-RUNTIME", "BE", "POLICY"], "scope": "ONE PLACE that owns node and edge types, edge PROVENANCE and rule KIND, traversal bounds, tenancy, snapshot/version, per-purpose readiness, and the NAMED-OP catalogue. Each use case consumes it. EXCLUDES the graph's own construction and content, which are Core's."}, {"id": "LP-47", "title": "UX/UI Integration - one coherent front end on the shared shell", "status": "committed", "layer": "product_specific", "wave": "Wave 8", "dep": [], "lanes": 6, "langs": ["TEST", "TS"], "stack": ["FE"], "scope": "Make the shipped front end BUILD, BOOT and BE REACHABLE as a standalone Intelligence app with a reference host adapter - then keep it that way with a gate that runs in CI. Mount every Intelligence-owned surface; leave Core-owned screens as placeholders that NAME their owner; dispatch the inline answer renderers from the Lexie panel; mount Audit & Evidence at gov-audit behind a switch that is off by default.\n\nNOT in scope, and it stayed out: new use-case features, redesign of any shipped screen, and Core-owned screens - Analytical Reporting above all, where Core owns rendering, execution and workflow and Intelligence contributes an embedded component at an-lexie and ships no screen. features/analytical-assist and features/rules-assist correctly have no surface.tsx, and gate check M3 fails if either grows one."}, {"id": "LP-48", "title": "UI enhancements - ingestion exceptions, on-demand walkthroughs, per-row audit", "status": "ready", "layer": "product_specific", "wave": "Wave 8", "dep": ["LP-08", "LP-47"], "lanes": 5, "langs": ["JAVA", "SQL", "TEST", "TS"], "stack": ["TypeScript/React", "Java/Spring Boot", "PostgreSQL", "Rego"], "scope": ["N1 - Description on an ingestion: a bounded free-text field on the draft, carried onto the document record and displayed on the version detail. Absence is normal for records that pre-date the field and must render as 'none recorded', never as an empty row.", "N2 - the ingestion exception model. Three dispositions (ACCEPTED / REJECTED / FAILED), an ENUMERATED rule set, and a reason on every non-accepted file. Rules: duplicate name within the draft AND within a single batch; empty file; unsupported extension; over the per-file size limit; and, at parse, no text extractor for the format. Per-file removal, bulk-clear of refused files, and readiness that counts ACCEPTED files rather than rows.", "N3 - one 'How this works' component and a flow table per screen: Knowledge Hub, Presets, Runtime Policies, Skill Registry, AI Risk & Controls, Role Mapping, Audit & Evidence, plus the existing Training Data & Models. Each step names who, where and the gate. On demand, and it gates nothing.", "N4 - per-row audit on Model Registry, Training Data & Models (all five tables), AI Risk & Controls (per card, not per row) and Audit & Evidence (in its own table's trailing cell). Eight new record kinds on the existing history drawer.", "SERVER-SIDE IS AUTHORITATIVE for N2. The client rules are a courtesy that fails fast and explains; the same set is enforced on ingestion where the caller cannot skip them. A client-only implementation of this point is not an implementation of this point."]}, {"id": "LP-49", "title": "External witness - the notarization receipt and its WORM anchor", "status": "proposed", "layer": "product_specific", "wave": "Wave 7", "dep": ["LP-26", "LP-06", "LP-32"], "lanes": 5, "langs": ["JAVA", "SQL", "TEST", "TS"], "stack": ["DATA", "BE", "FE", "QA", "OPS"], "scope": "THE WRITER HALF OF TAMPER-EVIDENCE. IN: intelligence.evidence_notarization and its CHECK (chain_valid); a day-range coverage block that NAMES its purged and attested days; chain_discontinuity as a first-class explicable event, so a restore, failover or partition is explained inside the ledger rather than reported as ALTERED or GAP about a legitimate operation; the notary - segment selection, verify-then-notarize, root computation, canonical digest, detached signature, WORM write, receipt persist; the write of head_signature / head_signed_at, which have existed on evidence_chain since D1 and are written by nobody; a FOURTH database role beside LP-26.10's owner / application / retention; the inversion of LP-26.7's unreachability gate; and one wire-through that exercises a REAL immutability lock.\n\nOUT, AND EACH FOR A STATED REASON. THE VERIFICATION ITSELF IS LP-26.9's verify_chain_coverage() AND IS CALLED, NEVER RE-DERIVED - R3's own first cut 'chained rows into a chain the verifier could not see', which is why that function exists, and a second verifier is how two answers start. The append-only fence is LP-26.1's BEFORE UPDATE/DELETE triggers and its lextr.evidence_maintenance GUC, ridden and not re-authored. READING a receipt is lextr.ai.audit_read's (LP-26.12, AUDIT-001..006) and THIS POINT AUTHORS NO REGO LANE, per the v1.26.1 rule that a point with no package of its own gets none; it declares the datum it supplies instead. The receipt digest is declared a MEMBER of LP-06.2's RFC 8785 outside-the-database family and is not a third hashing mechanism.\n\nAND NOT LP-26.8's ARCHIVE RECEIPT. 'Every lawful departure leaves a receipt' records a DEPARTURE - a day that left - while this witnesses a segment that is STILL PRESENT. A DIFFERENT RECEIPT FOR A DIFFERENT EVENT, AND THE TWO MUST NOT MERGE: no column name, state name or query key is shared in either direction, and a lane that reuses one of LP-26.8's names fails. R4's chain-head publisher stays as the cheap honest half and is not the answer - a head written to a log a deployment MIGHT ship off-box is a head we cannot prove left the box, and a column that looks like an external witness and is not one is worse than the NULL it replaced."}, {"id": "LP-50", "title": "Population reconciliation over the reported inventory", "status": "proposed", "layer": "cross_product", "wave": "Wave 7", "dep": ["LP-14", "LP-49", "LP-26", "LP-07"], "lanes": 4, "langs": ["JAVA", "SQL", "TEST"], "stack": ["DATA", "BE", "QA"], "scope": "THE POPULATION, AND THE OBLIGATION IT CREATES. IN: intelligence.population_reconciliation, one row per (tenant, cycle, report_id, version), carrying missing_from_detection, missing_analyses, unreviewed and exempt_below_threshold as IDENTIFIER LISTS and never as counts; five gates - detection_complete, analysis_complete, review_complete, integrity_verified and submission_ready - as GENERATED ALWAYS columns no writer can supply a value for; a structural NOT_AVAILABLE state with an inventory receipt behind RECEIVED; the reconciliation service and its four-population join; the CROSS-PRODUCT CONTRACT for Core's line inventory, its fail-closed path and its ask; and one wire-through that drives the ways completeness could be manufactured and requires each to fail.\n\nOUT, AND EACH FOR A STATED REASON. THE CYCLE AND THE MATERIALITY BAR ARE LP-14.0's (LEX-20, landed v1.32.0) AND ARE READ, NEVER COPIED - a local threshold here would make this a SECOND materiality owner and a local cycle would make it a second population boundary, which is why the dependency is load-bearing rather than a convenience. THE VERIFIERS ARE LP-26.9's verify_chain_coverage() AND LP-49.2's verify_against_receipt AND ARE CALLED - a reconciliation that re-verified a chain would be a THIRD verifier in an estate that has already paid for the second. FOUR EYES IS lextr.ai.evidence_lifecycle's (LP-26.12, BUILT) and its 'a second NAME is not a second APPROVER' rule is REUSED; THIS POINT AUTHORS NO REGO LANE, because a point with no package of its own gets none and two lanes were withdrawn at v1.31.0 for exactly that. THE EXPORT PACK AND THE WORKSPACE ARE LP-26.3's AND LP-26.13's: the reconciliation travels inside them VERBATIM, and their change is a declared REOPENING with an owner rather than a second renderer here.\n\nAND THREE VOCABULARIES KEPT APART DELIBERATELY. LP-26's CoverageState asks whether the ledger's account of a period is complete; this asks whether the population was. LP-45's SUBMITTED_TO_FRB means an agency holds the artefact; submission_ready means we are ready to attest, and neither is derived from the other - LP-45.1/45.3/45.4 spend three lanes keeping generation and workflow apart and a third 'submitted' vocabulary is the collision those lanes exist to prevent. LP-26.8's archive receipt records a lawful DEPARTURE and LP-49's records an external WITNESS; this point reads the second and neither the first nor its names.\n\nTHERE IS NO KNOB, AND THAT IS A DESIGN DECISION WITH A GATE OVER IT. No completeness threshold, no tolerance, no waiver flag, no 'skip reconciliation' and no 'accept partial'. The only permitted deviation is the below-threshold materiality tier, which is data owned by LP-14.0 and read here. A setting of that kind would be a knob whose reader is the control itself, and must not be authored."}, {"id": "LP-51", "title": "Confidence calibration and ongoing monitoring", "status": "proposed", "layer": "product_specific", "wave": "Wave 10", "dep": ["LP-07", "LP-06", "LP-22", "LP-39", "LP-25", "LP-26", "LP-14", "LP-18"], "lanes": 6, "langs": ["JAVA", "PY", "SQL", "TEST", "TS"], "stack": ["AI-RUNTIME", "BE", "DATA", "FE", "QA"], "scope": "A SIGNAL OF WHAT - AND NOTHING THAT MAKES IT ACTIONABLE.\n\nIN. Confidence as a VERSIONED, RE-DERIVABLE formula over DECLARED components, emitted in RunResult and persisting nothing (LP-51.1). The CALIBRATOR: a mapping from the emitted score to an observed outcome, fitted from reviewer decisions with review_decision='correct' counted as a MISS, monotone as a proven property of the fitted object, stratified by determinism_mode, and returning a NOT-CALIBRATED third state below the observation floor (LP-51.2). The PROMOTION RECORD as a third registered kind on LP-22's registered_definition, four-eyes through lextr.ai.mrm_sod, with the absolute and relative thresholds asserted as the SERVICE's before the identity question, and the ongoing-monitoring metric set CONTRIBUTED to LP-26.22's generated pack (LP-51.3). The GOVERNED ROWS - the observation floor and the two promotion thresholds - and the CALIBRATION-FIT READ over agent_run (LP-51.4). The VISUAL GRAMMAR, extending a built rule (LP-51.5). One WIRE-THROUGH on the producer-to-persist boundary (LP-51.6).\n\nOUT, AND EACH FOR A STATED REASON.\nTHE SANCTIONED-USE CLAUSE IS STRUCK. LEX-39 change[0]'s 'the ONE sanctioned use - queue ordering' is not in this point in any form, and no lane, statement, branch or component here filters, ranks or thresholds on the number. The question is raised to the LP-07 owner in parallel and this point is authorable and buildable without an answer.\n'CONFIDENCE IS A SIGNAL, NEVER A GATE' IS NOT RESTATED. It is tested in five places already, two polarity-complete; restating it produces one prompt per copy and one more place to drift (validation_gates.lane_boilerplate). This point CITES it and asserts only what is new: that its own four languages do not break it.\n'PROMOTION GATES ARE DETERMINISTIC METRICS ONLY - NO MODEL-AS-JUDGE' IS NOT AUTHORED HERE. It is LP-39's EXECUTOR-MEASURES-SERVICE-JUDGES and its tests[7], inherited by citation.\n'A DETERMINISTIC FINDING GETS NO SCORE AT ALL' IS NOT AUTHORED HERE EITHER. LP-25 built it (LP-25.3 TEST[4]; LP-25.8 TEST[7]). LP-51.5 asserts it as a REGRESSION on its own extension - the extension may not put back what LP-25 removed - which is an obligation on the new component, not a second rule.\nTHE GOVERNANCE PACK IS NOT AUTHORED HERE. LEX-29 landed at v1.33.0 (LP-26.22 / LP-26.23) and OWNS the generated Art. 11 / Art. 72 pack. The ongoing-monitoring metric set is ROWS CONTRIBUTED to a generator that exists; a second generator over one pack is a second owner and is what no_second_implementation rejects.\nTHE FOUR-EYES IS NOT AUTHORED HERE. lextr.ai.mrm_sod is LP-22.5's, built definition-agnostic 'for exactly this reuse'; LP-39 reused it at OPA-TDM-005 and re-authored nothing. THIS POINT AUTHORS NO REGO PACKAGE AND TAKES NO REGO LANE (policy_cites_its_owner: a point with no package of its own gets none).\nTHE REVIEW-OUTCOME VOCABULARY IS NOT AUTHORED HERE. intelligence.review_decision already spells APPROVE_WITH_EDITS as `correct`, and run_status already carries `corrected` distinct from `accepted`. LEX-13 is being authored in parallel as a JAVA lane on LP-07 and introduces APPROVE_WITH_EDITS and the rendered diff; the two must land ONE vocabulary between them. This point REFERENCES that vocabulary and defines no second spelling - a second spelling is B1's exact shape in a schema that already holds a live instance of it.\nNO SECOND REGISTRY, NO SECOND MONITOR, NO SECOND RENDERER, NO SECOND WRITER. The calibrator is a third KIND on LP-22's table, not a store of its own. LP-39's field correction rate is CONDITIONED on the score bucket and not replaced, and TWO-CLOCKS-NEVER-MIXED survives - the unconditional monitor keeps being emitted unchanged. LP-25.8's component is EXTENDED. LP-06.1 remains the sole owner of every statement against agent_run and agent_run_step, and LP-51.4 authors a scoped READ only, argued the way LP-07.1's reads are argued and no other way.\n\nTHE KNOBS ARE THREE AND EACH HAS A NAMED READER. The observation floor and the absolute and relative promotion thresholds are governed catalogue rows carrying type, bounds, consequence class and one sentence of blast radius, effective-dated and superseded rather than updated, riding LP-46.0's effective-window mechanism because a second effective-dating mechanism is what no_second_implementation forbids. adoption_standard.no_knob_without_a_reader requires the other half and the item did not state it: validation_gates.config_is_read over each, with the reader named - the floor is read by LP-51.2's fit, the two thresholds by LP-51.3's promotion path - and each reader reachable from its composition root. WHAT STAYS CODE: the fitting procedure and the MONOTONICITY CONSTRAINT, because a configurable monotonicity is a configurable safety property."}, {"id": "LP-59", "title": "Approval workflow substrate - one chain engine, five callers, one ledger", "status": "proposed", "layer": "platform", "wave": "Wave 11", "dep": ["LP-06", "LP-22", "LP-26"], "lanes": 9, "langs": ["JAVA", "PY", "REGO", "SQL", "TEST", "TS"], "stack": ["Java/Spring Boot", "Python/FastAPI", "OPA/Rego", "React/TypeScript", "PostgreSQL"], "scope": "The shared approval engine, its five specs, the entitlement rule in Rego, the two shared displays, the inherited-authority declaration, the estate ledger, and one actor directory. NOT the capability-specific screens: those belong to LP-08, LP-12, LP-22, LP-39 and LP-56, which consume this."}, {"id": "LP-60", "title": "To-do inbox and approvals - two entry points, one decision", "status": "proposed", "layer": "product_specific", "wave": "Wave 12", "dep": ["LP-59", "LP-07"], "lanes": 4, "langs": ["JAVA", "REGO", "TEST", "TS"], "stack": ["OPA/Rego", "Java/Spring Boot", "React/TypeScript"], "scope": "The routing policy, the inbox service that reads pending steps from the chains LP-59 owns, the two surfaces and the header control that selects between them. NOT a second approval engine, NOT a second view of the ledger (LP-26 owns that), and NOT the Core inbox itself - Core owns its own screen; this point owns the contract it renders from."}, {"id": "LP-57", "title": "Knowledge Hub assurance - a third vocabulary, measured per document", "status": "proposed", "layer": "product_specific", "wave": "Wave 12", "dep": ["LP-08", "LP-59"], "lanes": 7, "langs": ["JAVA", "PY", "REGO", "SQL", "TEST", "TS"], "stack": ["Python/FastAPI", "Java/Spring Boot", "OPA/Rego", "React/TypeScript", "PostgreSQL"], "scope": "The assurance track: the exam contract, the runner that drives the real retrieval path, the grading of an answer, the OPA gate that turns a measurement into a decision, the three ledger actions, per-document storage, and the surface. NOT retrieval itself (LP-08), NOT confidence calibration (LP-51), and NOT the review queue (LP-07) - assurance produces a judgement that the queue may carry."}, {"id": "LP-58", "title": "Training-data sandbox - a probe, non-evidential by construction", "status": "proposed", "layer": "product_specific", "wave": "Wave 12", "dep": ["LP-39", "LP-59"], "lanes": 5, "langs": ["JAVA", "PY", "REGO", "TEST", "TS"], "stack": ["Python/FastAPI", "Java/Spring Boot", "OPA/Rego", "React/TypeScript"], "scope": "The sandbox: the probe runner, the guard that keeps its output non-evidential, the pre-run masking check, the NON_EVIDENTIAL ledger track, and the surface. NOT dataset lifecycle (LP-39), NOT the fine-tune executor (LP-39.4), NOT assurance (LP-57) - the sandbox exists partly to be the thing assurance is not."}, {"id": "LP-52", "title": "The parsing seam - Docling behind a replaceable adapter", "status": "proposed", "layer": "product_specific", "wave": "Wave 12", "dep": ["LP-08"], "lanes": 6, "langs": ["PY", "REGO", "TEST"], "stack": ["Python/FastAPI", "Docling", "OPA/Rego"], "scope": "docling-serve as its own service, the pipeline configuration, the ChunkAdapter and the ParsedChunk contract, the label decisions in their four owned lists, the traversal reconciliation, and the tool_scope registration. NOT chunking (LP-53), NOT provenance or OCR verification (LP-54), NOT footnote association (LP-55), NOT drop profiles (LP-56)."}, {"id": "LP-53", "title": "Chunking and the two-table split - one element is not one vector", "status": "proposed", "layer": "product_specific", "wave": "Wave 13", "dep": ["LP-52", "LP-08", "LP-31"], "lanes": 5, "langs": ["JAVA", "PY", "SQL", "TEST"], "stack": ["Python/FastAPI", "Java/Spring Boot", "PostgreSQL", "pgvector"], "scope": "The chunker and its four rules, the V47 migration including the vector-store re-point, the DAO and query changes, and the wire-through. NOT the parser (LP-52), NOT provenance (LP-54), NOT the footnote edge tables (LP-55) - though this point's chunk boundaries are what LP-55's association resolves against."}, {"id": "LP-54", "title": "Provenance - OCR, read-or-recognised, and figure verification", "status": "proposed", "layer": "product_specific", "wave": "Wave 13", "dep": ["LP-52", "LP-10"], "lanes": 6, "langs": ["PY", "TEST", "TS"], "stack": ["Python/FastAPI", "Docling", "RapidOCR", "OPA/Rego", "React/TypeScript", "PostgreSQL"], "scope": "OCR configuration and the language seam, text_source attribution against an independent extractor, figure verification, the completeness check's refusal to speak for OCR'd pages, and the viewer marking. NOT the parser (LP-52), NOT chunk grouping (LP-53) - though text_source rolls up there."}, {"id": "LP-55", "title": "Footnote association - a marker in the content reaches the note that defines it", "status": "proposed", "layer": "product_specific", "wave": "Wave 14", "dep": ["LP-52", "LP-53"], "lanes": 6, "langs": ["JAVA", "PY", "SQL", "TEST", "TS"], "stack": ["Python/FastAPI", "PostgreSQL", "Java/Spring Boot", "React/TypeScript"], "scope": "Superscript capture, the association algorithm, the edge tables, and the retrieval join that carries notes alongside a match. NOT the parser (LP-52) or chunking (LP-53), though this depends on both. NOT cross-document references - scope is the page."}, {"id": "LP-56", "title": "Drop profiles - what a parse deliberately does not ingest, governed", "status": "proposed", "layer": "product_specific", "wave": "Wave 14", "dep": ["LP-52", "LP-54", "LP-59"], "lanes": 5, "langs": ["JAVA", "PY", "REGO", "TEST", "TS"], "stack": ["Python/FastAPI", "OPA/Rego", "Java/Spring Boot", "React/TypeScript", "PostgreSQL"], "scope": "The candidate proposer, the profile as a governed versioned artefact, the per-document declaration at ingest, the OPA gate, and the surface the SME rules on. NOT the label decisions inside the adapter (LP-52.4), which are engineering's four lists - this point governs the DOMAIN half."}], "stack": {"backend": "Java 17, Spring Boot — intelligence-service (control plane, SOLE DB writer, package com.lextr.intelligence); Controller->Service interface->DAO interface->Impl; NamedParameterJdbcTemplate (no JPA); SQL externalized in queries.properties via SQLQueryLoaderUtil; global Jackson SNAKE_CASE", "python_service": "Python 3 / FastAPI (Uvicorn, Pydantic) — lexie-ai AI runtime; holds NO DB grant, never persists; emits RunResult for intelligence-service to write; bounded skills (Skill 1 resolve / Skill 2 graph walk / Skill 3 assembly = only SLM caller) STACK DECISION 2026-09-13 adds the libraries the running service already depends on and the manifest had never named: starlette and python-multipart (both arrive under FastAPI rather than being chosen - multipart is what accepts an uploaded file and should be pinned, since an unpinned parser on the upload path is also an attack surface); pydantic-settings for typed settings; PyYAML for config, read with safe_load ONLY, because the default loader executes constructors and any config path that is not fully trusted makes that a security control rather than a style preference; pandas and numpy for tabular and vector work.", "database": "PostgreSQL 16 + pgvector; schema `intelligence`; Flyway-owned DDL (no JPA); embedding_store vector(384) STACK DECISION 2026-09-13 adds pglast: migration SQL is parsed in tests WITHOUT standing up Postgres. It came from the running estate rather than from this manifest, and it is the clearest case in the stack review of something the target state should take rather than replace.", "graph": "Neo4j (calc-chain / KG; GPL-3 licensing decision open); Cytoscape.js + ELK for lineage/DAG visualization (react-cytoscapejs prohibited). STACK DECISION 2026-09-13: ELK REPLACES DAGRE as the layout engine. ELK HERE IS THE ECLIPSE LAYOUT KERNEL, reached through cytoscape-elk - NOT the ELK stack (Elasticsearch/Logstash/Kibana), which the estate catalogue lists under observability. Same three letters, two technologies, one estate; a developer reading 'ELK' in a stack list will not stop to wonder which. It is the owner's standard, and Dagre is REJECTED rather than merely unused. Cytoscape.js is the renderer and the two engines are alternatives, so keeping both would mean two engines placing the same nodes differently. TWO CONSEQUENCES, OR THE DECISION DOES NOT LAND. (1) validation_gates.CYTO's layout clause reads 'no node position is NaN - dagre returns NaN for a disconnected node and the canvas then renders empty with no error'. That clause was written about the engine being replaced; a clause naming dagre's behaviour proves nothing about ELK, and left unchanged it is a gate that reads as coverage and is not. The assertion itself still binds - render a fixture, assert counts, assert no NaN - and must be re-derived against ELK. (2) The DETERMINISM assertion binds whichever engine is chosen: the same fixture laid out twice must produce the same positions.", "models": "SLM-first: Qwen3-4B default (configurable per deployment/tenant), LLM integration-ready for licensed clients; embeddings all-MiniLM-L6-v2 384-dim; fine-tuned variance+rules SLM (4,000+ samples) STACK DECISION 2026-09-13: BOTH TIERS, not one. openai is adopted as the hosted connector alongside the local SLM - so the deployment question is settled as SaaS and on-prem behind the same port, and model resolution per deployment and tenant stops being optional. is_local on the model_registry row is what OPA reads to decide whether a model may see MNPI; a hosted connector cannot serve the on-prem tier and the flag is what prevents it being tried. EMBEDDING: all-MiniLM-L6-v2 at 384 was DECIDED, and V20260910_06 has since registered Qwen3-Embedding at 768 as a candidate in a sibling table for measurement against it. The decision stands until the numbers replace it. One thing the measurement must account for: all-MiniLM-L6-v2 truncates input at 256 word pieces and the chunker emits 3000-character chunks.", "frontend": "React 18, MUI, TypeScript — intelligence-ui; Zustand stores; recharts; lucide-react (ISC) or @mui/icons-material; embeddable (npm / Module Federation / Web Components); token-only, brand-free", "cache_realtime": "STOMP with polling fallback for /run results STACK DECISION 2026-09-13 adds redis, which the running estate already uses and this manifest named only inside a defect. THE CACHE IS NOT THE DEFECT AND IS ADOPTED; what is forbidden is unchanged - a sample-row cache is a DATA STORE carrying its source dataset's classification, and actual values are refused in a grounding payload. Cache dataset metadata that carries no values.", "identity_authz": "Keycloak (OIDC/OAuth2) + OPA/Rego (policy-service); service-JWT on lexie-ai", "deploy": "Docker, Kubernetes, Helm; on-prem (SLM local, no external LLM API — MNPI stays on-site) and SaaS (shared SLM inference pool default; per-tenant isolated inference premium)", "observability": "health/readiness/liveness; OPENTELEMETRY IS THE OBSERVABILITY STANDARD - instrumentation AND transport, for metrics, traces and logs alike, exported over OTLP to a configured collector endpoint. STACK DECISION 2026-09-13 adds langfuse for LLM-call tracing and loguru for structured logs. AMENDED 2026-09-14 IN TWO STEPS. First OTel was adopted as instrumentation with Prometheus retained as the store. Then the owner ruled OTel ONLY: Prometheus is REJECTED and no longer named in this stack. The earlier wording - that the 2026-09-13 decision 'DROPS the second tracing backend' - is WITHDRAWN; it rested on treating OTel and Prometheus as two tools for one job. WHAT THIS DEFERS, AND IT IS NOT A DETAIL. OpenTelemetry is not a database and not a UI. It produces telemetry and ships it; SOMETHING MUST TERMINATE OTLP AND STORE WHAT ARRIVES, and this manifest no longer names what. That is deliberate: the destination is now DEPLOYMENT CONFIGURATION - an OTLP endpoint - rather than a stack entry, which is the strongest form of vendor neutrality and the reason to go OTel-only. It is also a REAL GAP until a deployment names one. A build that emits OTLP into nothing loses every metric silently, so the endpoint is a required setting and an unset one FAILS STARTUP rather than defaulting to a no-op exporter. HEALTH ENDPOINTS ARE UNAFFECTED. health/readiness/liveness are plain HTTP and belong to no vendor; they stay, and an operations team reads them first whatever collects the metrics. NAMING: OTel semantic conventions are dotted - http.server.request.duration. Emit them as they are. Any translation into another convention is the receiving backend's job, and doing it in the application produces two names for one metric. THE EXPOSURE RISK GROWS WITH THIS CHANGE AND MUST BE READ AS PART OF IT. Two paths now carry content off the process. (1) langfuse: tracing captures prompts, prompts here can carry MNPI, so a hosted trace store is an egress path and passes the same gate as any other outbound call. (2) OTel AUTO-INSTRUMENTATION IS THE NEW ONE and it is worse, because nobody chooses what it captures: the standard conventions record HTTP routes, database statements and their parameters as span attributes, and a db.statement attribute on this platform can carry a ledger value or a client identifier that no developer decided to emit. Auto-instrumentation is enabled deliberately and per library, never wholesale, and attribute redaction is configured BEFORE it is turned on rather than after the first trace. THE OTLP ENDPOINT IS ITSELF AN EGRESS DESTINATION: if it is outside the estate it passes the same gate as any other outbound call, and on the on-prem tier it must terminate inside the building.", "document_parsing": "Docling (self-hosted docling-serve) - MIT, hosted by the LF AI & Data Foundation. Layout + TableFormer. Models pinned BY COMMIT in the image, never fetched at runtime: docling pins its package version and NOT its weights, so an unpinned model means two builds a month apart can carry different parsers reporting the same version. STACK DECISION 2026-09-13 keeps pypdf and python-docx ALONGSIDE Docling, routed by file type. Layout awareness is what makes a table survive as a table, and it is worth a second service for a PDF filing; paying for a layout model on a .txt or a plain .docx is waste rather than rigour. Both readers are named so the routing is a stated design and not a leftover.", "ocr": "RapidOCR, engine PINNED - the default is 'auto', which lets the library choose the licence surface at runtime. Languages en/japan/es pinned by sha256; these files have no commit in the layout. build_options() REQUIRES lang and raises if omitted: RapidOcrOptions() defaults to Chinese, and pinning the engine while defaulting the language is the same defect one level down.", "agent_runtime": "agno (Python) - Agent, Knowledge and vector-store abstractions behind retrieval, the MDRM reranker and the legacy chat surface. DECLARED HERE BECAUSE IT WAS INVISIBLE: at v1.37.0 the manifest contained ZERO word-boundary occurrences of agno or langgraph while the running estate depended on both, so a developer generating any point built around a framework nobody had told them was there. A plain substring search returns 37 hits and every one is inside 'diagnostic' or 'agnostic' - counting the word reported the dependency as well covered. USE IT FOR ITS KNOWLEDGE AND RETRIEVAL ABSTRACTIONS, NOT FOR ITS AGENT LOOP: an agent framework's value proposition is autonomy and this estate's stated constraint is bounded skills, at most eight steps, no free-roam. That is not a prohibition on the library, it is a prohibition on the affordance - and validation_gates.step_ceiling is what makes the difference provable rather than intended. langgraph is present in the source estate as an alternative runtime adapter and is NOT adopted; a second orchestration runtime is a second place the ceiling can be missed.", "object_store": "boto3 (S3) and google-cloud-storage (legacy GCS) behind one ObjectStore port, selected per deployment; an UNBOUND store is a supported configuration. STACK DECISION 2026-09-13 declares a category the manifest never had, while LP-06's evidence work depended on one - content-addressed payload objects keyed on payload_hash, written inside the persist transaction, with an archive-write failure REFUSING the flush. The running estate arrived at the same need independently and keeps the uploaded object when a parse fails, which is the property LP-06 needs. THE TWO FAILURE CONTRACTS DIFFER AND ARE NOT RECONCILED HERE: the running system keeps the object and marks the document FAILED; LP-06 rolls the whole trace back on an archive-write failure. Same event, two promises."}, "gates": {"rule": "A gate, not a test count. a survivor is not a pass; a count is not a check.", "positive_control": "Any check whose healthy answer is ZERO needs a positive control. 'No dead seams' is also what a blinded scanner reports. Point the check at something that DOES have the thing, and prove it goes red.", "execute": "Execute, don't just resolve. A slice can be BUILT and unreachable; a path can RESOLVE and not bind; a renderer can be IMPORTED and never dispatched; a destination can be REFERENCED and render nothing. A parse gate is not a reference check. THIS CLAUSE NAMES THE SECOND AXIS OF THIS BLOCK, and it is named because it sat unlabelled among clauses about something else for thirty releases. AXIS ONE IS BLINDNESS - can the checker SEE the thing? positive_control, declare_tools, generated_gate, manifest_integrity, prompt_coverage, status_coherence and generated_prompt_review all answer that, and all six known_defect_classes are instances of it. AXIS TWO IS CONNECTEDNESS - is the thing REACHED by production? This clause, config_is_read, reachable_from_root, surface_reachability and wiring_contrast answer that. `rule` and `mutation` bind both axes. The per-language rows (JAVA, PY, TS, REGO, SQL, TEST, CYTO) and wire_through, lane_boilerplate and reason_code_registry are lane and authoring rules sitting under neither; not a third axis. WHY NAME THE AXIS RATHER THAN LEAVE IT IMPLICIT: an unnamed axis is why a reader adds the sixth blindness gate and never the first connectedness gate - the observed history of this block. A CONNECTEDNESS FAILURE IS NOT A COVERAGE FAILURE and no coverage number will ever show one. Every gate on axis two ships the mutant that turns it red, per `mutation`.", "declare_tools": "every tool a gate invokes must be a declared dependency - a gate needing an undeclared tool is green for the wrong reason on exactly one machine", "JAVA": "mvn test with JUnit; assert the layering (Controller -> Service interface -> DAO interface -> Impl) and that no SQL is inline. There is no JDK in the authoring sandbox, so NEVER claim Java compiled that has not.", "PY": "py_compile plus an AST pass over every new module before any behavioural test; then pytest. A module that imports is not a module that binds.", "TS": "esbuild parse-gate over all src/*.ts(x), then tsc --noEmit, then a REAL-DOM render test via jsdom. All three: the parse gate does not resolve identifiers and the typecheck does not mount.", "REGO": "opa test against a real OPA binary - never a Python mirror alone. Where a mirror exists, differential-test it against the binary across enumerated cases.", "SQL": "apply the migration and round-trip it; assert the constraint fires, not only that the column exists.", "TEST": "the suite must be shown able to FAIL. Ship the mutants with it.", "mutation": "You must mutation-test the gate you write: if no mutant can break a rule, that rule is not being tested. Ship the mutants with the suite.", "wire_through": "A wire-through gate is required only where a point actually crosses a boundary its own lanes cannot cover - a wire contract with a host pin, the lexie-ai producer to the Java persist, or ingest through pgvector and out to a policy seam. A single-lane point has no layers to cross and gets no wire-through sub-task. Where one is required it must name the boundary and assert an invariant that neither side can assert alone; '>=90% combined coverage' and 'contract honored end-to-end' are governance_constraints[7] and definition_of_done and are not a test.", "lane_boilerplate": "A sub-task whose scope restates a build_context standard is not a unit of work. The standard applies to every lane of its language by default and is asserted by that language's gate; repeating it per point produces one prompt per copy and one more place to drift. Twenty-six such sub-tasks were merged at v1.25.0 - see meta.v26_merge_register. A sub-task earns its place by naming what is true HERE and nowhere else.", "generated_gate": "Where a standard is already a table, the gate is GENERATED from the table rather than written as prose beside it. error_conventions.mapping is the worked example: exception FQN -> status -> is_decision -> rationale generates its own conformance test, so an unmapped exception fails the build instead of falling silently to the catch-all.", "manifest_integrity": "The shipped manifest must be byte-identical to what its generator produces from the manifest object, and the verifier RE-RUNS the generator rather than trusting a recorded hash - so 'I only changed one point' is a proof and not a claim. Every release re-runs it, and the release that does not is the one where a hand edit survives. The per-release rebaseline (timeline row, package name, counts) is owned by the packaging point of that release, never by a feature point, because a feature point pins the version it was written against and then goes stale in the only direction that still looks fine. Promoted from LP-47.7 at v1.26.0, where it was pinned to stable_v20 and had not been re-run for five minor versions.", "reason_code_registry": "THE CODE SET IS GENERATED, NEVER HAND-MAINTAINED, AND FOR POLICY CODES IT IS GENERATED FROM THE REGO BUNDLE. Every package returns allow plus deny_reason (the pack's '## REGO BUNDLE SPEC' section, nineteen rows, RUN.md:931-957 - NOT AMD-RUN-48, which v1.28.0 cited in error; see meta.v29_corrections), so THE BUNDLE IS THE POLICY-CODE VOCABULARY. A service-side enum of policy codes would be a second copy of a policy living in application code, which is the thing policy externalisation exists to prevent - and the copy would drift silently, because nothing would fail when the bundle changed. Domain reason codes are generated the same way from the enumerated rule tables that own them; LP-48.2's ingestion rule table is the worked example, where 'a rule added to the table without a code fails the build'. THREE BUILD FAILURES: a policy_code emitted by a service that resolves to no rule in the bundle; a code with no rendering in a shipped locale, per LP-40.tests_must_cover[2] where 'a missing one FAILS THE BUILD rather than falling back silently to English'; and a rule or deny path carrying no code. THE VERBATIM GUARANTEE SURVIVES THIS AND IS NOT WEAKENED BY IT. LP-38 already ships deny reasons 'character-locked across Java/Rego/mirror' and LP-38.tests_must_cover names 'the char-exact verbatim deny reason'. A governed rendering that is byte-identical for a given code is therefore machinery the estate has already built and proven. Verbatim stops travelling as prose and starts travelling as a code whose rendering is locked - which is strictly stronger, because a locked rendering can be diffed and a composed sentence cannot.", "CYTO": "the SAME three front-end gates as TS - esbuild parse, tsc --noEmit, and a mount - because a graph component that parses and type-checks can still throw on its first layout run. PLUS TWO THIS LANE OWNS. (1) A LAYOUT ASSERTION: render a fixed fixture graph and assert node and edge COUNTS and that NO NODE POSITION IS NaN OR UNDEFINED, and that every node has a position at all. THE ENGINE CHANGED AND THE CLAUSE HAD TO BE RE-DERIVED, NOT INHERITED: this read 'dagre returns NaN for a disconnected node and the canvas then renders empty with no error' - a statement about the engine ELK replaced at the 2026-09-13 stack decision. A clause naming dagre's behaviour proves nothing about ELK, and left standing it would have been a gate that reads as coverage and is not. WHAT SURVIVES THE SWAP IS THE FAILURE MODE, not the mechanism: a layout engine that cannot place a node has to say so, and the ways it can fail to say so are engine-specific. So the fixture MUST include a disconnected node and a node with no incoming edges, the assertion covers NaN, undefined and absent alike, and whoever adopts ELK reads its own behaviour on that fixture rather than assuming it inherits dagre's. (2) A DETERMINISM ASSERTION: the same fixture laid out twice produces the same positions, because a layout that varies per run cannot be screenshot-tested and cannot be reviewed. lang_tax has declared CYTO since v1.0 and this table covered six of its seven languages, so LP-17.2 has been silently taking validation_gates.TEST - the CROSS-LAYER WIRE-THROUGH gate - as its acceptance bar.", "prompt_coverage": "EVERY build_context KEY REACHES A PROMPT OR DECLARES WHY IT DOES NOT. The generator renders its standards blocks from bc.prompt_contract.emit rather than from a list written inside workPrompt(), and this gate asserts that the union of prompt_contract.emit[].key and prompt_contract.exempt covers build_context EXACTLY - a key in neither FAILS THE BUILD, and an exempt entry with no reason string fails too. It runs at the sub-key level for the two blocks that name their keys (error_conventions, validation_gates), because that is where the last five releases lost their clauses. WHY THIS GATE EXISTS: changelog_v1_23_0 states the principle - 'a standard that does not survive into the generated text is not enforced' - and v1.24.0 restates it. Between v1.25.0 and v1.29.0 this programme added TWENTY-SEVEN clauses and wired NONE: error_conventions.gate, .reason_ref, .error_detail, .status_follows_the_rule; validation_gates.wire_through, .lane_boilerplate, .generated_gate, .manifest_integrity, .reason_code_registry; and all seventeen of adoption_standard. A principle stated in a changelog is not a gate. This is the gate.", "status_coherence": "A POINT WHOSE STORED STATUS DISAGREES WITH ITS LANES FAILS THE GATE. Every status must be one of build_context.status_model.point_states, and a point stored `ready` while holding a `blocked` lane is the disagreement blocker B4 named: 'both ready_at_start points have zero startable sub-tasks ... a generator driving off sub-task status emits nothing.' The gate also asserts that every sub-task-level depends_on names a real point id and is a SUBSET of nothing - a lane may depend on LESS than its point but never on a point that does not exist. THIS GATE FAILS TODAY, on LP-01, LP-02 and LP-48, and it is meant to: B4 is an open blocker and a gate that passes over an open blocker is decoration.", "generated_prompt_review": "GENERATE ONE PROMPT PER LANGUAGE AND READ IT, before a release is called done. Seven prompts, one per lang_tax entry. This is the cheapest gate in the manifest and the last one added, because three defects got past every check that came before it: v1.30.0 gated the generator's COVERAGE (every build_context key reaches a prompt) and v1.31.0 measured the DATA (every lane has a scope, tests, a layer, a gated language) - and neither of them CALLED workPrompt. A field can be present, non-empty, unique and correctly typed, the generator can emit every declared block, and the output a developer receives can still say 'undefined'. THE THREE IT WOULD HAVE CAUGHT, all at v1.31.0: a point field of the wrong TYPE, which threw; adjustments in the wrong SHAPE, which rendered as undefined; and a hardcoded '>=90%' in a heading whose list had just had the same bar removed. Assert per prompt: it is produced without throwing, no line contains 'undefined' or 'null', every '## ' block has at least one line under it, and the scope and tests are the sub-task's own. CALIBRATING THIS GATE TOOK TWO ROUNDS, and that is recorded because validation_gates.positive_control requires a gate to be shown able to FAIL and this one had to be shown able NOT to. Its first formulation flagged any line ending in a colon - 'Report these sections, then proceed:' - and any line containing NaN, which the CYTO gate uses correctly ('dagre returns NaN for a disconnected node'). Both were the GATE being wrong, not the prompt. The diagnostic artefacts are `undefined` and `[object Object]`: strings a template produces and prose never does. A gate that cries wolf is switched off within a week, so over-firing is a defect in the gate exactly as under-firing is. THE PATTERN IS PART OF THE STANDARD, because three successive approximations of it all over-fired and the next person will otherwise re-derive a fourth. Flag exactly: `[object Object]`, and `undefined` ONLY where a template would put it - `[undefined]`, `: undefined`, `= undefined`, `(undefined)`, or a line ENDING in undefined. Do NOT flag the bare word: 'no acceptance line cites an undefined decision id' (LP-37.2) is correct English, as are a trailing colon and the NaN in the CYTO gate. Assert additionally that the prompt is produced without throwing, that every `## ` heading has a line under it that is not another heading, and that the scope printed is the sub-task's own. SCOPE OF THE ARTEFACT CHECK, and it took a fourth calibration to get right: the check runs on the DATA-DERIVED parts of a prompt - the header, scope, tests, contracts, background and corrections, which differ per lane - and NOT on the build_context standards blocks, which are fixed prose reviewed once. THE REASON IS STRUCTURAL AND NOT A CONVENIENCE: this clause QUOTES the artefacts it detects, including the literal 'layer=undefined' that v1.31.3 found on LP-37, so from the moment it reached every prompt it flagged every prompt - 158 of 158, all on its own text. A detector whose specification is emitted alongside the thing it detects will always find itself, and the only correct answer is to scope it to the data rather than to weaken the pattern.", "config_is_read": "THIS CLOSES A CITATION THE MANIFEST MAKES AGAINST ITSELF. adoption_standard.no_knob_without_a_reader, added at v1.27.0 AFTER this harvest, binds every adopted item: 'No item may specify a catalogue, a setting or a governed row without validation_gates.config_is_read over it.' Until now `config_is_read` occurred EXACTLY ONCE in the manifest - in that sentence - and it was the ONLY dangling validation_gates citation in the file; the other eighteen resolve. So a binding clause cited a gate that does not exist, and every catalogue adopted since has cleared a bar nobody could run. THE RULE: every key in a settings object, and every row of an operator-facing configuration catalogue, is READ by at least one module that is NEITHER the settings object NOR the catalogue. A self-read does not count - a settings class validating its own bounds proves the class parses - and the reader must satisfy reachable_from_root, or the key is read only by code production never runs. WHY NOT COVERAGE: the source estate catalogued FOUR settings with types, bounds and audit rows that no code read, each 'tested' green by the catalogue's round-trip. THE VIOLATION IS A COMPLETE RECEIPT FOR A CHANGE THAT DID NOTHING - the knob is set, the audit row written, behaviour unmoved, and nothing errors. Ships its mutant per `mutation`: delete the one production read of a key; this goes red, every other suite green.", "reachable_from_root": "Every public entry point of a service module is reachable from the COMPOSITION ROOT by STATIC reference - the Spring bean graph and component scan, the FastAPI app factory and its router includes, the front end's route registry. COVERAGE IS NOT CONNECTEDNESS, and that is the whole argument: coverage measures whether code ran UNDER TEST, never whether production runs it, so a module can be 97% covered and referenced by nothing but its own tests. The source estate's cost-routing module was exactly that while audit/model_documentation.py reported tiered routing and cost control to a model-risk validator as DEPLOYED. THIS ESTATE HAS PRODUCED THE SAME DEFECT FIVE TIMES ON ITS OWN RECORD - `record_traversal` with no honest caller, the read gate with no caller, `EvidenceDeploymentProperties` with no caller at all - so the class is vindicated here, not imported. A TEST FIXTURE IS NOT A CALLER: a reference reached only from tests/ is excluded from the reachable set BY CONSTRUCTION, because counting it is how the defect hides. WHY NOT A 'PENDING WIRING' LIST: a module with no path from the root is either wired or deleted, and 'kept for later' is how an estate grows a second, unreachable implementation. Ships its mutant per `mutation`: remove ONE bean registration or router include - this goes red and the unit suite stays green, which demonstrates the suite was never asking.", "surface_reachability": "Extract every API path the SHIPPED front-end artefact actually calls - from the BUILT bundle, not the source tree, because a call site removed by tree-shaking is not a call and a path assembled at runtime is - normalise interpolation to a path parameter (`/runs/${id}/steps` becomes `/runs/{id}/steps`), match PATTERN-AWARE against every route registered in intelligence-service, and assert the difference is EMPTY IN BOTH DIRECTIONS. Two sets, two failures. A call with no route is a screen that 404s in production and passes every front-end test against a mock. A route with no caller is a surface nobody reaches; governance_constraints[12] already fails the build when 'a UC surface has no backing /run path', but without ever inspecting the artefact that ships. WHY PATTERN-AWARE AND NOT STRING EQUALITY: a literal compare reports the whole inventory as unmatched the moment one route takes a path variable, and a gate that cries wolf is switched off within a week - the calibration argument generated_prompt_review records after three over-firing tries. WHY THE ARTEFACT AND NOT THE ROUTER TABLE: `execute` already says a path can RESOLVE and not bind. THE VIOLATION LOOKS LIKE NOTHING IN EVERY EXISTING LANE - esbuild parses it, tsc types it, jsdom mounts it, and the fetch still goes nowhere. Ships its mutant per `mutation`: rename one registered route; this goes red, the TS gates do not.", "wiring_contrast": "Any capability whose behaviour depends on configuration ships a MATCHED PAIR of tests, and neither half is optional. CONFIGURED: the capability runs and its artefact APPEARS in the record - the evidence row, the audit entry, the emitted file, whatever it claims to produce. UNCONFIGURED: the SAME run SUCCEEDS and the artefact is ABSENT. ONE TEST ALONE PROVES NOTHING, which is why the pair is the unit. A configured-only test passes against a capability that would emit its artefact regardless of the setting, so it never shows the configuration is read. An unconfigured-only test passes against a capability that emits nothing under any setting - the dead-knob defect config_is_read exists to catch. Only the pair distinguishes OFF from BROKEN, and an operator reading a run record has no other way to tell them apart. THE UNCONFIGURED HALF ALSO OWNS A MESSAGE: the bootstrap note must name WHICH key is unset and WHAT to set it to - a degradation nobody can name is one nobody can fix, the third definition_of_done line this axis adds. NOT COVERED BY positive_control: that proves a check whose healthy answer is zero can go red; this proves a capability's OUTPUT tracks its INPUT. Ships its mutant per `mutation`: hardcode the artefact's emission so it appears in both halves - the unconfigured half must go red, and if it does not, the pair was two copies of one test.", "one_engine_five_callers": "A shared governance function is DEFINED EXACTLY ONCE and used by at least five callers. Defined twice is drift starting; used by fewer than five means a capability has grown its own. Applies to chainBuild/chainEntitlement/chainAdvanceOn and to chainRing/chainSegs.", "inherited_authority": "A capability where capabilityGoverns() is false must NOT render a StepRing or TrackStrip. The build fails if one does, and names the capability and component. A surface showing a workflow it does not own IMPLIES AN APPROVAL THAT NEVER HAPPENS.", "nobody_holds_platform_admin": "No actor in the directory holds platform_admin. Two directories once disagreed about who held which role and one carried this actor - a role nobody holds in the real directory, so every entitlement test passed for the wrong reason. N2 is the open question of who should; until answered, nobody does.", "step_ceiling": "EVERY LOOP HALTS AT A CEILING IT DID NOT CHOOSE, AND THE HALT IS RECORDED. `bounded` occurs 102 times in this manifest, `free-roam` 22 times and always negated, and until this gate NOTHING EXECUTED ANY OF IT. A constraint repeated a hundred times and asserted zero times is a paragraph, and validation_gates.rule already says a gate is not a test count - this is the same argument one level up: a gate that nothing runs is a comment. THE RULE: any code path that can call a model more than once - Skill 3 assembly, the graph walk, an agent-framework loop, a retry - reads its ceiling from the resolved PresetSnapshot or governance_envelope (max_steps, and the cost ceiling beside it), never from a constant, a default argument or a literal in the caller. On reaching the ceiling the run STOPS, emits a refusal with its reason code, and persists no partial output as complete - the same posture LP-16 already takes for depth, breadth, node-ceiling and cumulative-token, whose stops are 'all recorded stops (never silent)'. ASSERT, PER PATH: (a) with the fixture ceiling set to N, the path halts at N and the trace carries N steps, not N+1; (b) the ceiling comes from the resolved configuration - changing it in the fixture changes the observed stop, which is what distinguishes a read ceiling from a coincidence; (c) the stop writes a refusal row and the run does not reach a completed status; (d) no path reaches model_abstraction.call without a ceiling in scope - an unbounded caller FAILS THE BUILD rather than defaulting to a generous number. THE POSITIVE CONTROL IS PART OF THE GATE, per validation_gates.positive_control: raise the fixture ceiling and assertion (a) must FAIL; remove the ceiling read and (b) must fail. A ceiling test that passes when the ceiling is deleted is testing nothing, and that is the failure mode this gate exists for - the estate already ships an agent framework whose loop has no asserted bound, recorded in pinned_stack.agent_runtime. SCOPE: this gate binds the lanes whose language gate is PY or JAVA and whose scope reaches a model call; it does not bind a deterministic resolver that calls no model, and LP-09's Skill 1 is named as the example of a path correctly outside it.", "kh_not_authoritative": "THE KNOWLEDGE HUB IS A RETRIEVAL CORPUS, NOT A SYSTEM OF RECORD, AND UNTIL THIS GATE NOTHING ENFORCED IT. The estate already has the citation half of the rule - LP-25's settled T-4_REVERSED, 'Retrieve from the Hub, CITE from the gold copy' - and it says where a citation is drawn from. It does not say what Hub content may BECOME. Measured at v1.37.1: 'never a source of truth' occurs zero times in this manifest, 'not authoritative' zero, 'grounding only' zero. A boundary nothing asserts is a boundary that holds until the first person in a hurry. THE RULE: NO PRODUCT-DRIVING ARTEFACT MAY TRACE ITS SOURCE TO THE HUB. The product-driving set is closed and named here, because a rule about 'configuration' that does not enumerate it is unrunnable: (a) report setup - report_definition, line, schedule; (b) edit-check expressions and their operands; (c) dependency edges - element_dependency, walk_component, calc-chain; (d) preset and governance_envelope bindings; (e) governed value codes, COA and MDRM identifiers; (f) any DSL or logical attribute name. Every one of those traces to regstruct.* in Lextr Core under GOLD-COPY-SOURCE-OF-TRUTH, arrives through the host adapter read-only, and changes through SDLC. A Hub passage may grounded an ANSWER and may be cited beside one; it may not become one of (a) to (f). ASSERT: (1) no write to a table in the product-driving set carries a provenance whose origin is document_chunk, embedding_store or knowledge_artifact - the origin is a recorded field, so this is a query and not a code review; (2) a skill whose tool_scope permits a Hub retrieval operation does NOT also permit a write to that set - the two op families are disjoint by construction and the Rego is asserted disjoint, not inspected; (3) a run that assembles an answer from Hub retrieval emits output_type NARRATIVE or equivalent and NEVER a definition, an expression or an edge; (4) where a surface offers both - UC11 rules drafting is the live example - the drafted artefact carries an acceptance receipt and enters through the authoring path, never written directly from the retrieval result. THE POSITIVE CONTROL IS PART OF THE GATE, per validation_gates.positive_control: add a fixture that writes an edit-check expression whose provenance names a document_chunk, and assertion (1) must FAIL; widen a Hub skill's tool_scope to include one product-driving write op, and (2) must fail. A boundary test that passes when the boundary is removed is testing nothing - and this is the boundary the whole generative/SDLC split rests on, so it is the one least worth taking on trust. SCOPE NOTE: this gate does not restrict what the Hub may INGEST. Regulatory instruction loaded into the Hub for Q&A is just another document - intelligence.knowledge_artifact treats it as one - and that is the point: the copy in the Hub is for retrieval, the copy in Core is the authority, and only the second one drives anything.", "part_m_clean": "EVERY NEW DATABASE OBJECT IS AUTHORED PART-M-CLEAN, and the parts that can be checked are checked rather than intended. The owner ruled on 2026-09-14 that this build's baseline is Part-M-clean from day one rather than reconciled later, which turns a standing proposal into a build-time obligation. ASSERT, ON EVERY MIGRATION: (a) no table, column, index or type name exceeds 32 characters - mechanical, and it passes on the current schema today, so a regression is the only way it can fail; (b) every new table declares the lifecycle columns the estate already uses - created_at, updated_at and, where an actor is meaningful, created_by; (c) any new object that does NOT carry a semantic-group, an ai_*_txt column or a meta.* registration states in its own COMMENT why not, so the gap is recorded rather than silent. WHAT THIS GATE DELIBERATELY DOES NOT ASSERT, and the omission is the honest part: conformance to the controlled-abbreviation list, the canonical-datatype map and the semantic-group taxonomy. Those documents are referenced 48 times in this manifest and reproduced nowhere, so a check for them would either pass vacuously or enforce a convention somebody here invented. THE POSITIVE CONTROL, per validation_gates.positive_control: rename any object to 33 characters and (a) must FAIL; drop created_at from a new table and (b) must fail. A naming gate that passes when the name is too long is testing nothing, and (a) passing on a schema that already conforms is exactly the case where a broken check looks healthy."}, "defects": ["Comment-blind / string-blind scanning. Strip comments before grepping for a symbol. Eleven instances in this estate; the last was caused by writing about the tenth.", "A path that resolves is not an import that binds. Invisible to path-resolution checks and caught only by bundling.", "A number held twice. A hand-maintained figure beside a computed one; each renders fine and reads wrong. Nothing may hold its own copy of a number the data already has.", "A success asserted rather than checked. The copy button returned true without awaiting the clipboard promise, and reported 'Copied' while copying nothing.", "A checker blinded by a legitimate refactor. Composing a registry from mount contracts turned an array literal into identifiers and the scanner silently found zero.", "A mutation gate that pins a CONSTANT. It tests the constant, not the property the constant stands for, and it makes a stale value harder to correct than no gate at all — every mutant that fixes it is reported as killed. LP-26's ledger.ts held TAMPER_EVIDENCE_BUILT = false, a D0 constant D1 had already falsified, and an auditor-facing export printed 'NOT tamper-evident' over a chain that exists. Gate the DERIVED property against fixtures; where a property has more than two honest states, a boolean is the defect.", "Added but never wired. The artefact is present, correct, and never invoked - and the surrounding output says success. SEVEN instances: approveWithFunctions; a _reconcile call whose suite passed 12/12 with it deleted; two verifier edits appended after `if __name__ == \"__main__\"`; footnote_refs.build() with 13 green assertions and no caller; ocr_verify; TdmDatasetExport, defined with a 16-assertion suite and rendered NOWHERE while every gate stayed green; two catalog registers declared and never .map()-ed. Grep-for-presence answers the wrong question: is the thing you added on a path that actually runs?", "A fixture easier to construct than the real thing. It is usually easier because it OMITS THE STRUCTURE THAT MATTERS. Measured: 28 assertions and 7/7 mutants green against a traversal defect that lost two-thirds of parsed content, because every fixture was a flat hand-built list and the fallback branch it exercised is one real documents never take. Mutation testing does not help - the mutants die on the branch the tests run."], "dbconv": ["Primary keys are bigint GENERATED ALWAYS AS IDENTITY. The Python side must read back DB-generated keys (insert ... returning id) rather than minting uuid4 client-side.", "client_id is mandatory and indexed on every scoped row, and is never in a URL or a query string.", "Tenant isolation is enforced in OPA, not RLS. There is no row-level security in this schema and adding it is a design change, not an implementation detail.", "Migration naming: the dated form V20260604_01__ is the current convention. The three sequential V1__/V2__/V9__ files are the original baseline and are not a precedent.", "New tables and columns are authored Part-M-clean from the start. The existing schema pre-dates Part-M and is embedded verbatim under the downstream-only rule; any Part-M delta on it is an owner-approval proposal, never silently applied.", "policy is never stored in the database. governance_envelope.opa_policy_bindings holds OPA package REFERENCES only; the Rego lives in the policy service.", "embedding_store.embedding is vector(384) and CHECK-pinned to 384, so a wider model cannot silently truncate. A non-384 tenant gets a sibling table.", "The DAO layering - Controller -> Service interface -> DAO interface -> Impl, NamedParameterJdbcTemplate against externalized SQL, no JPA, no inline SQL - is a standing obligation on every Java lane, asserted by validation_gates.JAVA. No point authors its own DAO sub-task; the four acceptance lines (rows affected, rollback on failure, no JPA, SQL loaded from queries.properties) are part of the language gate. Absorbed from LP-03.4 / LP-06.3 / LP-08.4 at v1.25.0.", "THE TENANT GATE, BECAUSE [1] HAS BEEN PROSE SINCE v1.0 AND NOTHING EXECUTES IT. A schema lint runs against the Flyway DDL at build. THREE ASSERTIONS. FIRST, every table outside a DECLARED reference/lookup allow-list carries `client_id NOT NULL`, indexed leading. The allow-list is DATA and EMPTY today - all twelve ddl_body tables carry client_id - so every entry is argued, not default. SECOND, THE HALF NO CLAUSE STATES: `client_id` appears INSIDE every unique constraint and composite foreign key, not merely as a column. IT FAILS TODAY in ddl_body - `embedding_store_chunk_model_uq (chunk_id, model_id)` and `agent_run_step_uq (run_id, step_number)` both omit it, and EVERY FK targets a bare `(id)`, so a child row can point at another tenant's parent and no constraint objects. A uniqueness rule without client_id is one tenant enforcing on another; a single-column FK is a cross-tenant edge the database will happily create. THIRD, no route signature, path segment or query string accepts a tenant - the executable half of [1]. GENERATED per validation_gates.generated_gate from the DDL and the allow-list, so a new table is covered the day it lands. Ships its mutant - drop client_id from one unique constraint, the lint goes red. IT IS EXPECTED TO FAIL ON FIRST RUN, and that is the point: a gate passing over a known defect is decoration - validation_gates.status_coherence's own argument.", "TENANT IDENTITY IS NEVER CALLER-ASSERTED AND NEVER DEFAULTED. It is derived server-side from the verified security principal - the Keycloak token claim - and nothing else. NO REQUEST MODEL CARRIES A TENANT FIELD, and none carries one WITH A DEFAULT, the shape that leaks: the source estate defaults `client_id` to 1 in RuleDescriptionRequest and RuleSummaryRequest and that value flows straight into `WHERE rd.client_id = $1`, returning one client's rows to another on a 200 WITH NO ERROR ANYWHERE. A HEADER IS AN ASSERTION, NOT AN IDENTITY: routes/variance_config_routers.py:58-64 reads X-User-Id and rejects only when absent or empty, so any client sending any value passes - a defect this manifest has WRITTEN DOWN TWICE, at LP-32.pending_items[1] and meta.v29_security_finding, and forbidden in no rule until this one. Sibling routers are weaker still, defaulting the actor to 'anonymous' and 'demo-console'. FAIL CLOSED, WITH NO SECOND READING: A MISSING, MALFORMED OR UNRESOLVABLE TENANT IS A REFUSAL. Never a fallback to a real tenant, never a placeholder resolving to one, never a widened query. Not 'anonymous', not 'demo-console', not 'GLOBAL', not 1, not the first row. The refusal carries a code and typed params per error_conventions.reason_ref and never echoes the asserted value back. WHY NOT DEFAULT-AND-LOG, the tempting middle: the log line is read after the rows are returned.", "A BUSINESS DIMENSION IS NOT A TENANT BOUNDARY. legal_entity, book, desk, cost centre, reporting unit and form family are ATTRIBUTES OF A ROW inside one tenant; `client_id` is the isolation boundary. The two are never collapsed, not even where a deployment happens to run one entity per tenant today - that is a fact about a customer, not a property of the schema. THE DEMONSTRATED CASE IS `legal_entity`: the source estate has no client_id anywhere and used legal_entity as the nearest thing, and legal_entity was itself the subject of the mislabelling defect where TWO VARIANCE CYCLES FOR DIFFERENT ENTITIES RETURNED IDENTICAL REGULATORY FIGURES - a wrong answer nobody detects from a single run, because each run is individually plausible. RECORDED HERE BECAUSE IT IS RECORDED NOWHERE ELSE: `legal_entity` has ZERO occurrences in this manifest, so the case that justifies the rule would otherwise travel as an anecdote and be re-litigated. WHY THE COLLAPSE IS TEMPTING AND STILL WRONG: a business dimension is what the domain talks about and what appears in every filter, so scoping to it FEELS like scoping correctly while the real boundary quietly becomes whatever column the query filtered on. A dimension may narrow a query INSIDE a tenant; it may never separate two tenants, and it is never the column an isolation test asserts on.", "PRIMARY KEYS ARE `bigint GENERATED ALWAYS AS IDENTITY`, READ BACK ON INSERT - [0], restated only to carry its ONE EXCEPTION, ARGUED NOT ASSUMED. An identifier that is PART OF THE DOMAIN CONTRACT may be producer-minted, in three shapes. CONTENT-ADDRESSED: the id IS the digest; a sequence destroys the property the id exists for. CITED IN AN AUDIT CHAIN: LP-26's hash-chained evidence binds a link to an id that must exist BEFORE the row is written; a chain that renumbers on persist is not tamper-evident. EXCHANGED BEFORE THE ROW EXISTS: correlation_id is ECHOED, NEVER MINTED, three-state per error_conventions.error_detail - a sequence cannot represent ABSENT. WHY CARVE RATHER THAN LEAVE IT TO JUDGEMENT: [0] forbids client-minted keys ABSOLUTELY while the estate's own committed work traffics in them, so the convention is broken quietly on the row the audit trail binds to. AN UNARGUED EXCEPTION IS HOW A CONVENTION DIES: the next reader finds a live violation, infers the rule is advisory, and mints uuid4 for a row with none. THE CARVE HAS A SHAPE AND A REGISTER: TEXT, a type prefix, AT LEAST 96 BITS of entropy, listed as DATA beside its contract. The source estate's `analysis_id = va_ + 16 hex` is 64 bits and FAILS that bar: the right exception at the wrong width, which is why the width is stated. Everything else takes the identity column, and the surrogate stays the FK target.", "THE PINNED PHYSICAL CONSTANT IS GATED BY AGREEMENT, NEVER BY ITS VALUE. 384 is not held once and cannot be: it appears in FOUR ARTEFACTS BY CONSTRUCTION and this clause names them, because a rule about 'the number' that does not enumerate its readings is unrunnable. (1) THE MIGRATION COLUMN - ddl_body's `embedding vector(384)` with `embedding_dim integer NOT NULL DEFAULT 384` and `CONSTRAINT embedding_store_dim_chk CHECK (embedding_dim = 384)`. (2) THE SETTINGS DEFAULT AND ITS BOUND - the deployment's embedding-model key, locked by DEC-LP-33-2. (3) THE CALL SITE THAT REQUESTS THE VECTOR - lexie-ai's embedding producer behind LP-04.1's `embedding_call` gate. (4) THE INDEX THAT DEPENDS ON IT - `embedding_store_hnsw_idx ... USING hnsw (embedding vector_cosine_ops)`. THE MANIFEST'S OWN TWO PROSE READINGS ARE INSIDE THE ENUMERATED SET, not outside it - pinned_stack.models ('embeddings all-MiniLM-L6-v2 384-dim') and db_conventions[6] - because a reader believes a sentence here exactly as they believe a column, and a sentence is where a stale width survives longest. THE GATE READS EVERY READING AND ASSERTS THEY ARE EQUAL TO EACH OTHER. IT DOES NOT ASSERT 384. That distinction is known_defect_classes[5] applied to its own subject: a gate that pins the constant tests the constant and not the property the constant stands for, and every mutant that FIXES a stale width is
