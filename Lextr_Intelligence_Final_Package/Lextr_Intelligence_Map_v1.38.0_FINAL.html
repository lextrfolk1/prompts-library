/* ---------- TAB 5 : THE SYSTEM, AS A NETWORK AND AS FLOWS ----------
   MAP is the whole estate: capabilities partitioning every manifest point, with every
   edge derived from the manifest's own depends_on. CAP opens one capability into its own
   point network. FLOW is the swimlane walkthrough, where every caption is the manifest's
   own sentence resolved from the location shown beside it. */
const T5 = { view:'map', cap:null, flow:'RT-1', i:0, timer:null, mode:'run', hot:null };
const LANEY = 62, BOXW = 112, COLW = 130, LEFT = 168, TOP = 34;

const CAP = id => F.caps.find(c => c.id === id);
const TIER = id => F.tiers.find(t => t.id === id);
function t5flows(){ return F.flows.filter(f => f.mode === T5.mode); }
function t5cur(){ return F.flows.find(f => f.id === T5.flow) || t5flows()[0]; }
function t5stop(){ if(T5.timer){ clearInterval(T5.timer); T5.timer = null; } }
function go(view, opts){ t5stop(); Object.assign(T5, {view}, opts||{}); t5render(); }

function edgePath(a, b){
  const A = CAP(a).node, B = CAP(b).node;
  const x1 = A.x + A.w, y1 = A.y + A.h/2, x2 = B.x, y2 = B.y + B.h/2;
  if(x2 >= x1){
    const dx = Math.max(34, (x2 - x1) / 2);
    return 'M ' + x1 + ' ' + y1 + ' C ' + (x1+dx) + ' ' + y1 + ', ' + (x2-dx) + ' ' + y2 + ', ' + x2 + ' ' + y2;
  }
  /* a backward edge loops UNDER, so it cannot be mistaken for the forward flow */
  const lx = A.x + A.w/2, rx = B.x + B.w/2, dip = Math.max(A.y+A.h, B.y+B.h) + 44;
  return 'M ' + lx + ' ' + (A.y+A.h) + ' C ' + lx + ' ' + dip + ', ' + rx + ' ' + dip + ', ' + rx + ' ' + (B.y+B.h);
}

function t5mapSvg(){
  let g = '';
  const hot = T5.hot;
  const touch = hot ? new Set([hot].concat(
    F.edges.filter(e=>e.a===hot||e.b===hot).map(e=>e.a===hot?e.b:e.a))) : null;
  F.tiers.forEach(t=>{
    const ns = F.caps.filter(c=>c.tier===t.id);
    if(!ns.length) return;
    const x = Math.min.apply(null, ns.map(c=>c.node.x));
    const y = Math.min.apply(null, ns.map(c=>c.node.y));
    g += '<text x="'+x+'" y="'+(y-14)+'" class="tierlbl" fill="var(--muted)">'
       + esc(t.id) + ' &middot; ' + esc(t.name.toUpperCase()) + '</text>';
  });
  F.edges.forEach(e=>{
    const on = !hot || e.a===hot || e.b===hot;
    const col = e.kind==='back' ? 'var(--amber)' : (e.kind==='side' ? 'var(--line)' : 'var(--blue)');
    g += '<path class="capedge" data-a="'+e.a+'" data-b="'+e.b+'" d="'+edgePath(e.a,e.b)+'" fill="none" stroke="'+col+'"'
       + ' stroke-width="'+(on && hot ? 1.9 : 1.1)+'"'
       + (e.kind==='back' ? ' stroke-dasharray="4 3"' : '')
       + ' opacity="'+(on ? (hot ? .9 : .42) : .07)+'"/>';
  });
  F.caps.forEach(c=>{
    const n = c.node, on = !hot || touch.has(c.id);
    g += '<g class="capnode'+(on?'':' dim')+'" data-cap="'+c.id+'">'
       + '<rect class="body" x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="8"'
       + ' fill="'+(c.id===hot?'rgba(47,95,208,.13)':'#fff')+'"'
       + ' stroke="'+(c.flows.length?'var(--blue)':'var(--line)')+'" stroke-width="'+(c.id===hot?2.2:1.2)+'"/>'
       + '<text x="'+(n.x+10)+'" y="'+(n.y+19)+'" font-size="11.8" font-weight="700" fill="var(--ink)">'+esc(c.label.slice(0,27))+'</text>'
       + '<text x="'+(n.x+10)+'" y="'+(n.y+32)+'" font-size="8.8" fill="var(--muted)">'+esc(c.short.slice(0,36))+'</text>'
       + '<text x="'+(n.x+10)+'" y="'+(n.y+44)+'" font-size="8.6" font-family="var(--mono)" fill="var(--muted)">'
       + c.points.length+' pt &middot; '+c.lanes+' lane'+(c.lanes===1?'':'s')
       + (c.gates?(' &middot; '+c.gates+' refuse'):'') + (c.open?(' &middot; '+c.open+' open'):'') + '</text>'
       + '</g>';
  });
  return '<svg viewBox="0 0 '+F.W+' '+F.H+'" style="width:'+F.W+'px;max-width:none;height:'+F.H+'px">'+g+'</svg>';
}

function t5map(){
  const c = F.counts;
  return `
    <p class="note">Every box is a capability; every line is a dependency the manifest states in
      <code>depends_on</code>. <b>Nothing here is authored</b> &mdash; the ${c.edges} edges are
      derived from the ${c.points} points, and the ${c.caps} capabilities partition those points
      so each appears exactly once. Hover a box to isolate it; click to open it.</p>
    <div class="stage">${t5mapSvg()}</div>
    <div class="legend">
      <span><span class="sw" style="border-color:var(--blue);background:#fff"></span>has a walkthrough flow</span>
      <span><span class="sw" style="border-color:var(--line);background:#fff"></span>opens into its own point network</span>
      <span>solid blue &mdash; forward dependency</span>
      <span>dashed amber &mdash; backward, real feedback</span>
    </div>
    <div class="mini">
      <div><b>Capabilities</b><span>${c.caps}</span></div>
      <div><b>Points</b><span>${c.points}</span></div>
      <div><b>Sub-task lanes</b><span>${c.lanes}</span></div>
      <div><b>Dependencies</b><span>${c.edges}</span></div>
      <div><b>Backward edges</b><span>${c.back}</span></div>
      <div><b>Flow steps</b><span>${c.steps}</span></div>
    </div>
    <div class="call"><b>The ${c.back} backward edges are information, not untidiness.</b> Tiers are
      a declared reading of the system, and the dependency data corrected the first attempt at
      them: an earlier tiering produced 19 backward edges, which showed the model was wrong rather
      than the layout. The approval CHAIN ENGINE turned out to be depended on BY Knowledge Hub
      assurance, the DESIGN SYSTEM by the use-case screens, and the EVIDENCE LEDGER by the chain
      engine &mdash; so all three are substrate, not downstream surfaces. Separating them from the
      surfaces that consume them took 19 backward edges down to ${c.back}, and those ${c.back} are
      genuine feedback.</div>
    <div class="call warn"><b>${c.caps - c.withFlow} capabilities have no authored walkthrough.</b>
      They still open &mdash; into their own point network &mdash; so nothing in the system is
      unreachable from this map. But the absence is named rather than papered over: a flow is
      something a person wrote, and where nobody wrote one, the map says so.</div>
    <h2>A finding this tab produced</h2>
    ${F.waveOrphans.length
      ? `<div class="call stop"><b>${F.waveOrphans.length} points sit in no <code>exec.waves</code>
          row:</b> ${F.waveOrphans.map(o=>'<code>'+esc(o)+'</code>').join(' ')}.
          The manifest's own completeness clause reads: &ldquo;${esc(F.waveClaim)}&rdquo; &mdash; so
          the sequencing table and the point list disagree, and a reader deriving build order from
          <code>exec.waves</code> would not see them at all.</div>`
      : `<div class="call good"><b>Resolved &mdash; every one of the ${F.counts.points} points now
          sits in exactly one of the ${F.waveRows} <code>exec.waves</code> rows, and no point
          precedes something it depends on.</b> This tab first reported NINE orphans: LP-52 through
          LP-60 were merged at v1.37.0 into no wave row at all, while the completeness clause said
          &ldquo;${esc(F.waveClaim)}&rdquo;. Placement could not be taken from their
          <code>parallel_group</code> labels either &mdash; LP-59 is marked W6 and depends on LP-26,
          which sits in Wave 7 &mdash; so the four new rows were derived from
          <code>depends_on</code> against row position, which is what the viewer orders by. The
          check that found it runs on every build and is what keeps this line honest rather than
          decorative.</div>`}`;
}

function t5capSvg(c){
  let g = '';
  c.inner.forEach(pr=>{
    const A=c.sub[pr[0]], B=c.sub[pr[1]];
    const x1=A.x+A.w, y1=A.y+A.h/2, x2=B.x, y2=B.y+B.h/2, dx=Math.max(24,(x2-x1)/2);
    g += '<path d="M '+x1+' '+y1+' C '+(x1+dx)+' '+y1+', '+(x2-dx)+' '+y2+', '+x2+' '+y2
       + '" fill="none" stroke="var(--blue)" stroke-width="1.4" opacity=".55"/>';
  });
  c.points.forEach(p=>{
    const n=c.sub[p], m=F.pt[p], gated=m.steps.some(s=>s.gate);
    g += '<g class="ptnode" data-lp="'+p+'">'
       + '<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="7" fill="#fff" stroke="'
       + (gated?'var(--blue)':'var(--line)')+'" stroke-width="'+(gated?1.6:1)+'"/>'
       + '<text x="'+(n.x+9)+'" y="'+(n.y+17)+'" font-size="10.5" font-family="var(--mono)" font-weight="700" fill="var(--ink)">'+esc(p)+'</text>'
       + '<text x="'+(n.x+62)+'" y="'+(n.y+17)+'" font-size="9" fill="var(--muted)">'+esc(m.s)+'</text>'
       + '<text x="'+(n.x+9)+'" y="'+(n.y+32)+'" font-size="9.4" fill="var(--text)">'+esc(m.t.slice(0,34))+'</text>'
       + '</g>';
  });
  return '<svg viewBox="0 0 '+c.subW+' '+c.subH+'" style="width:'+c.subW+'px;max-width:none;height:'+c.subH+'px">'+g+'</svg>';
}

function t5cap(){
  const c = CAP(T5.cap); if(!c) return '';
  const ins = F.edges.filter(e=>e.b===c.id), outs = F.edges.filter(e=>e.a===c.id);
  const dep = es => es.length ? es.map(e=>{
      const other = CAP(e.a===c.id ? e.b : e.a);
      return '<li><a class="lnk" style="padding:1px 6px" data-goto="'+other.id+'">'+esc(other.label)+'</a> '
        + '<span class="lanechip">'+e.pairs.map(p=>esc(p[0])+' \u2192 '+esc(p[1])).join(' &middot; ')+'</span>'
        + (e.kind==='back'?' <span class="pill proposed">feedback</span>':'') + '</li>';
    }).join('') : '<li class="note">nothing</li>';
  const openItems = c.points.filter(p=>F.pend[p]);
  return `
    <div class="crumb"><a data-goto-map>System map</a> &rsaquo; <b>${esc(c.label)}</b>
      &nbsp;<span class="lanechip">${esc(c.tier)} &middot; ${esc(TIER(c.tier).name)}</span></div>
    <h2>${esc(c.label)}</h2>
    <p class="note">${esc(c.short)}. ${esc(TIER(c.tier).blurb)}</p>
    <div class="mini">
      <div><b>Points</b><span>${c.points.length}</span></div>
      <div><b>Sub-task lanes</b><span>${c.lanes}</span></div>
      <div><b>Steps that refuse</b><span>${c.gates}</span></div>
      <div><b>Open items</b><span>${c.open}</span></div>
    </div>
    ${c.flows.length
      ? '<div class="player"><span class="note">Walkthrough:</span>' + c.flows.map(fid=>{
          const f=F.flows.find(x=>x.id===fid);
          return '<button data-flow="'+fid+'">'+esc(f.id)+' &middot; '+esc(f.name)+'</button>';
        }).join('') + '</div>'
      : `<div class="call warn">No authored walkthrough covers this capability, so it opens into its
          own point network instead. That is a gap in the FLOWS, not in the system, and naming it is
          the point.</div>`}
    <h2>Its pieces</h2>
    <div class="stage">${t5capSvg(c)}</div>
    <table><thead><tr><th style="width:70px">Point</th><th style="width:96px">Status</th>
      <th style="width:56px">Lanes</th><th>Title</th><th style="width:220px">On which flow steps</th></tr></thead>
      <tbody>${c.points.map(p=>{const m=F.pt[p];
        return '<tr><td><code>'+esc(p)+'</code></td><td><span class="pill '+esc(m.s)+'">'+esc(m.s)+'</span></td>'
          + '<td>'+m.l+'</td><td>'+esc(m.t)+'</td><td class="note">'
          + (m.steps.length ? m.steps.map(s=>esc(s.flow)+' '+esc(s.label)+(s.gate?' &middot; refuses':'')).join('<br>')
                            : 'on no flow step')
          + '</td></tr>';}).join('')}</tbody></table>
    <h2>What it needs, and what needs it</h2>
    <div class="twocol">
      <div><h3 style="font-size:11px;color:var(--muted);letter-spacing:.06em">DEPENDS ON</h3><ul>${dep(ins)}</ul></div>
      <div><h3 style="font-size:11px;color:var(--muted);letter-spacing:.06em">DEPENDED ON BY</h3><ul>${dep(outs)}</ul></div>
    </div>
    <h2>What the manifest still records as open here</h2>
    ${openItems.length ? openItems.map(p=>'<details><summary>'+esc(p)+' &mdash; '+F.pend[p].length
        +' open item'+(F.pend[p].length>1?'s':'')+'</summary><ul>'
        + F.pend[p].map(x=>'<li>'+esc(x)+'</li>').join('') + '</ul></details>').join('')
      : '<p class="note">No point in this capability records an open item.</p>'}`;
}

function t5svg(f){
  const lanes = F.lanes, used = new Set(f.steps.map(s=>s.lane));
  const W = LEFT + f.steps.length*COLW + 30, H = TOP + lanes.length*LANEY + 16;
  const li = k => lanes.findIndex(l=>l.k===k);
  const cx = n => LEFT + n*COLW + BOXW/2;
  const cy = k => TOP + li(k)*LANEY + LANEY/2;
  let g = '';
  lanes.forEach((l,idx)=>{
    const y = TOP + idx*LANEY, on = used.has(l.k);
    g += '<rect x="0" y="'+y+'" width="'+W+'" height="'+LANEY+'" fill="'+(idx%2?'var(--soft)':'#fff')+'" opacity="'+(on?1:.55)+'"/>';
    g += '<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    g += '<text x="10" y="'+(y+24)+'" font-size="11.5" font-weight="700" fill="'+(on?'var(--ink)':'var(--muted)')+'">'+esc(l.name)+'</text>';
    g += '<text x="10" y="'+(y+39)+'" font-size="9.5" fill="var(--muted)">'+esc(on?l.sub:'no step in this flow')+'</text>';
  });
  g += '<line x1="0" y1="'+(TOP+lanes.length*LANEY)+'" x2="'+W+'" y2="'+(TOP+lanes.length*LANEY)+'" stroke="var(--line)"/>';
  g += '<line x1="'+(LEFT-14)+'" y1="'+TOP+'" x2="'+(LEFT-14)+'" y2="'+(TOP+lanes.length*LANEY)+'" stroke="var(--line)"/>';
  let prevMain = -1;
  f.steps.forEach((s,n)=>{
    const from = s.branch ? prevMain : (n>0 ? (f.steps[n-1].branch ? prevMain : n-1) : -1);
    if(from >= 0){
      const x1 = cx(from)+BOXW/2, x2 = cx(n)-BOXW/2, y1 = cy(f.steps[from].lane), y2 = cy(s.lane);
      const mx = (x1+x2)/2;
      const d = (y1===y2) ? ('M '+x1+' '+y1+' L '+x2+' '+y2)
                          : ('M '+x1+' '+y1+' L '+mx+' '+y1+' L '+mx+' '+y2+' L '+x2+' '+y2);
      g += '<path d="'+d+'" fill="none" stroke="var(--line)" stroke-width="1.5"'
         + (s.branch ? ' stroke-dasharray="3 3"' : '') + '/>';
    }
    if(!s.branch) prevMain = n;
  });
  f.steps.forEach((s,n)=>{
    const x = cx(n)-BOXW/2, h = s.gate?50:40, y = cy(s.lane)-h/2;
    const active = n===T5.i;
    const stroke = s.src==='prototype' ? 'var(--amber)' : (s.gate ? 'var(--blue)' : 'var(--line)');
    const fill = active ? 'rgba(47,95,208,.13)' : (s.gate ? '#fff' : 'var(--bg)');
    g += '<g class="t5box" data-i="'+n+'" style="cursor:pointer">'
       + '<rect x="'+x+'" y="'+y+'" width="'+BOXW+'" height="'+h+'" rx="8" fill="'+fill+'" stroke="'+stroke+'"'
       + ' stroke-width="'+(active?2.4:(s.gate?1.6:1))+'"'
       + (s.src==='prototype' ? ' stroke-dasharray="4 3"' : '') + '/>'
       + '<text x="'+cx(n)+'" y="'+(y+16)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">'+esc(s.label)+'</text>'
       + '<text x="'+cx(n)+'" y="'+(y+28)+'" text-anchor="middle" font-size="8.6" fill="var(--muted)">'+esc(s.sub.slice(0,26))+'</text>'
       + (s.gate ? '<text x="'+cx(n)+'" y="'+(y+43)+'" text-anchor="middle" font-size="8.4" font-weight="700" fill="var(--blue)" font-family="var(--mono)">REFUSES</text>' : '')
       + '<text x="'+cx(n)+'" y="'+(TOP+F.lanes.length*LANEY+12)+'" text-anchor="middle" font-size="9" fill="'+(active?'var(--blue)':'var(--muted)')+'" font-family="var(--mono)">'+esc(s.lp)+'</text>'
       + '</g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:'+W+'px;max-width:none;height:'+H+'px">'+g+'</svg>';
}

function t5detail(f){
  const s = f.steps[T5.i]; if(!s) return '';
  const p = D.points.find(x=>x.id===s.lp) || {dep:[],status:''};
  const rows = [
    ['seq','Sequence', 'step '+s.seq+' of '+f.steps.length],
    ['lane','Lane', (F.lanes.find(l=>l.k===s.lane)||{}).name + ' <span class="lanechip">' + esc(s.lane) + '</span>'],
    ['fn','Function', s.fn ? '<code>'+esc(s.fn)+'</code>' : '<span class="note">the manifest names no single symbol here</span>'],
    ['refuses','Refuses', s.gate ? (s.refuses.length ? s.refuses.map(c=>'<code>'+esc(c)+'</code>').join(' ')
        : 'yes &mdash; the manifest states the refusal without naming a code') : 'no &mdash; this step moves work along'],
    ['point','Owning point', '<code>'+esc(s.lp)+'</code> <span class="pill '+p.status+'">'+esc(p.status)+'</span> '+esc(s.title)],
    ['dep','Depends on', (p.dep&&p.dep.length) ? p.dep.map(d=>'<code>'+esc(d)+'</code>').join(' ') : 'nothing'],
    ['cite','Cited from', '<code>'+esc(s.cite)+'</code>'],
  ];
  return '<div class="step-detail '+(s.src==='prototype'?'proto':'')+'">'
    + '<div style="font-size:13px;font-weight:700;color:var(--ink)">'+esc(s.label)+' &mdash; '+esc(s.sub)+'</div>'
    + '<dl class="kv" style="margin:8px 0 0">'+rows.map(r=>'<dt>'+r[1]+'</dt><dd data-k="'+r[0]+'">'+r[2]+'</dd>').join('')+'</dl>'
    + (s.src==='prototype'
      ? '<div class="call warn" style="margin:9px 0 0"><b>Drawn from the prototype strip in '
        + '<code>ui25.jsx</code>. '+esc(s.lp)+' carries no <code>manifest_of_steps</code> entry for this '
        + 'stage.</b> Whether a developer would still build it turns on the LANE scopes, which are what '
        + 'become work prompts &mdash; and a word search over them cannot answer that. '
        + (s.laneCover.length
          ? s.laneCover.length+' lane'+(s.laneCover.length>1?'s':'')+' mention the word. Read them:'
            + s.laneCover.map(c=>'<div class="verbatim" style="margin-top:6px"><b>'+esc(c.id)+'</b> '
              + '<span class="lanechip">'+esc(c.lang)+'</span> &middot; matched <code>'+esc(c.term)+'</code>'
              + '<br>&hellip;'+esc(c.snip)+'&hellip;</div>').join('')
            + '<div class="note" style="margin-top:6px">Matching a word is not coverage. Measured on this '
            + 'spine: two of four such hits were false &mdash; one landed in a sentence declaring the subject '
            + 'EXCLUDED AND NAMED AS A GAP, the other in <code>:named binding</code> in a SQL lane. This panel '
            + 'shows the evidence; it does not rule.</div>'
          : '<b>No lane scope mentions it either</b>, so nothing generated from '+esc(s.lp)+' carries this '
            + 'stage to a developer.')
        + '</div>'
      : '')
    + '<div class="verbatim">'+esc(s.ev)+'</div></div>';
}

function t5flow(){
  const f = t5cur(); if(!f) return '';
  if(T5.i >= f.steps.length) T5.i = 0;
  const used = new Set(f.steps.map(s=>s.lane));
  const idle = F.lanes.filter(l=>!used.has(l.k));
  const gates = f.steps.filter(s=>s.gate), protos = f.steps.filter(s=>s.src==='prototype');
  const onflow = F.caps.filter(c=>c.flows.indexOf(f.id) >= 0);
  return `
    <div class="crumb"><a data-goto-map>System map</a>
      ${T5.cap ? ' &rsaquo; <a data-goto="'+T5.cap+'">'+esc(CAP(T5.cap).label)+'</a>' : ''}
      &rsaquo; <b>${esc(f.id)} &middot; ${esc(f.name)}</b></div>
    <div class="player">
      <span class="seg"><button data-m="build">Build time</button><button data-m="run">Run time</button></span>
      <select id="t5sel"></select>
    </div>
    <p class="note">${esc(f.blurb)}${onflow.length
      ? ' &mdash; capabilities here: ' + onflow.map(c=>'<a class="lnk" style="padding:1px 6px" data-goto="'+c.id+'">'+esc(c.label)+'</a>').join(' ')
      : ''}</p>
    <div class="player">
      <button id="t5prev">&#9664; Prev</button>
      <button id="t5play">${T5.timer?'&#9632; Stop':'&#9654; Play'}</button>
      <button id="t5next">Next &#9654;</button>
      <span class="count">step ${T5.i+1} / ${f.steps.length} &middot; ${gates.length} of them refuse</span>
    </div>
    <div class="stage">${t5svg(f)}</div>
    ${t5detail(f)}
    <div class="legend">
      <span><span class="sw" style="border-color:var(--blue);background:#fff"></span>refuses &mdash; a gate</span>
      <span><span class="sw" style="border-color:var(--line);background:var(--bg)"></span>moves work along</span>
      <span><span class="sw" style="border-color:var(--amber);background:#fff"></span>prototype only &mdash; no manifest step</span>
      <span>dashed connector &mdash; a branch that decides nothing</span>
    </div>
    ${idle.length ? '<p class="note"><b>Lanes with no step in this flow:</b> '+idle.map(l=>esc(l.name)).join(' &middot; ')+'.</p>' : ''}
    ${protos.length ? '<div class="call warn"><b>'+protos.length+' step'+(protos.length>1?'s':'')+' on this flow '
        +(protos.length>1?'are':'is')+' drawn from the prototype and not from the manifest:</b> '
        + protos.map(s=>esc(s.label)).join(', ')+'.</div>' : ''}`;
}

function t5render(){
  document.getElementById('t5body').innerHTML =
    T5.view==='map' ? t5map() : (T5.view==='cap' ? t5cap() : t5flow());
  document.querySelectorAll('#p5 [data-goto-map]').forEach(a=>a.addEventListener('click',()=>go('map',{cap:null,hot:null})));
  document.querySelectorAll('#p5 [data-goto]').forEach(a=>a.addEventListener('click',()=>go('cap',{cap:a.dataset.goto})));
  document.querySelectorAll('#p5 [data-view]').forEach(b=>
    b.setAttribute('aria-pressed', String((b.dataset.view==='map') === (T5.view==='map'))));
  if(T5.view==='map'){
    document.querySelectorAll('#p5 .capnode').forEach(n=>{
      n.addEventListener('click',()=>go('cap',{cap:n.dataset.cap}));
      n.addEventListener('mouseenter',()=>{ T5.hot=n.dataset.cap; t5render(); });
      n.addEventListener('mouseleave',()=>{ T5.hot=null; t5render(); });
    });
  }
  if(T5.view==='cap'){
    document.querySelectorAll('#p5 [data-flow]').forEach(x=>x.addEventListener('click',()=>{
      const f = F.flows.find(y=>y.id===x.dataset.flow);
      go('flow',{flow:f.id, mode:f.mode, i:0});
    }));
  }
  if(T5.view==='flow'){
    const fl = t5flows();
    if(!fl.find(x=>x.id===T5.flow)){ T5.flow = fl[0].id; T5.i = 0; }
    const f = t5cur();
    document.getElementById('t5sel').innerHTML =
      fl.map(x=>'<option value="'+x.id+'"'+(x.id===T5.flow?' selected':'')+'>'+esc(x.id)+' &middot; '+esc(x.name)+'</option>').join('');
    document.querySelectorAll('#p5 .seg button').forEach(x=>{
      x.setAttribute('aria-pressed', String(x.dataset.m===T5.mode));
      x.addEventListener('click',()=>{ T5.mode=x.dataset.m; T5.i=0; T5.flow=t5flows()[0].id; go('flow'); });
    });
    document.getElementById('t5sel').addEventListener('change',e=>go('flow',{flow:e.target.value,i:0}));
    document.querySelectorAll('#p5 .t5box').forEach(x=>x.addEventListener('click',()=>{
      t5stop(); T5.i=+x.dataset.i; t5render(); }));
    document.getElementById('t5prev').onclick = ()=>{ t5stop(); T5.i=(T5.i-1+f.steps.length)%f.steps.length; t5render(); };
    document.getElementById('t5next').onclick = ()=>{ t5stop(); T5.i=(T5.i+1)%f.steps.length; t5render(); };
    document.getElementById('t5play').onclick = ()=>{
      if(T5.timer){ t5stop(); } else {
        T5.timer = setInterval(()=>{ const c=t5cur(); T5.i=(T5.i+1)%c.steps.length; t5render(); }, 1300);
      }
      t5render();
    };
  }
}

/* ---------- TAB 6 : DATABASE & ER ----------
   Every box, column, key, index and edge is parsed from MANIFEST.ddl_body. The parser
   counts the source a second way and the build fails when the two disagree, which caught
   three real misses first time - including an index whose name is separated from its ON
   clause by a comment, and a REFERENCES that turned out to be inside prose.
   The 22 names with no CREATE TABLE are shown as UNSPECIFIED rather than invented. */
const T6 = { sel: null, view: 'er' };

function t6erSvg(){
  let g = '';
  const N = t => DB.tables.find(x => x.name === t).node;
  /* edges first, so boxes sit over them */
  DB.edges.forEach(e => {
    const A = N(e.src), B = N(e.dst);
    const hot = T6.sel && (e.src === T6.sel || e.dst === T6.sel);
    if(e.src === e.dst){
      const x = A.x + A.w, y = A.y + 16;
      g += '<path d="M '+x+' '+y+' C '+(x+26)+' '+y+', '+(x+26)+' '+(y+26)+', '+x+' '+(y+26)+'" '
         + 'fill="none" stroke="var(--amber)" stroke-width="'+(hot?2:1.2)+'" opacity="'+(hot?1:.55)+'"/>'
         + '<text x="'+(x+30)+'" y="'+(y+17)+'" font-size="8.5" fill="var(--amber)" font-family="var(--mono)">self</text>';
      return;
    }
    const x1 = A.x, y1 = A.y + A.h/2, x2 = B.x + B.w, y2 = B.y + B.h/2;
    const dx = Math.max(30, Math.abs(x1 - x2)/2);
    g += '<path d="M '+x1+' '+y1+' C '+(x1-dx)+' '+y1+', '+(x2+dx)+' '+y2+', '+x2+' '+y2+'" fill="none" '
       + 'stroke="'+(e.pending?'var(--green)':(e.cascade?'var(--red)':'var(--blue)'))+'" stroke-width="'+(hot?2.1:1.1)+'" '
       + 'opacity="'+(T6.sel ? (hot?.95:.08) : .4)+'"'+(e.cascade?' stroke-dasharray="5 3"':'')+'/>';
  });
  DB.tables.forEach(t => {
    const n = t.node, sel = T6.sel === t.name;
    g += '<g class="erbox'+(sel?' er-sel':'')+'" data-tbl="'+t.name+'">'
       + '<rect class="body" x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="7" fill="#fff" '
       + 'stroke="'+(sel?'var(--blue)':'var(--line)')+'" stroke-width="'+(sel?2.2:1.2)+'"/>'
       + '<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+(24)+'" rx="7" fill="var(--soft)"/>'
       + '<rect x="'+n.x+'" y="'+(n.y+16)+'" width="'+n.w+'" height="8" fill="var(--soft)"/>'
       + '<line x1="'+n.x+'" y1="'+(n.y+24)+'" x2="'+(n.x+n.w)+'" y2="'+(n.y+24)+'" stroke="var(--line)"/>'
       + '<text x="'+(n.x+9)+'" y="'+(n.y+16)+'" font-size="11.6" font-weight="700" font-family="var(--mono)" fill="'+(t.origin==='ddl_body'?'var(--ink)':'var(--green)')+'">'+esc(t.name)+'</text>'
       + (t.origin!=='ddl_body' ? '<text x="'+(n.x+n.w-9)+'" y="'+(n.y+16)+'" text-anchor="end" font-size="8" fill="var(--green)" font-family="var(--mono)">NEW</text>'
          : (t.retiring ? '<text x="'+(n.x+n.w-9)+'" y="'+(n.y+16)+'" text-anchor="end" font-size="8" fill="var(--red)" font-family="var(--mono)">RETIRING</text>' : ''));
    let y = n.y + 24 + 14;
    t.pk.forEach(p => {
      g += '<text x="'+(n.x+9)+'" y="'+y+'" font-size="9.6" font-family="var(--mono)" fill="var(--amber)" font-weight="700">PK</text>'
         + '<text x="'+(n.x+30)+'" y="'+y+'" font-size="10" font-family="var(--mono)" fill="var(--ink)">'+esc(p)+'</text>';
      y += 17;
    });
    t.fks.forEach(f => {
      g += '<text x="'+(n.x+9)+'" y="'+y+'" font-size="9.6" font-family="var(--mono)" fill="var(--blue)" font-weight="700">FK</text>'
         + '<text x="'+(n.x+30)+'" y="'+y+'" font-size="10" font-family="var(--mono)" fill="var(--ink)">'+esc(f.col)+'</text>'
         + '<text x="'+(n.x+n.w-9)+'" y="'+y+'" text-anchor="end" font-size="8.6" fill="var(--muted)">'+esc(f.to)+(f.cascade?' \u21af':'')+'</text>';
      y += 17;
    });
    g += '<text x="'+(n.x+9)+'" y="'+y+'" font-size="9.4" fill="var(--muted)">'
       + t.cols.length+' columns &middot; '+t.indexes.length+' index'+(t.indexes.length===1?'':'es')+'</text>';
    g += '</g>';
  });
  return '<svg viewBox="0 0 '+DB.W+' '+DB.H+'" style="width:'+DB.W+'px;max-width:none;height:'+DB.H+'px">'+g+'</svg>';
}

function t6detail(){
  const t = DB.tables.find(x => x.name === T6.sel);
  if(!t) return '<p class="note">Click a table to see every column, constraint and index it declares.</p>';
  const rows = t.cols.map(c => {
    const state = c.pending ? '<span class="kcell" style="color:var(--green)">NEW</span> '
                : (c.retiring ? '<span class="kcell" style="color:var(--red)">GOING</span> ' : '');
    const marks = state + (c.pk?'<span class="kcell k-pk">PK</span> ':'')
                + (c.fk?'<span class="kcell k-fk">FK</span> ':'')
                + (c.uq?'<span class="kcell k-uq">UQ</span> ':'');
    return '<tr><td>'+(marks||'')+'</td><td><code>'+esc(c.name)+'</code></td>'
      + '<td class="lanechip">'+esc(c.type)+'</td>'
      + '<td class="note">'+(c.nn?'NOT NULL':'')+(c.default?(c.nn?' &middot; ':'')+'default '+esc(c.default):'')
      + (c.fk?' &middot; &rarr; <code>'+esc(c.fk[0])+'.'+esc(c.fk[1])+'</code>'+(c.cascade?' ON DELETE CASCADE':''):'')
      + (c.pending?' &middot; <span class="note">added by '+esc(c.pending)+'</span>':'')
      + (c.retiring?' &middot; <span class="note">dropped by '+esc(c.retiring)+'</span>':'')
      + (c.nn_pending?' &middot; <span class="note">becomes NOT NULL in '+esc(c.nn_pending)+'</span>':'')
      + '</td></tr>';
  }).join('');
  return '<h2><code>'+esc(DB.schema[0])+'.'+esc(t.name)+'</code></h2>'
    + (t.origin!=='ddl_body'
       ? '<div class="call good">Declared in <code>'+esc(t.origin)+'</code>, a migration authored '
         + 'and not yet folded into <code>ddl_body</code>. It is real and it is pending.</div>' : '')
    + '<div class="dbgrid">'
    + '<div><b>Columns</b><span>'+t.cols.length+'</span></div>'
    + '<div><b>Foreign keys out</b><span>'+t.fks.length+'</span></div>'
    + '<div><b>Referenced by</b><span>'+t.inbound.length+'</span></div>'
    + '<div><b>Indexes</b><span>'+t.indexes.length+'</span></div></div>'
    + (t.retiring ? '<div class="call stop"><b>This table is dropped by <code>'+esc(t.retiring)
        + '</code>.</b> It is still here because that migration has not run.</div>' : '')
    + (DB.isolated.indexOf(t.name)>=0
       ? '<div class="call stop"><b>This table is connected to NOTHING.</b> No foreign key '
         + 'points at it and it points at no other table, so nothing in the schema can reach a '
         + 'row in it. If that is not intended, the link is the missing piece &mdash; not the '
         + 'table.</div>' : '')
    + (t.selfref?'<div class="call warn">This table references ITSELF &mdash; a hierarchy stored in one table.</div>':'')
    + '<table class="coltbl"><thead><tr><th style="width:70px">Key</th><th style="width:190px">Column</th>'
    + '<th style="width:190px">Type</th><th>Declared as</th></tr></thead><tbody>'+rows+'</tbody></table>'
    + (t.constraints.length ? '<h2>Table-level constraints</h2><ul>'
        + t.constraints.map(c=>'<li><code>'+esc(c)+'</code></li>').join('') + '</ul>' : '')
    + (t.indexes.length ? '<h2>Indexes</h2><table><thead><tr><th>Name</th><th style="width:80px">Method</th>'
        + '<th>Columns</th><th style="width:70px">Unique</th></tr></thead><tbody>'
        + t.indexes.map(i=>'<tr><td><code>'+esc(i.name)+'</code></td><td>'+esc(i.method)+'</td>'
            + '<td class="lanechip">'+esc(i.cols)+(i.where?' '+esc(i.where):'')+'</td>'
            + '<td>'+(i.unique?'yes':'')+'</td></tr>').join('') + '</tbody></table>' : '')
    + (t.enums.length ? '<p class="note"><b>Enum types used:</b> '
        + t.enums.map(e=>'<code>'+esc(e)+'</code>').join(' ') + '</p>' : '')
    + (t.inbound.length ? '<p class="note"><b>Referenced by:</b> '
        + t.inbound.map(x=>'<code>'+esc(x)+'</code>').join(' ') + '</p>' : '')
    + (t.points.length ? '<p class="note"><b>Named in points:</b> '
        + t.points.map(p=>'<code>'+esc(p)+'</code>').join(' ') + '</p>'
        : '<div class="call warn">No point names this table. It exists in the DDL and nothing '
          + 'in the manifest refers to it &mdash; worth knowing before it is built.</div>');
}

/* The stage is re-rendered on every selection, which destroys the nodes the listeners were
   attached to - so binding happens once per render, via onclick rather than a stacked
   addEventListener. An earlier version added a second listener inside the first, which
   fires twice and toggles the selection back off on the second click. */

function tab6rebind(){
  document.querySelectorAll('#p6 .erbox').forEach(b => {
    b.onclick = () => {
      T6.sel = (T6.sel === b.dataset.tbl) ? null : b.dataset.tbl;
      document.getElementById('t6stage').innerHTML = t6erSvg();
      document.getElementById('t6detail').innerHTML = t6detail();
      tab6rebind();
    };
  });
}


/* ---------- THE RIGHT-HAND IMPACT PANEL, AND TAB 7 ----------
   Added, never woven in. The panel is driven by DELEGATED listeners on `document`, so it
   survives the full re-render tabs 5 and 6 perform on every click without a line of their
   render functions changing. The build asserts each existing section is byte-identical
   after this pass. */

function rhpEl(){
  let el = document.getElementById('lxrhp');
  if(!el){
    el = document.createElement('div');
    el.id = 'lxrhp';
    document.body.appendChild(el);
  }
  return el;
}
function rhpClose(){ rhpEl().classList.remove('on'); }
function rhpOpen(html){
  const el = rhpEl();
  el.innerHTML = '<button class="x" id="lxrhpx" title="close">&times;</button>' + html;
  el.classList.add('on');
  document.getElementById('lxrhpx').onclick = rhpClose;
  el.querySelectorAll('[data-rhp-screen]').forEach(a => a.onclick = () => {
    document.querySelector('[data-t="7"]').click();
    const card = document.getElementById('scr-' + a.dataset.rhpScreen);
    if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
    rhpClose();
  });
}

function screenCard(id, extra){
  const s = U.screens.find(x => x.id === id);
  if(!s) return '';
  return '<div class="scr"><div class="g">' + esc(s.group) + '</div>'
    + '<b>' + esc(s.label) + '</b> <span class="lanechip">&lt;' + esc(s.component) + '/&gt;</span>'
    + (s.badge ? ' <span class="pill committed">' + esc(s.badge) + '</span>' : '')
    + '<p>' + esc(s.blurb) + '</p>'
    + (extra || '')
    + '<p><a class="lnk" style="padding:1px 6px;display:inline-block;margin-top:6px" '
    + 'data-rhp-screen="' + s.id + '">open in tab 7 &rarr;</a></p></div>';
}

function tblChips(list){
  return list.map(t => '<span class="tblchip ' + esc(t.state) + '">' + esc(t.name) + '</span>').join('');
}

/* ---- tab 5: a flow step names a point; the point names a capability; the capability is
        surfaced by screens. Every hop is looked up, none is guessed. ---- */
function rhpForPoint(lp, stepLabel, flowName){
  const cap = U.pointCap[lp];
  const direct = U.byPoint[lp] || [];
  const viaCap = (U.byCap[cap] || []).filter(s => direct.indexOf(s) < 0);
  const headless = U.headless.find(h => h.id === cap);
  const capLabel = (U.screens.flatMap(s => s.caps).find(c => c.id === cap) || {}).label
                   || (headless ? headless.label : cap);
  return '<h3>' + esc(stepLabel || lp) + '</h3>'
    + '<div class="note">' + esc(flowName || '') + ' &middot; <code>' + esc(lp) + '</code>'
    + ' &middot; capability <b>' + esc(capLabel) + '</b></div>'
    + '<h4>Screens this point is built into &mdash; ' + direct.length + '</h4>'
    + (direct.length ? direct.map(s => screenCard(s)).join('')
       : (headless ? '<p class="none">None, by design. ' + esc(headless.why) + '</p>'
                   : '<p class="none">No screen maps to this point.</p>'))
    + (viaCap.length ? '<h4>Also in the same capability &mdash; ' + viaCap.length + '</h4>'
        + viaCap.map(s => screenCard(s)).join('') : '')
    + '<h4>Database objects those screens touch</h4>'
    + (direct.concat(viaCap).length
        ? tblChips([...new Map(direct.concat(viaCap)
            .flatMap(sid => (U.screens.find(x => x.id === sid) || {tables:[]}).tables)
            .map(t => [t.name, t])).values()])
        : '<p class="none">none</p>');
}

/* ---- tab 6: a table is leveraged by screens; each screen names its capability ---- */
function rhpForTable(name, state){
  const scr = U.byTable[name] || [];
  return '<h3><code>' + esc(name) + '</code></h3>'
    + '<div class="note">' + (state ? esc(state) + ' &middot; ' : '')
    + scr.length + ' screen' + (scr.length===1?'':'s') + ' leverage it</div>'
    + '<h4>Screens &mdash; ' + scr.length + '</h4>'
    + (scr.length ? scr.map(s => {
          const sc = U.screens.find(x => x.id === s);
          return screenCard(s,
            '<div style="margin-top:6px"><span class="g" style="font-size:10px;color:var(--muted)">CAPABILITY</span> '
            + sc.caps.map(c => esc(c.label)).join(', ')
            + '<br><span class="g" style="font-size:10px;color:var(--muted)">POINTS</span> '
            + (sc.points.length ? sc.points.map(p => '<code>' + esc(p.id) + '</code>').join(' ') : 'none')
            + '</div>');
        }).join('')
      : '<p class="none">No screen in the prototype leverages this table. That is what makes '
        + 'it a candidate for retirement rather than a gap.</p>');
}

function rhpInit(){
  /* delegated: tabs 5 and 6 rebuild their nodes on every click, so listeners bound to
     those nodes would be destroyed. One listener on document outlives all of it. */
  document.addEventListener('click', ev => {
    const box = ev.target.closest && ev.target.closest('#p5 .t5box');
    if(box){
      const f = F.flows.find(x => x.id === T5.flow);
      const st = f && f.steps[+box.dataset.i];
      if(st) rhpOpen(rhpForPoint(st.lp, st.label + ' \u2014 ' + st.sub, f.id + ' \u00b7 ' + f.name));
      return;
    }
    const er = ev.target.closest && ev.target.closest('#p6 .erbox');
    if(er){
      const t = DB.tables.find(x => x.name === er.dataset.tbl);
      rhpOpen(rhpForTable(er.dataset.tbl,
        t ? (t.retiring ? 'retiring' : (t.origin !== 'ddl_body' ? 'pending migration' : 'declared')) : ''));
      return;
    }
    const pn = ev.target.closest && ev.target.closest('#p6 .ptnode');
    if(pn){ rhpOpen(rhpForPoint(pn.dataset.lp, pn.dataset.lp, '')); return; }
    const cn = ev.target.closest && ev.target.closest('#p5 .capnode');
    if(cn){
      const cap = F.caps.find(x => x.id === cn.dataset.cap);
      const scr = U.byCap[cn.dataset.cap] || [];
      const headless = U.headless.find(h => h.id === cn.dataset.cap);
      rhpOpen('<h3>' + esc(cap.label) + '</h3><div class="note">' + esc(cap.short) + '</div>'
        + '<h4>Screens &mdash; ' + scr.length + '</h4>'
        + (scr.length ? scr.map(s => screenCard(s)).join('')
           : '<p class="none">' + (headless ? esc(headless.why)
               : 'No screen surfaces this capability.') + '</p>'));
    }
  }, true);
}

function tab7(){
  const c = U.counts;
  const byGroup = g => U.screens.filter(s => s.group === g);
  document.getElementById('p7').innerHTML = `
   <h2>Every screen, and what it is built on</h2>
   <p class="note">${c.screens} screens across ${c.groups} groups, read from the prototype's own
     navigation and its screen-to-component registry &mdash; a screen listed here is one the product
     actually renders. Each is mapped to the capabilities it surfaces, the manifest points it is
     built from, and the database objects it touches; every one of those references is checked
     against its own inventory when this file is built.</p>
   <div class="mini">
     <div><b>Screens</b><span>${c.screens}</span></div>
     <div><b>Groups</b><span>${c.groups}</span></div>
     <div><b>Capabilities surfaced</b><span>${c.caps - c.headless}</span></div>
     <div><b>Headless by design</b><span>${c.headless}</span></div>
     <div><b>Points reached</b><span>${c.mappedPoints}</span></div>
     <div><b>Lanes behind them</b><span>${c.lanes}</span></div>
   </div>
   <div class="call">Clicking anything in <b>tab 5</b> or <b>tab 6</b> opens a panel on the right
     showing the screens, capabilities and tables that piece touches. It reads the same map this
     tab does.</div>
   ${U.groups.map(g => `
     <h2>${esc(g)} &mdash; ${byGroup(g).length}</h2>
     ${byGroup(g).map(s => `
       <div class="scrcard" id="scr-${esc(s.id)}" data-screen="${esc(s.id)}">
         <div class="hd">
           <div class="row" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
             <h3 style="margin:0;font-size:15px">${esc(s.label)}
               <span class="lanechip">&lt;${esc(s.component)}/&gt;</span></h3>
             <span>${s.badge ? '<span class="pill committed">' + esc(s.badge) + '</span>' : ''}
               ${s.count ? '<span class="lanechip">' + esc(s.count) + ' items</span>' : ''}
               ${s.alert ? '<span class="pill proposed">alerting</span>' : ''}</span>
           </div>
           <div class="note" style="margin-top:4px">${esc(s.blurb)}</div>
         </div>
         <div class="bd grid3">
           <div><div class="lbl" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px">Capability</div>
             ${s.caps.map(x => '<div>' + esc(x.label) + '</div>').join('') || '<span class="note">none</span>'}</div>
           <div><div class="lbl" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px">Points &middot; ${s.points.length} (${s.lanes} lanes)</div>
             ${s.points.length ? s.points.map(p => '<div><code>' + esc(p.id) + '</code> <span class="pill ' + esc(p.status) + '">' + esc(p.status) + '</span></div>').join('') : '<span class="note">none</span>'}</div>
           <div><div class="lbl" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px">Database objects</div>
             ${s.tables.length ? tblChips(s.tables) : '<span class="note">none</span>'}</div>
         </div>
       </div>`).join('')}`).join('')}

   <h2>Capabilities with no screen &mdash; ${c.headless}, by design</h2>
   <p class="note">Substrate and cross-cutting work has no surface, and saying so is different from
     forgetting it. Two of these are not by design and say so.</p>
   <table><thead><tr><th style="width:230px">Capability</th><th>Why it has no screen</th></tr></thead>
     <tbody>${U.headless.map(h => '<tr><td><b>' + esc(h.label) + '</b></td><td class="note">'
       + esc(h.why) + '</td></tr>').join('')}</tbody></table>

   <h2>Legend</h2>
   <div class="legend">
     <span><span class="tblchip">declared</span> in <code>ddl_body</code></span>
     <span><span class="tblchip pending">pending</span> created by a migration not yet run</span>
     <span><span class="tblchip retiring">retiring</span> dropped by the retirement sequence</span>
     <span><span class="tblchip unspecified">unspecified</span> named across the manifest, no CREATE TABLE anywhere</span>
   </div>`;
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===t));
  [1,2,3,4,5,6,7].forEach(n=>document.getElementById('p'+n).classList.toggle('hidden', String(n)!==t.dataset.t));
}));
tab1(); tab2(); tab3(); tab4(); tab5(); tab6(); tab7(); rhpInit();
</script></body></html>
