ENCE, CORRECTED AT v1.26.1: this point absorbed six policy lanes and its sub-task count did not grow, so LP-04.1 is still the largest single unit of work in the manifest. Split it into per-package sub-tasks before build. The correction below is separate and more serious.", "CORRECTION AT v1.26.1 - THE v1.25.0 MERGE OVER-CLAIMED. LP-04.1's scope as written at v1.25.0 said 'Author EVERY Rego package ... no point authors policy of its own'. That was FALSE ON ARRIVAL: seventeen other REGO sub-tasks remained, eleven of them COMMITTED and already built - tool_scope_analytical (LP-24.4), tool_scope_rules (LP-25.4), tool_scope_impact (LP-37.3), tool_scope_trend (LP-38.3), lextr.ai.mrm_sod (LP-22.5), lextr.ai.audit_read (LP-26.12), the TDM ring-fence (LP-39.3) and four proposed UC10/UC11 packages. The claim is narrowed to the bundle root and the shared packages, which is what the merge actually did. Recorded here rather than silently rewritten, per comment_standard: a self-correction is recorded WHERE IT WAS WRONG."], "LP-05": ["<CONFIRM> SME-supplied model_id / artifact / version for the fine-tuned variance SLM"], "LP-06": ["OI-8 confirm D6 persists the DAG trace as one agent_run incl. convergence provenance", "BLOCKING, AND THE REAL COST OF THE ARCHIVE HALF: A DEPLOYMENT SEAM THE MANIFEST NAMES NOWHERE. A content-addressed object store is not in build_context.pinned_stack. It is the SAME absent seam LP-49.pending_items[0] raises for its WORM store and key custodian, and the two must be ONE conversation - the estate does not need two answers to 'where do bytes live outside the database and who owns them'. RAISE BEFORE LP-06.6 OR LP-06.7 IS CLAIMED: LP-06.7 cannot run without a real store and a mocked store FAILS that lane by construction. OWNER: the deployment / platform owner, jointly with whoever owns pinned_stack, since adding an object store to it is a build_context change and not a lane's to make.", "THE HARVEST RECORD IS WRONG ABOUT THE SCHEMA POSITION AND THE CORRECTION MAKES THE LANE HARDER, NOT EASIER. LEX-28's blocked_by reads 'columns on agent_run_step, a table absent from ddl_body'. intelligence.agent_run_step IS the twelfth of ddl_body's twelve baseline tables, embedded verbatim under 'RING-FENCED CONTRACT. The team builds AGAINST this schema and MUST NOT alter it', already carrying `input jsonb`, `data_classification` and `agent_run_step_uq UNIQUE (run_id, step_number)` - the second of which already fails db_conventions[8]'s tenant lint. So the delta is a Part-M change on the ring-fenced baseline (db_conventions[4]) and not an addition to an absent object. Recorded because a reader working from the harvest record would size this lane wrongly. OWNER: the schema owner.", "payload_hash MAY OR MAY NOT ALREADY BE A COLUMN AND THE MIGRATION'S SHAPE DEPENDS ON IT. LP-26.fixed_contracts[1] enumerates the eleven columns LP-26 added to agent_run_step and payload_hash is not among them; LP-06.2 treats payload_hash as a producer attestation re-derived at flush. ddl_body carries no LP-26 object, so the manifest cannot settle it either way. VERIFY AGAINST LP-26.1's HELD MIGRATIONS BEFORE LP-06.5 IS CLAIMED - the same shape LP-49.pending_items[8] uses for head_signature, and for the same reason: if the column exists the file references it, if it does not the file adds it, and those are different approvals. OWNER: LP-26 owner, with the schema owner.", "LP-06.1's SOLE-STATEMENT OWNERSHIP IS HONOURED AND OWES A RE-RUN. Every SELECT and INSERT binding the new columns is authored in LP-06.1's queries.properties and nowhere else - 'This lane is the SOLE owner of every statement against intelligence.agent_run and intelligence.agent_run_step' - and LP-06.1 TEST[3] is RE-RUN with them present. LP-06.5 authors the DDL and no statements; a second statement owner over those tables is the duplication this manifest exists to prevent. OWNER: the LP-06.1 owner.", "LP-06.4 IS DELIBERATELY NOT TOUCHED AND THE REASON IS STATED SO THE REOPENING SURFACE IS NOT OVERSTATED. lexie-ai still carries payload BODIES inline in RunResult (AMD-EVD-10: 'an object store is persistence and lexie-ai holds no such grant') and the archive write happens AFTER the consumer's re-derivation, so the producer attestation, its shared adversarial corpus and its refusal path see exactly what they see today. LP-06.7 adds a THIRD crossing rather than editing the two LP-06.4 owns. Neither LP-06.4's scope nor its tests are amended.", "THE CANONICALISATION QUESTION IS ANSWERED BEFORE LP-06.5 IS CLAIMED, NOT AFTER. Whether moving the body out of `input` changes the chain digest depends on whether that column is a member of LP-26.1's trigger arithmetic, which is not readable from this manifest. LP-26.32 TEST[0] settles it by derivation and is the first thing done in this item - it is cheap now and it is a re-notarization later. OWNER: LP-26 owner."], "LP-07": ["Reviewer identity per use-case (envelope SoD + run-review reviewer identity are the same machinery)", "B3, AND IT IS NOW THREE QUESTIONS RATHER THAN ONE. (a) LP-07 spells its terminal state BOTH pending_review and in_review inside one record and intelligence.run_status has only in_review - already recorded at meta.v31_findings, meta.v32_open_findings.pending_review_vs_in_review, LP-14.0.pending_items[4] and LP-50. (b) run_status has no `stopped` although LP-15's store, LP-17's banners and LP-37 all assume one. (c) FOUND IN THE DDL BY THIS ADOPTION AND NOT PREVIOUSLY RECORDED: agent_run carries no assignee_id, no second_reviewer_id, no review_due_at and NO CLAIM-HOLDER COLUMN, although LP-06.2's scope names the first three as fields enqueue must never clear - so the claim state and SECOND_APPROVE have no schema home. THE TABLE CANNOT BE AUTHORED OVER ANY OF THE THREE AS THEY STAND. OWNER: schema owner.", "OPEN DECISION, MANIFEST OWNER, AND THIS ADOPTION DOES NOT TAKE IT: render-only-what-is-offered against show-and-enable. LP-12.5 TEST[3] holds 'the surface never authorizes - Approve and Activate are shown per capability and refused by the server, and a visible-but-denied control is asserted as the expected path', restated as LP-15.pre_build_knowledge[2]. The collision is ONE test and not a design reversal: a server-computed list already satisfies LP-12.5 TEST[4] ('the client holds no transition table'). Until it is taken, a reviewer can still be shown Accept on a settled run and only the enabling data is built. OWNER: manifest owner.", "LP-50.pending_items[8] declares a SOFT DEPENDENCY ON LEX-13 for its finally-reviewed population, and LP-14.0.pending_items[4] records the same defect from the close-attestation side. Both now have a named lane to depend on - LP-07.4 - and neither is unblocked until B3(a) is answered. OWNER: adoption-pass owner.", "change[6]'s destination-naming reconciliation - one destination carrying a nav label and badge count that disagree with its screen title and item count - is REAL and is NOT adopted here: LP-47 is COMMITTED and adoption_standard.reopening_a_committed_point makes a nav label an UPDATE row for its owner rather than a clause of this adoption. OWNER: LP-47 owner."], "LP-08": ["composed_definition_txt -> SLM SME confirm (regulatory definition source is the Core gold copy, not KH)", "ADDITION to LP-08.pending_items (existing [0], composed_definition_txt -> SLM SME confirm, is unchanged). CORPUS LIFECYCLE IS RECORDED, NOT AUTHORED: retention, purge, legal hold, the run-pinned corpus snapshot, purge receipts on LP-26.8's shape, and re-embedding as a versioned migration are held as a CONTRACT-class owner proposal (LEX-40's deferred half), blocked by B3, dependent on LEX-14, needing an owner sign-off for the new lextr.ai.corpus_lifecycle package on the LP-39.pending_items[6] precedent, and to be decided alongside LEX-28. Owner: manifest owner. LP-52 does not exist and must not appear on any register as adopted. || CLOSED AT v1.34.0: LEX-14 is CLOSE_AS_COVERED and this declared dependency is RELEASED. The as-of half it was relied on for landed at LP-08.1 (LEX-40, v1.32.0) and LP-08.1's own scope cites LEX-14 by name as the source of the CURRENT_DATE finding. The projection half is not coming: LP-21/UC8 is COMMITTED AND BUILT and already finds regulatory elements by meaning at the Core gold copy under GOLD-COPY-SOURCE-OF-TRUTH, and LP-25's settled T-4_REVERSED states the position in one line - 'Retrieve from the Hub, CITE from the gold copy'. A projected chunk has no source record to reach, so this proposal is SMALLER than it was.", "ADDITION: effective_to on intelligence.regulatory_document and intelligence.document_chunk is a Part-M delta on APPLIED BASELINE TABLES and therefore an owner-approval proposal under db_conventions[4], never silently applied, and it is blocked by B3. Until it lands, LP-08.1's validity predicate carries only the OPENING half of the window and says so in the statement's header. Owner: manifest owner / schema owner.", "ADDITION: B1 - intelligence.ingestion_status is created twice in ddl_body with different value sets and V9's IF NOT EXISTS guard makes the seven-value document lifecycle silently lose on a clean apply, so V9__knowledge_hub_ingestion cannot complete and regulatory_document.ingestion_status / classification / version are absent from the published schema. LP-24.7 TEST[1] repaired it in the built tree with a SEPARATE type; ddl_body does not carry the repair. A CONTRACT-class correction to ddl_body, not repairable by any LP-08 lane. Owner: schema owner.", "ADDITION: kh_ready does not exist as a capability gate (meta.v31_findings.policy_and_gate_gaps[0]), so the Knowledge Hub retrieve path is gated by no *_ready datum at all. LP-08.5 (REGO) was withdrawn at v1.31.0 and that withdrawal must be paired with LP-08 DECLARING the datum it supplies and citing LP-04's package that gates it. Not declared by this pass. Owner: LP-04 owner with LP-08.", "ADDITION: LEX-15 (retrieve, rerank with a reason, abstain) would place a rerank stage above LP-08.1's top-k, which is a SECOND place the vector space must be pinned; it must inherit LP-08.1's model pin rather than restate it, and must not become a second ranking owner.", "v1.32.0 LEX-40 DEFERRED HALF, RECORDED NOT AUTHORED: RECORDED, NOT AUTHORED - the governance half of LEX-40, held as a CONTRACT-class owner proposal rather than built into any lane at v1.31.3. WHAT A CORPUS-LIFECYCLE CAPABILITY WOULD OWN. (1) effective_to on intelligence.regulatory_document and intelligence.document_chunk, paired with the effective_date each already carries, so the corpus has a WINDOW rather than a start - this is the closing half of the predicate LP-08.1 now carries open. (2) A CORPUS SNAPSHOT AS A FIRST-CLASS OBJECT that a run PINS: a re-run against a different snapshot is a different computation and says so. It rides LP-26.2's existing recording path rather than a second provenance mechanism - agent_run_step.graph_snapshot_id and subgraph_hash are the built sibling, and LP-26.2 TEST[3] ('a traversal without a graph snapshot id records a content hash of the returned subgraph') is the pattern - which means LP-26 is a COMMITTED point that would gain a step kind, so adoption_standard.reopening_a_committed_point is triggered and LP-26 must declare the divergence in pending_items with an owner and have its status re-derived. (3) LEGAL HOLD pinning a document against BOTH purge and re-embed, asserted by making the constraint FIRE rather than by asserting a column exists. (4) PURGE RECEIPTS ON LP-26.8's RECEIPT SHAPE - 'every lawful departure leaves a receipt', 'a purged day reports PURGED, not NO_CHAIN' so 'removed lawfully' and 'went missing' can be told apart. A separate TABLE is justified (different clock, different granularity, different lawful basis - LP-26.4 TEST[1] removes a day WHOLE and sharing that window would make a corpus erasure destroy a day of evidence); a separate receipt VOCABULARY is not. (5) THE PURGE ORDER IS A CONSTRAINT, NOT A CONVENTION, and this schema makes it specific: embedding_store.chunk_id is REFERENCES document_chunk (id) ON DELETE CASCADE, while document_chunk.document_id is REFERENCES regulatory_document (id) with NO ON DELETE clause at all - so the document delete is REFUSED while chunks exist and an operator who deletes the chunks first gets the cascade but no record that it happened. Document, chunks and vectors leave TOGETHER, in one transaction, with a receipt naming the authority and the reason; the ordering is enforced by the database rather than documented in a runbook. (6) LEX-40's change[6]: a purge or re-embed that would INVALIDATE A SNAPSHOT A FILED RUN PINNED is REFUSED - not warned about - and the snapshot is retained until its runs pass retention. (7) Re-embedding is a VERSIONED MIGRATION that advances the snapshot, never a setting: DEC-LP-33-2 already supplies the refusal - RUNTIME_CONFIG_KEY_NOT_EDITABLE with ground=CORPUS_BOUND, rendering as 'fixed for this deployment because ...' and never as 'ask an administrator' - and it is cited rather than reinvented. THE RETENTION WINDOW IS THE ONE GENUINE KNOB and needs a governed catalogue row (type, bounds, consequence class, one sentence of blast radius) with validation_gates.config_is_read over it, per no_knob_without_a_reader. WHY IT IS NOT AUTHORED HERE. It is a CONTRACT-class owner proposal, not a lane's decision. regulatory_document and document_chunk are APPLIED BASELINE TABLES, so every column above is a Part-M delta and db_conventions[4] makes it 'an owner-approval proposal, never silently applied' - which is B3's own subject, and B3 is open, so the schema half cannot be authored, and the acceptance criteria that need the migration applied and the constraints firing cannot be run. The new policy package lextr.ai.corpus_lifecycle survives anti_dup.hard_rules (lextr.ai.evidence_lifecycle decides purge over an EVIDENCE DAY; this would decide purge over a DOCUMENT on a different lawful basis and clock - a different question) but it needs an OWNER'S SIGN-OFF, on the LP-39.pending_items[6] precedent: 'they need a sign-off, not engineering'. It DEPENDS ON LEX-14 (declared in LEX-40.blocks_on and correct): a projected chunk 'carries the source table and primary key as provenance, is re-derived rather than edited, and is superseded - never mutated', so purging a source record must reach its projection and a legal hold on a source record must pin the projection - which multiplies what a purge must reach and must be settled before the purge's reach is specified, not after. It should also be decided ALONGSIDE LEX-28 (content-addressed payloads), because both are row-granular erasure obligations landing on an estate whose purge is day-whole, and the estate needs ONE answer to 'erase one thing without destroying the day' rather than two. LANDING KIND WHEN IT IS TAKEN UP: NEW_POINT (a lifecycle authority and a purge receipt LP-08 and LP-26 both decline to own) plus the EXTENSION already landed here. NOT authored, NOT adopted, and adopted_is_a_derived_state means it must not appear on any register as done. || CLOSED AT v1.34.0: LEX-14 is CLOSE_AS_COVERED and this declared dependency is RELEASED. The as-of half it was relied on for landed at LP-08.1 (LEX-40, v1.32.0) and LP-08.1's own scope cites LEX-14 by name as the source of the CURRENT_DATE finding. The projection half is not coming: LP-21/UC8 is COMMITTED AND BUILT and already finds regulatory elements by meaning at the Core gold copy under GOLD-COPY-SOURCE-OF-TRUTH, and LP-25's settled T-4_REVERSED states the position in one line - 'Retrieve from the Hub, CITE from the gold copy'. A projected chunk has no source record to reach, so this proposal is SMALLER than it was.", "v1.32.0 LEX-40 B1 DEFECT REPORT: B1 DEFECT REPORT - intelligence.ingestion_status is created TWICE in ddl_body, with different value sets, and the second creation is guarded so that it silently loses. THE COLLISION, EXACTLY. The V1 baseline creates the type unguarded: CREATE TYPE intelligence.ingestion_status AS ENUM ('pending', 'ingesting', 'completed', 'failed') - four lowercase labels, and its consumer is intelligence.form_version.ingestion_status, declared NOT NULL DEFAULT 'pending'. V9__knowledge_hub_ingestion then creates a type of THE SAME NAME with a DIFFERENT PURPOSE and a DIFFERENT VOCABULARY - CREATE TYPE intelligence.ingestion_status AS ENUM ('RECEIVED', 'CLASSIFIED', 'CHUNKED', 'EMBEDDED', 'AVAILABLE', 'FAILED', 'QUARANTINED') - seven uppercase labels, for a DOCUMENT lifecycle on regulatory_document. V9 wraps that CREATE TYPE in a DO $$ ... IF NOT EXISTS (SELECT 1 FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace WHERE t.typname = 'ingestion_status' AND n.nspname = 'intelligence') ... END $$ guard, and the guard tests THE TYPE NAME, not its labels. WHAT HAPPENS ON A CLEAN APPLY. V1 creates the four-value type. V9 looks for a type named intelligence.ingestion_status, FINDS V1's, and skips creating the seven-value one. The next statement - ALTER TABLE intelligence.regulatory_document ADD COLUMN IF NOT EXISTS ingestion_status intelligence.ingestion_status NOT NULL DEFAULT 'RECEIVED' - then adds a column of the FOUR-value type whose default literal 'RECEIVED' is not one of its labels, and the ALTER cannot succeed: the default cast to intelligence.ingestion_status fails as an invalid input value for the enum. The migration chain stops there, so ix_regdoc_tenant_status and V9's remaining additive columns (classification, version) do not land either. It is not a runtime edge case: it is deterministic on every clean V1+V9 apply, and it is verifiable by reading ddl_body alone. WHY THE GUARD MAKES IT WORSE, NOT BETTER: IF NOT EXISTS on a type name is the pattern that turns a NAME COLLISION into a SILENT SUBSTITUTION. Had V9 created the type unguarded the failure would be a loud duplicate-type error naming the real problem; guarded, the migration proceeds one statement further and fails on a default value, which reads as a typo rather than as two lifecycles sharing one name. THE REPAIR EXISTS AND ddl_body DOES NOT CARRY IT. LP-24.7 (TEST, committed) records it: TEST[1], 'V9 repair verification 13/13 - and it uses a SEPARATE type rather than widening V1's: two lifecycles sharing one name would let each column hold the other's labels and trade a loud migrate-time failure for a quiet runtime one.' That is the correct fix and the correct reason - widening V1's enum to hold all eleven labels would let form_version.ingestion_status hold 'QUARANTINED' and regulatory_document.ingestion_status hold 'pending', and no constraint anywhere would object. ddl_body is byte-identical to v1.18.1 (B3), so the repair lives in the built tree and not in the manifest, and the schema the manifest publishes is not the schema LP-24.7 proved applies. DISPOSITION: a CONTRACT-CLASS CORRECTION to ddl_body, carrying LP-24.7's separate-type repair forward under a correctly dated migration per db_conventions[3] (the V1/V2/V9 sequential names are the original baseline and are not a precedent). NOT repaired inline by this pass, and NOT repairable by a retrieval lane: ddl_body is under the downstream-only rule and B3 is open. Its bearing on LEX-40 is direct and is why it is reported rather than merely noted - LEX-40's change[2] proposed authoring a document status lifecycle WITH FAILURE VISIBLE, and that lifecycle already exists in V9 as FAILED and QUARANTINED. There is nothing to author; there is a migration to fix. Authoring a lifecycle on top of a migration that cannot apply is authoring on sand."], "LP-09": ["C9 Semantic-Layer exposure binding (gating cross-project dependency)"], "LP-10": ["Break/anchor amounts should arrive dual-form so MaskedValue gets the real classification (UI defaults internal otherwise)", "OPEN - THE CALIBRATION RISK, RECORDED RATHER THAN DECIDED. DEC-LP-10-1, REGISTERED in meta.v26_open_decisions at v1.35.0. It was raised here at v1.32.0 as a proposed id that deliberately did not write to the register, and three releases later it was still cited twice and registered nowhere - a decision nobody could find by looking where decisions live. The v1.35.0 dangling-citation gate found it. QUESTION FOR THE OWNER: who calibrates the permitted grounding-field catalogue, against what evidence, and is it ONE estate-wide list or one per source classification? The permitted list IS the whole control. TOO NARROW and the bounded skills are starved - Skill 1's deterministic resolve and Skill 3's assembly may not be able to ground a rule draft or an explanation on shape alone, and the pressure to widen then arrives as a build blocker under time pressure rather than as a proposal. TOO WIDE and 'schema, not rows' becomes a judgement call made in a prompt file, which is exactly the failure LEX-16's own rejected_alternative names and the reason masked sample rows were declined. A per-classification catalogue (wider for INTERNAL, narrower for RESTRICTED) is defensible and is a SECOND governed object with a second calibration; a single list is simpler and will be calibrated to the most sensitive dataset, which is the starving case. OWNER: the masking-split owner - the SME holding MASKING-SPLIT / MNPI-NEVER-EXTERNAL - and NOT a lane and NOT a build-time reading, because a lane that may widen its own permitted list has removed its own control. SEQUENCING: the catalogue is the GATE'S SOURCE, so it is calibrated before the gate is generated; generating against an uncalibrated list ships a control whose scope nobody approved. correction_feedback routes this as a STANDARD proposal held until approved.", "OPEN - LP-10 LANDS ONLY THE LP-10 HALF OF LEX-16, AND LEX-16 IS NOT ADOPTED WHEN THIS LANE COMMITS (adoption_standard.adopted_is_a_derived_state). Three halves stay unlanded and are named here so this point is not read as covering them. (a) LEX-16 change[3] also writes the structural assertion into LP-25's tests, and LP-25 is COMMITTED with all seven lanes RESOLVED - adoption_standard.reopening_a_committed_point governs and LP-25.3 is already reopened by DEC-LP-25-3; that reopening is LP-25's to declare, with its own owner, after that decision. (b) The same change[3] names LP-11, whose LP-11.1 is the only SLM call site in the estate and is therefore the natural home for the mirror assertion that the object reaching model.call is the closed grounding type - LP-11 is `blocked`, not committed, so it is freely authorable, but it is a different point and is not authored here. (c) LEX-16 change[6] leans on the LP-41 operand rule (a semicolon or a DDL verb is a refusal, not an escape), which LP-41 owns at its own tests_must_cover[16]; LP-41 is `proposed` in Wave 8, and making a Wave 4 masking lane wait on it would block LP-10 behind work that does not yet exist and would put a second owner on one rule.", "OPEN - THE INFO-LOG HALF OF THE FINDING HAS NO ASSERTION ON THIS POINT. LEX-16's evidence includes 'logging the whole message array at INFO first', which is a second egress: a log sink is a destination, and a payload refused at model.call is not refused at logger.info. Schema-only composition closes most of it by construction - if the payload never contains rows, the log cannot leak them - and mask_text (LP-10.1 TEST[3]) covers the analyst-steer text. What remains uncovered is that pinned_stack.observability says 'structured logs (no secrets/MNPI)' and no gate anywhere enumerates lexie-ai logging call sites against it. That is a build_context standard with no gate, not a sub-task on this point, and it is recorded rather than absorbed.", "LP-25 IS COMMITTED AND IS NOT REOPENED BY THIS PASS - NO CHANGE TO LP-25 IS AUTHORED HERE. LEX-16's change[3] ('the grounding payload is asserted structurally at the boundary, not reviewed in the prompt; the assertion is added to LP-25 and LP-11 tests') would put a new assertion into a point whose seven lanes are all committed and RESOLVED with conformance_test_passed true. adoption_standard.reopening_a_committed_point governs: an item landing on a committed point REOPENS it - the point declares the divergence in pending_items WITH AN OWNER and its status is RE-DERIVED rather than left standing, because a committed point that gains scope and keeps its status is a claim nobody produced. WHAT LP-25 WOULD NEED, stated so it is not lost: (a) a pending_items entry naming the divergence - LP-25.3 is a grounding composer, its nine modules were built with no schema-only constraint on what they hand a model, and its own scope records that the fixture corpus is conjunction-only reporting rules; (b) a named owner on that entry, not a lane; (c) LP-25's stored `committed` re-derived from its lanes under status_model.derived_not_stored, which drops it out of committed the moment LP-25.3 carries an unbuilt assertion; (d) the same treatment for LP-25.7, the D6 consolidation lane, whose whole-tree wire-through was re-run from an extracted zip that contains no such assertion, so its claim would silently cover a check that had not run. WHY IT IS NOT DONE HERE: LP-25.3 is ALREADY reopened by DEC-LP-25-3, whose own record states it 're-opens a committed sub-task carrying conformance_test_passed: true, so it needs an owner rather than a build-time reading'. Stacking a second reopening on the same lane before that owner has ruled produces two independent reasons to re-derive one status and no way for a later reader to tell which re-derivation they are looking at. One owner, one reopening, in order - and the order is given in `sequencing`.", "LP-11 IS THE OTHER HALF OF change[3] AND IS ALSO NOT AUTHORED HERE, FOR A DIFFERENT REASON. LP-11 is `blocked`, not committed, so it is freely authorable and no reopening clause applies - but LP-11.1 is the ONLY SLM call site in the estate (LP-11.1 TEST[0] enumerates call sites and is shown able to fail by adding a second), which makes it the natural home for the MIRROR assertion: the object SkillThree passes to model.call is the closed grounding type and nothing else. That is an addition to a different point and outside this pass. Recorded so LP-10.2 is not read as covering the call site: LP-10.2 constrains COMPOSITION, and a composer that bypasses the type entirely is caught by the call-site enumeration inside this lane's gate and by nothing on LP-11's own list.", "LEX-16 change[6] IS NOT CARRIED BY LP-10.2. 'An operand or free-text span reaching a model or a builder is refused on the LP-41 rule - a semicolon or a DDL verb is a refusal, not an escape' is already owned by LP-41 at its tests_must_cover[16], where it is scoped to operands crossing the NL-to-Core operation protocol and reasoned about there ('SQL_ISH catches query FRAGMENTS and does not catch 1=1; DROP TABLE x'). LP-41 is `proposed` in Wave 8. Restating the rule on a Wave 4 masking lane would create a second owner for one rule (adoption_standard.no_second_implementation) and depending on it would block LP-10 behind a point that is not yet work. LP-10.2 asserts the STRUCTURAL separation of instruction from data; the LEXICAL operand rule stays LP-41's, and LEX-16 is not fully adopted until LP-41 lands it.", "THE CONTROL REGISTER ENTRY FOR LEX-16 NEEDS TWO CORRECTIONS, recorded where they were wrong per comment_standard rather than tidied away. (1) rego_reason names a runtime policy AND a build gate in one sentence, which adoption_standard.rego_or_gate_never_both_names forbids; the single declaration is GATE, with LP-04's masking egress cited as reuse and a supplied datum. (2) controls[] claims EU AI Act Art. 10 as SUPPORTS on the basis that 'grounding payload composition is data governance'; Art. 10 governs training, validation and testing data sets, an inference-time grounding payload is none of them, and the claim is downgraded to RELATED here. Neither correction weakens the item - Art. 15(5) carries it, and GATE is the stronger of the two names because it fails the build rather than denying at runtime."], "LP-12": ["Preset observation period ('observed') as a later deliverable (tighten D7 to require 'observed' first if observation is mandatory)", "SCHEMA OWED (B3 / CONTRACT class, owner proposal - not authored by LP-12.8): a partial unique index enforcing exactly ONE ACTIVE version per (client_id, template_key) on intelligence.prompt_template. Today the only uniqueness is (client_id, template_key, version), so two ACTIVE rows are constructible and LP-12.8 can only refuse them at runtime.", "SCHEMA OWED (B3 / CONTRACT class): `variables jsonb NOT NULL DEFAULT '[]'::jsonb` on intelligence.prompt_template ships the lenient case AS THE DEFAULT - a template with no declared slots loads clean. LP-12.8 refuses it at load, but the default remains the shape that invites it, and changing it is a Part-M delta on an applied baseline table.", "SCHEMA OWED (B3 / CONTRACT class): a content-hash column recording, on the run, the hash of the instruction body the model was actually given. LP-12.8 emits it on the EvidenceTrace; nothing yet has a column to persist it into.", "LP-12 DECLARES NO PY LANGUAGE AND NO AI-RUNTIME STACK. lang_tags is [SQL, JAVA, TS, REGO, TEST] and tech_stack is [BE, FE, POLICY]; LP-12.8 is the point's first Python lane. Both lists must gain their entry in the same change, or the point declares a language it holds a lane in.", "LP-12.fixed_contracts[1] still attributes the MRM/SoD gate to LP-04 while lextr.ai.mrm_sod was authored and committed at LP-22.5 - a stale citation already recorded against the withdrawn LP-12.6 and untouched by this item. Carried forward, not repaired here."], "LP-13": ["CLOSED at LexIntl 12 (#18a): the operation->endpoint binding IS now externalized — lexie_ai/adapter/operation_binding.py + a per-deployment config, delivered with UC10 D3. OPA answers WHETHER, config answers WHERE. Additive: AdapterEndpoints is untouched and used as a fallback, so this merges before any other use case migrates. An allowed-but-unbound op fails as a MISCONFIGURATION, deliberately distinct from a denial.", "#18b capability handshake — PARTIALLY closed: UC10 ships catalog_ready/handoff_ready as default-deny datums plus an adapter capabilities() declaration and a deployment PREFLIGHT that catches the asymmetric fault (a lane declared READY with no endpoint bound). The general estate-wide handshake remains open.", "#18 add capability handshake/discovery (kh_ready etc.)", "confirm host owns the recon->cell calc-chain rollup", "v1.26.0 BLOCKING - LP-13 HAS NO IMPLEMENTATION LANE. Removing LP-13.1 left only the wire-through sub-task. The deprecation was correct (the scope described LP-14's coordinator seam, not this point's op dispatch), but it exposed a pre-existing defect rather than creating one: the delivered artefact is lexie_ai/adapter/operation_binding.py, a PYTHON module, while lang_tags declared JAVA. LP-13 needs a PY sub-task owning fail-closed op dispatch, requester threading, the operation->endpoint registry and the capability handshake. That is new authorship and is deliberately NOT written here - it is an UPDATE-class decision for the owner."], "LP-14": ["OI-11 KG wiring + contribution_rank vs the real gateway", "confirm RunResult shape + trigger path (OI-9)", "CONTRACT-CLASS HOLD (B3): intelligence.reporting_cycle, intelligence.materiality_threshold and agent_run.cycle_id are absent from ddl_body, which is byte-identical to v1.18.1. LP-14.0 is a PROPOSAL to the schema owner, held in pending_owner_approval/db/migration beside LP-46.0's, LP-22's, LP-39's and LP-24's. It cannot be merged into ddl_body or called built until the owner takes B3's option (a) embed in apply order or (b) split ddl_baseline / ddl_pending_owner_approval. OWNER: schema owner.", "THE AGENT_RUN BINDING IS A CHANGE TO AN APPLIED, SEEDED BASELINE TABLE. It ships as a SECOND migration, additive and nullable with no FK on day one, on LP-39's precedent ('a constraint on an applied, seeded baseline table is a new failure mode for every existing writer') and LP-40.1's (held blocked for adding one column to agent_run). Until the promotion lands, a run with no cycle reads UNBOUND and is never defaulted to the open cycle. The NOT NULL promotion and any backfill are an owner step, not assumed here. OWNER: schema owner.", "'ANALYSES AWAIT REVIEW' HAS NO SINGLE SPELLING, AND THE CLOSE ATTESTATION IS BUILT ON IT. LP-07 names pending_review and in_review inside one record, and intelligence.run_status is ('created','running','completed','in_review','accepted','corrected','rejected','failed') - no pending_review, no stopped. A close predicate written against the wrong name sees ZERO outstanding analyses and PERMITS THE CLOSE, which is this item's own failure mode. The predicate is derived from the enum as applied; the enum question is B3's owner's and is not answered here.", "LP-14.0 DECLARES NO ADAPTER OPERATIONS, DELIBERATELY. LP-14.3 TEST[0] generates its allow-list from the DECLARED OP SETS of LP-14, LP-16 and LP-18, so any op LP-14 declares enters that list and an op declared with no entry FAILS THE BUILD. LP-14.3 is already RED by design under TEST[1] (LP-16 committed and built, walk_calc_chain registered nowhere). Whichever lane later exposes cycle-open/close/reopen or threshold-approve as callable operations grows that generated allow-list and gives LP-14.3 a SECOND independent reason to be red; recorded now so it is not discovered at build time.", "REUSING lextr.ai.mrm_sod INHERITS OI-LP39-1: its deny strings say 'definition', so refusing a threshold approval reads 'definition is not pending approval' to an approver looking at a materiality bar. Generalising to 'subject' is a non-additive change to a committed package and an owner decision, not this lane's. OWNER: LP-22 / policy owner.", "B2 CONSTRAINS THE GATE, NOT THE AUTHORING. The variance migration set is LP-01's ('Land the embedded migrations - V1 baseline, then V2/V9/variance-SLM - in the Flyway set') and LP-01 is stored ready with its only lane blocked (B4). flyway migrate does not reach the end of the set today (B1 halts at V9; B2's variance-SLM insert fails on nine column names and an absent ON CONFLICT arbiter), and ${schema} needs flyway.placeholders.schema, which LP-01's manifest_of_steps never mentions. LP-14.0's validation_gates.SQL run is therefore BASELINE + this file, said plainly as such; this lane resolves no placeholder and picks no V-number scheme, both of which are LP-01's.", "v1.32.0 - EFFECT ON LP-14.3: UNCHANGED, AND THAT IS A DECISION RATHER THAN AN OMISSION. LP-14.0 declares NO adapter operations. LP-14.3 TEST[0] requires 'THE ALLOW-LIST IS GENERATED FROM THE DECLARED OP SETS OF LP-14, LP-16 AND LP-18, NEVER HAND-LISTED', so an op this point declares enters that generated list automatically and an op declared with no entry FAILS THE BUILD through LP-34's completeness gate. LP-14.3 is ALREADY RED BY DESIGN under TEST[1], because LP-16 is committed and built while its walk_calc_chain has no policy registration anywhere in the estate - so a new declared op would not merely add work, it would give that lane a SECOND independent reason to be red and would force TEST[6]'s closed-set claim ('no re-run operation appears in the allow-list') to be re-derived against a larger declared set. It is also the wrong home: tool_scope_variance gates ADAPTER FETCHES (the six live methods, walk_calc_chain, LP-18's three evidence ops), and opening or closing a cycle and approving a threshold are governed WRITES on intelligence-service, not fetches. The runtime decision they genuinely need - four-eyes on a threshold approval, and authority to override a close over outstanding items - is lextr.ai.mrm_sod's, AUTHORED AND COMMITTED at LP-22.5 and built deliberately definition-agnostic 'so the same package serves the registry now and the preset envelope later with no second implementation to drift'. It is REUSED and cited per adoption_standard.policy_cites_its_owner, exactly as LP-39.3 reuses it for OPA-TDM-005 and re-authors nothing; authoring a second four-eyes package here would be the anti_dup hard-rule failure and the LP-12.6 withdrawal all over again. WHAT DOES CHANGE, and is recorded as a pending item: the moment any LP-14 lane exposes cycle or threshold actions as callable operations, LP-14.3's generated allow-list grows and must be regenerated, never hand-edited. The declaration also inherits OI-LP39-1 - mrm_sod's deny strings say 'definition', which reads wrong to someone approving a materiality bar."], "LP-15": ["OI-10 reconcile reused-atom prop/path vs the real 2b package (EvidenceLedgerViewer prop)"], "LP-16": ["STATUS CORRECTED at v8: read 'blocked' while its own background said (BUILT). Verified against the code before changing — UC1b variance: 5 skill modules · adapter/variance_ops.py · tests green. The build had landed; only the point status was never moved.", "OI-11 KG wiring + contribution_rank vs the real gateway; kg_ready flips when production-ready", "revisit Option B (bump Y-14Q-H to depth 4) only if Atomic-level assessment is later required"], "LP-17": ["OI-10 swap DrillGraph to a shell Cytoscape atom if one exists; OI-8 confirm /intelligence/variance/drill response vs the one agent_run"], "LP-18": ["anchor concept-map + recon reason->driver table come from the Problem-1 pipeline (not hardcoded)", "anchor_ready only once the entity's 10-Q/10-K is loaded (SEC registrant only)", "break amounts should arrive dual-form"], "LP-19": ["a synchronous variance controller returning RunResult incl. runId, and the rich VarianceExplanation through the Java/HTTP boundary (both pre-existing seams to wire)"], "LP-20": ["STATUS CORRECTED at v8: read 'blocked' while its own background said (BUILT). Verified against the code before changing — UC12 operational: 4 skill modules · adapter/operational_ops.py · tests green. The build had landed; only the point status was never moved.", "further UC12 integration work may follow", "v1.26.0 DEPRECATION CONSEQUENCE: LP-20.4 (TS reference renderer) withdrawn. UC12 has no destination in the shell's destination set and reaches a user only through the Lexie inline panel. If UC12 is to keep a dedicated screen, LP-47 must add the destination FIRST; only then does a UI sub-task here have a home. A committed point loses a committed sub-task: the artefact is not unshipped, the CLAIM that this point owns it is withdrawn."], "LP-21": ["STATUS CORRECTED at v8: read 'blocked' while its own background said (BUILT). Verified against the code before changing — UC8 semantic: 4 skill modules · adapter/semantic_business_ops.py + semantic_exposure_ops.py · tests green. The build had landed; only the point status was never moved.", "binding C9 (gating) · graph_ready (R4) · business_ready (Phase B)", "Intelligence<->Core element_dependency reconciliation", "composed_definition_txt -> SLM SME confirm"], "LP-22": ["OWNER-APPROVAL: intelligence.registered_definition + 3 enums, INCLUDING the rename from the proposed skill_registry (CONTRACT)", "OWNER-APPROVAL: tagging taxonomy — 5 closed vocabularies + the open labels axis (STANDARD); lives in TagVocabulary.java so approving it is a reviewed code change, not a migration", "OPEN: reviewer identity — proposed as the same approver pool as preset MRM, separated by capability governance.skills.approve", "OI-LP22-1: CLOSED (Option B). Reachability is now a FACT returned by the new OpaClient.probe() / OpaResult(allow, denyReason, reachable); the sentinel string-matching was DELETED, not kept as a fallback. evaluate() keeps its exact signature and delegates, so GovernanceGateServiceImpl and the OpaDecision record are byte-identical to baseline (verified). Fail-closed unchanged: allow=false whenever OPA cannot be reached; reachable is consulted ONLY by the build reconcile, to avoid reporting an outage as binding drift.", "OI-LP22-2: a THIRD expression of each capability fact (deployment config) alongside the OPA data file and the preset snapshot. Duplication INHERITED from the baseline, not introduced. Display-time only; OPA remains the run-time authority.", "OI-LP22-3: sync path is POST /skills/sync not ':sync' (a colon escapes inconsistently across proxies; CI calls it unattended). Cosmetic; identical semantics.", "OI-LP22-4: baseline intelligence-ui has 139 unresolved imports (tsc red). LP-22 adds ZERO and inherits ONE. Recommend a separate remediation task — it also unblocks Review Queue and Preset Management.", "OI-LP22-5: the UI client calls fetch directly; @/lib/http is a commented-out tsconfig path. Swap the single request() function if the host supplies a client.", "PresetWizardServiceImpl SoD wire — one line before envelopeDao.approve() closes backlog 5a for presets too. LP-22 does not modify that file.", "preset.skill_ref does not exist, so no preset binding is asserted — the surface states the reason. An additive column is an owner-approval item outside LP-22."], "LP-23": ["agent memory + per-analyst learning are genuinely unbuilt roadmap gaps", "DEPENDENTS REDUCED at LexIntl 12: LP-24 (UC10) dropped its depends_on LP-23, as LP-25 (UC11) did earlier for a different reason. The floater-UI half of this point is NOT Intelligence's to deliver — the SME confirmed the inline LexiAI surface is HOSTED BY CORE — so what LP-23 still owns is orchestration composition, agent memory, and route-out dispatch. UC10 needed only the last, which UC8 already has. CORRECTION: an earlier draft of this note said 'nothing now blocks on LP-23 except itself'. That was WRONG and is retracted — LP-27 (Orchestration Intelligence) and LP-28 (Data & Control Intelligence) both still declare depends_on LP-23, correctly: they are layered ON the orchestration rather than beside it. What is true is narrower: no BUILT use case depends on LP-23 any more.", "v1.26.0 DEPRECATION CONSEQUENCE: after LP-23.2 merged (v1.25.0) and LP-23.3 was withdrawn here, LP-23 is a PY skill plus a wire-through and nothing else. That is the honest shape given DD-40 (Core owns both screens) and LP-25.9 (the shell routing is already built) - but a point with no surface and no service lane should be re-examined as a whole before it leaves 'proposed'."], "LP-24": ["BLOCKING (Core) — the ACCEPTANCE RECEIPT SHAPE. Migration part 3 (V20260816_03), three query keys and a widened findAnalyticalEvidence are HELD in pending_owner_approval/ against three stated assumptions: the receipt identifies the report by a REFERENCE, the reference carries a VERSION, and the timestamp is the existing accepted_at. Without it, PROPOSED and ADOPTED are indistinguishable in the evidence and the correction corpus loses its only label. Ask written: docs/asks/ASK_CORE.md", "OPEN (deployment model, SME) — READINESS DATUM SCOPE. catalog_ready / handoff_ready are per-DEPLOYMENT booleans. Correct on-prem, where the deployment IS the tenant. WRONG for the SaaS shared-inference tier (Option A, the default), where one deployment serves several tenants: a single global catalog_ready=true opens the lane for a tenant whose catalog is not wired — a FAIL-OPEN BY AGGREGATION, exactly what default-deny exists to prevent. If the answer is per-tenant, the datum needs a tenant dimension and tool_scope_analytical must read input.client_id, which it currently accepts and does not use. NOT changed unilaterally: it is a deployment-model decision.", "CLOSED at LexIntl 12 — cross-tenant assertion on the RESPONSE path. client_id is now required on CatalogEntryDTO and the adapter RAISES (CrossTenantEntryError) rather than filtering a foreign entry: filtering would normalise a leak and hide a contract breach behind a clean screen. Tenant was already threaded correctly on the REQUEST path (every op, the OPA input, every query, agent_run); nothing had checked the way back.", "OPEN (Semantic Layer) — what a catalog ENTRY may carry beyond measures/dimensions/filters. Nothing is BLOCKED (catalog_profile records whatever is declared and a thin catalog degrades honestly, saying the score rested on composition alone) but discovery QUALITY depends on it. Ask written: docs/asks/ASK_SEMANTIC_LAYER.md", "OPEN (Core) — the regulatory SCOPE contract: how scopes are expressed, how entitlement narrows them, and how a review-scope run is marked NOT a submission. Stubbed as strings + entitled_scopes filter + submission=false. The stub most likely to be wrong in a way that matters.", "OPEN (Core/SL) — a row-volume BAND. Resolves the cardinality-risk signal without reading a row; absent, the signal reports no source rather than a number.", "OPEN (SL) — is logical_long_nm localized? Feeds LP-40; decides whether attribute pickers are translatable.", "OURS, DEFERRED — record surface_id on the run? Recommended: additive nullable column with a closed CHECK (inline | analytical_screen), supplied by the caller like screenContext and NEVER branched on. AskContext already models surfaceId in the shell port; the UC10 run contract does not.", "OURS, DEFERRED — the dashboard presentation diverges between carriers: the v23 prototype renders PER PANEL (simulation-faithful) while the D3 TypeScript panel_scoring scores best-panel + coverage. Both defensible; settle which is canonical before the refinement UI hardens.", "OURS, DEFERRED — which surface model is authoritative: the v23 review prototype, the shell surfaceRegistry (recommended), or the feature slices. A drift check asserting every built slice appears in the authoritative model would make divergence impossible to do silently.", "INHERITED, UNCHANGED — the LexiAI handoff format (STRUCTURE vs clipboard text) is undecided with Core/LexiAI. UC10 assumes structure and refuses free text; the D6 handoff banner states that the ask crossed as structure, so if it becomes clipboard text that banner becomes a lie and must go.", "INHERITED — X-User-Functions is not emitted by the gateway; Maven Central unreachable, so no Java compiled (D4 was validated structurally and says so).", "NAME COLLISION RESOLVED — 'Analytical & Reporting Assist' is also a PILLAR (variance · trend · drill-down · narratives) mapping to UC1a/b · UC3 · UC4 · UC5. LP-24 is UC10 REPORT DISCOVERY AND CONSTRUCTION, not the pillar remainder."], "LP-25": ["genuinely unbuilt roadmap gap; plan carefully (flagship #2)", "PREMISE CORRECTED (Aug 2026): UC11 was partly sequenced as flagship #2 on the belief that rules training data already existed. It does not. Traced to the 4 Jun statement 'training data WILL BE available' (future tense), mis-carried as 'exists'. What exists is REFERENCE data, which grounds retrieval; it does not teach authoring. UC11 remains sound — its raw material is real — but any plan assuming a ready rules corpus needs revisiting.", "OPEN — does Core's accept in the LexiAI floater transfer STRUCTURE or CLIPBOARD TEXT? If text, the provenance and the per-operand grounding are lost and the panel cannot tell an arrived draft from a typed one. This decides whether draft_provenance is implementable at all.", "OPEN — draft_provenance is NOT yet in the schema. agent_run carries invocation_origin (DD-9, user/system_event) which is about WHO INVOKED THE RUN, not who wrote the DRAFT. An additive column or run-payload field is required.", "OPEN — is logical_long_nm localized in the Semantic Layer? That is the SL owner's call, not Intelligence's.", "OPEN — RENAMED TO 'RULES COPILOT' (SME): the copilot authors ANY rule type, including DATA-QUALITY rules and EDIT CHECKS, not only COA/reporting rules. This is NOT a cosmetic rename. MEASURED DEFECT IT EXPOSES: check_correspondence() reports EVERY predicate as 'corresponds to no numbered clause' when rule['clauses'] is empty — verified by execution: a 2-predicate DQ rule returns passed=False with 2 of 2 untraceable. For a REPORTING rule with a missing instruction that finding is correct; for a DQ rule or an edit check there IS no interpretation to correspond to, so it is a FALSE finding on every predicate. Correspondence must degrade to NOT-APPLICABLE rather than fire, which requires the contract to carry a RULE KIND (reporting / data-quality / edit-check) — there is currently no such field, and the skill cannot otherwise distinguish 'no instruction because none applies' from 'no instruction because one is missing'. NOT FIXED: it is a contract change, not a patch.", "OPEN — edit checks are CROSS-FIELD validations rather than population definitions, and DQ predicates are frequently UNARY (the corpus measurement stands: 298 of 1,413 checks carry no graph edge precisely because unary DQ predicates are invisible to edge traversal). Neither shape is exercised by the UC11 fixture corpus, which is conjunction-only reporting rules."], "LP-26": ["STEPS — THE DECISION R5 SURFACED, AND THE ONE OUTSTANDING DECISION ON THIS POINT. R5 is the first caller of record_plan, which made a D3 decision take effect for the first time: the recorder's step count INCLUDES the plan, so every preset's action budget is one smaller than the number its author wrote. Skill 3 records five actions; the only seeded preset (UC1A_VARIANCE_Y9C) is max_steps=6 and now sits exactly on the boundary. A fixture at 5 records 6 and does not raise — for one reason only, that the guard is not called after the final step. It passes because of a MISSING CALL, not because the arithmetic is sound, and adding the symmetric guard is a one-line change that looks obviously correct and breaks every UC1a run. 'Raise the number' is not general: the ceiling of 8 is enforced in three places and was confirmed by attempting the UPDATE and being refused, so a preset at 8 cannot be given room for its own plan at all. Nothing was changed behaviourally; the arithmetic is pinned by a test asserting it as-is so the hazard cannot be tripped in silence.", "TO LP-22: preset.skill_ref — the RUN-level half of reproducibility. R5 closed the step-level half; this is the half that was genuinely blocked. Ask written: docs/asks/ASK_LP22_preset_skill_ref.md", "TO CORE: the approver identity — the only gap appearing in all four regulatory regimes and the only one that cannot be closed from our side at all. Written, approved, NOT YET SENT. Fold the correlation-id echo request into the same conversation.", "TO KG TEAM: a graph build identifier per traversal. Written, approved, NOT YET SENT. The subgraph content hash is built regardless — it is entirely ours.", "TO DOCUMENT OWNERS: DD-65 says the subject role is '(asked vs touched)' and the database has four; v23 lists the kind as dataset.id.version and every value written under it starts with 'training.'. In both cases the code is right and the document is stale — the safer of the two ways to be inconsistent and still worth fixing.", "DEPLOY SWITCHES, all off and all needing an owner: the coverage marker (the only item whose cost accrues while nothing happens — a day it is off is a day that reads inconclusive forever and can only be bought back with a signed attestation); a log shipper pointed at lextr.evidence.chainhead; actor declaration once X-User-Id means something; a cold-storage releaser; and scheduling the out-of-process purge.", "ONE UNRUN GATE, was two. `opa test` IS DONE — the binary installs from the GitHub release, and running it exercised the estate's ENTIRE existing Rego bundle for the first time (263/263) as well as D3b's own. Maven Central is still unreachable, so NO Spring-annotated class in LP-26 has ever been compiled. Everything dependency-free is compiled and executed; everything else carries structural validation, labelled as such. The transaction-manager override in R4 is the piece to look at first — that it replaces the auto-configured bean is reasoned, not observed.", "A1 — THE COVERAGE QUESTION HAD NEVER BEEN ASKED, and asking it is what found the rest. Every deliverable gated its own work; nothing checked whether the union was covered. Now derived, not listed. FIVE FINDINGS, all closed in the same pass: (1) ledger.ts asserted TAMPER_EVIDENCE_BUILT = false — a D0 constant D1 made false — so an auditor-facing export printed 'NOT tamper-evident' over a chain that exists, and a mutation gate PINNED the stale value. The boolean was the cause: the property has three honest states and two of them cannot fit in a flag, so it is now DERIVED, and 'witnessed' stays unreachable while the witness item is open. (2) THREE artefacts had no gate at all — the deployment properties, the queries held for R2, and lp26_evidence_purge.sh, the tool that runs during an incident. (3) EvidenceDeploymentProperties claimed an unrecognised value throws AT STARTUP; it threw lazily, from a class with NO CALLER, so a typo'd retention model would never have been noticed. Now rejected at bind. (4) 156 build artifacts sat in the tree from validation runs and there is NO ROOT .gitignore — pre-existing, not LP-26's, and the proposed file is HELD because a repository-wide policy file is the owner's call. (5) The register's closing arithmetic and the decision count contradicted the same pages' own lists.", "THE PRISTINE DIFF CANNOT SEE LP-26-CREATED FILES. It counts 'Files differ', and a file this programme wrote shows as 'Only in'. A checksum manifest would go stale silently, so the current net is the test suites plus each mutation gate's refusal to run against a non-green baseline — a refusal that is load-bearing and should not be relaxed. Recorded as a known limit rather than closed.", "REOPENED BY LEX-24 AND LEX-27 AT v1.32.0, AND THIS POINT'S STATUS IS RE-DERIVED RATHER THAN LEFT STANDING. Six sub-tasks (LP-26.16 … LP-26.21) and six steps (E1 … E6) are added to a point stored `committed`, whose own sequencing_rationale reads 'COMPLETE on the build side' and whose parallel_group reads 'nothing outstanding on the build side'. Both sentences are now false and are corrected by this entry rather than by a silent status. adoption_standard.reopening_a_committed_point: 'A committed point that gains scope and keeps its status is a claim nobody produced.' OWNER: the point's own claimed_by, 'LexIntl LP-26 (D0 → R5)', jointly with the SME who approves CONTRACT-class proposals; the AUDIT-007 half is LP-26.12's owner. STATUS: in_progress. The fifteen shipped lanes keep their own `committed` status and NONE of their scopes or tests is edited — the record of what was built is not amended by what was added.", "TO THE LP-26.4 OWNER — ONE EXPORT WRITER, NOT TWO. evidence.impl.FileEvidenceExporter already writes a file in the lifecycle's export -> VERIFY -> tombstone -> delete order. LP-26.16 is authored as an EXTENSION of it and not as a parallel exporter (anti_dup.hard_rules; adoption_standard.no_second_implementation), which means LP-26.4's VERIFY step gains a stronger meaning: an export whose digests and chain do not re-derive from its own bytes cannot reach the delete. That STRENGTHENS the committed lane and its test text is not edited; the owner confirms the two artefacts are one format or names why they must differ.", "TO THE LP-26.13 OWNER — A SECOND DOOR ON THE D5 SURFACE. LP-26.13's scope records that 'the reverse and dedicated-search doors are NOT built and three checks assert it'. The LP-26.17 hand-back door is neither of those two by name. IF the shipped check is expressed as 'this controller exposes exactly one door' it goes RED and must be INVERTED with a stated inversion condition, never deleted — the pattern LP-26.7 set for the `witnessed` unreachability gate. Which of the two it is cannot be read from the manifest and is not asserted here.", "TO THE LP-26.15 OWNER — THE A1 COVERAGE DERIVATION MEETS SIX LANES OF NEW FILES. lp26_audit_full.py derives coverage from the pristine diff, every created file must be NAMED BY A GATE, and 'an exemption may not reach a code file'. Six new lanes ship new code files, so the audit goes red until each is named by its own lane's gate. That is the gate working; it is recorded here so it is not read as a regression on the day it fires.", "TO THE LP-26.12 OWNER — THE SEVENTH RULE IS NOT FREE. AUDIT-007 enters a package whose evidence of correctness is 312 Rego tests, 29 mutants and 2304 differential cases agreeing on decision AND reason. All of them are RE-RUN with the rule present, as an acceptance line of LP-26.18 rather than an assumption about it.", "LEX-26 IS NOT AUTHORED ON THIS POINT AND THAT IS THE FINDING. 'Determinism recorded from the response, never the request' is ALREADY LANDED at LP-06.2 (v1.27.0), which meta.v26_superseded_register names verbatim; authoring it here would create a second owner of a rule stated in full elsewhere. LP-26.16 therefore CARRIES the value and never computes it, and records it ABSENT where LP-06.2 has not written it — 'not recorded' and 'ran at provider default' are different answers. The only residue is the serving fingerprint (model digest, quantisation, engine, version — zero occurrences at v1.32.0), which belongs to LP-06.1, the sole owner of every statement against agent_run and agent_run_step, and is NOT raised as an LP-26 lane.", "THE POINT-LEVEL depends_on OVER-BLOCKS THE SIX NEW LANES AND IS OVERRIDDEN AT LANE LEVEL. LP-26.depends_on is [LP-06, LP-22, LP-24, LP-39] and LP-06 is `blocked`; under status_model.lane_dependencies a point-level dependency 'is the union of what its lanes need and therefore over-blocks every lane that does not need all of it'. None of the six needs LP-06 — that is exactly why LP-26.16 records determinism as ABSENT rather than waiting for it — so LP-26.16 declares depends_on [LP-22] (the skill registry supplying the skill_ref and skill_version the pack records) and the other five declare none. Note for the status_coherence gate: a point stored `committed` while depending on a `blocked` point is a pre-existing disagreement on this point and is NOT introduced here.", "NO Spring-ANNOTATED CLASS IN LP-26 HAS EVER BEEN COMPILED (pending_items[6]) AND THAT NOW REACHES A CONTROL RATHER THAN A CONVENIENCE. LP-26.17's verifier is authored dependency-free for that reason: a self-verification control that cannot be executed in this estate today is a control nobody has seen run. Anything not run is named as not run, per definition_of_done.", "REOPENED BY LEX-29 AT v1.32.0 - THIS ENTRY IS LEX-29'S CONTRIBUTION TO A RE-DERIVATION ANOTHER WORKSTREAM OWNS, NOT A SECOND RE-DERIVATION. Two sub-tasks (LP-26.22, LP-26.23) and two manifest_of_steps entries (E7, E8) are added to a point stored `committed`. Under adoption_standard.reopening_a_committed_point the point declares the divergence with an owner and its status is RE-DERIVED rather than left standing - 'a committed point that gains scope and keeps its status is a claim nobody produced'. OWNER: LP-26's own claimed_by, 'LexIntl LP-26 (D0 -> R5)', jointly with the SME who approves CONTRACT-class proposals, since the Art. 13 payload alternative is held as a proposal. NOTHING SHIPPED IS EDITED: no committed lane's scope or tests_must_cover is amended by this item. ONE COMMITTED LANE IS TOUCHED WITHOUT BEING EDITED - LP-26.3, whose export surface is REUSED as the generator's registry and ledger input rather than a second reader being opened over the same tables; its owner confirms the export shape carries what the document needs. The point's sequencing_rationale ('COMPLETE on the build side') and parallel_group ('nothing outstanding on the build side') are false with these two lanes present, and LEX-24/LEX-27's six lanes make them false independently; the correction belongs in the single re-derivation, and this entry supplies its LEX-29 half rather than issuing a competing status.", "SR 11-7 STAYS IN LP-26.background AND THE CORRECTION IS HELD, WITH AN OWNER - the one clause of LEX-29 that is NOT landed here. LP-26.background still reads 'SR 11-7 effective challenge' after the catalog was corrected at v1.19.1, and meta.v27_regulatory_finding already records exactly that. Re-targeting the citation onto the EU AI Act means leaning on DD-63, which meta.v27_regulatory_finding also records as 'cited and defined nowhere' - and adoption_standard.regime_named_once is explicit that 'a decision id cited and never defined is a broken citation; DD-63 is defined before any item leans on it.' Replacing a stale citation with a citation to an undefined decision is not an improvement, so the edit is HELD. OWNER: whoever defines DD-63; this item is a consumer of that definition and does not repair it. Every EU AI Act citation in LP-26.22 and LP-26.23 inherits the same open item and neither lane claims otherwise.", "ART. 13 INSTRUCTIONS-FOR-USE: WHERE THEY LIVE. The intended and PROHIBITED uses must be true of the SKILL VERSION rather than of the platform, and are read from LP-22's existing descriptive skill.manifest.json. A per-skill documentation payload column on intelligence.registered_definition would make them queryable; it is a new intelligence.* object, is CONTRACT-class, and is held as a PROPOSAL to the SME under correction_feedback.routing_by_class. Not applied; ddl_body untouched.", "LEX-08 WAS DECLARED A BLOCKER ON LEX-29 AND IS DISCHARGED HERE RATHER THAN WAITED ON, WHICH IS RECORDED BECAUSE IT IS A JUDGEMENT AND NOT A FACT. The refusal needs two facts per asserted control: that its implementing module is reachable from a composition root - LEX-02's reachable_from_root, LANDED - and that a test names it and goes red when it is removed, which is LEX-08's claims-are-tested gate and is NOT in this batch. The second is supplied locally by the claim table plus validation_gates.generated_gate, which is the same mechanism LEX-08 would generalise estate-wide. WHEN LEX-08 LANDS THE TABLE IS ITS FIRST CONSUMER AND NOT A SECOND IMPLEMENTATION; if LEX-08 lands a different linking key than the control id, this table is re-keyed to it rather than kept in parallel. OWNER: LEX-08's.", "REOPENED AT v1.33.0, PER adoption_standard.reopening_a_committed_point. LP-26 gains six sub-tasks (LP-26.16 … LP-26.21) and six manifest_of_steps entries (E1 … E6) that did not exist when it was called committed: an evidence pack that is a FILE at a versioned format identifier, a verifier that re-derives every digest and the chain from the archive's own bytes and reads no claim inside the pack, a hand-back door, a seventh rule inside a BUILT Rego package, a chain-formula agreement corpus spanning the database trigger and the offline re-derivation, and a draft-versus-approved label on every artefact that leaves. THREE COMMITTED LANES ARE TOUCHED WITHOUT BEING EDITED: LP-26.4 (FileEvidenceExporter — one export writer, not two, and its VERIFY step gains a stronger meaning), LP-26.12 (AUDIT-007 lands inside lextr.ai.audit_read and its 312 tests plus 2304 differential cases are re-run) and LP-26.13 (a second door and a required DTO field on the D5 surface whose structural checks assert what was NOT built). The point's own text is now false in two places — sequencing_rationale 'COMPLETE on the build side' and parallel_group 'nothing outstanding on the build side' — and those sentences are corrected in pending_items rather than by leaving the status to carry them. NOTHING ELSE MOVES: no shipped lane's scope or tests_must_cover is amended, because the record of what was built is not amendable by what was added. OWNER: LP-26's own claimed_by — 'LexIntl LP-26 (D0 → R5)' — as the point owner, jointly with the SME who approves CONTRACT-class proposals under correction_feedback.routing_by_class, since all six lanes are held as proposals and none is applied. THREE NAMED SUB-OWNERS FOR THE THREE COMMITTED LANES TOUCHED: the LP-26.12 owner signs the AUDIT-007 re-run (312 Rego tests, 29 mutants, 2304 differential cases); the LP-26.13 owner decides whether the three structural checks asserting the unbuilt doors go red against a hand-back door and, if they do, INVERTS them with a stated condition rather than deleting them; the LP-26.4 owner confirms that the lifecycle export and the auditor pack are one format. The issued-pack registry is explicitly NOT this point's — it is LEX-25's, and it is named here so it is authored once.. STATUS RE-DERIVED committed -> in_progress. `committed` is the one status that cannot survive this. adoption_standard.reopening_a_committed_point is exact: 'A committed point that gains scope and keeps its status is a claim nobody produced' — and LP-26 would be claiming conformance for six lanes with conformance_test_passed false and disposition UNRESOLVED. Of the five states in status_model.point_states, `in_progress` is the honest one: it was declared at v1.31.0 precisely for 'started, not committed', and a point holding fifteen committed lanes and six `ready` ones is literally that. `blocked` would be wrong — every one of the six is STARTABLE under status_model.readiness_rule (its own dependencies are committed, its status is ready, its scope is point-specific and its tests_must_cover is non-empty), and calling a startable board blocked is how a generator emits nothing. `ready` would be wrong in the other direction, because it erases fifteen delivered lanes. ONE THING IS NOT PAPERED OVER: status_model.derived_not_stored says the stored value is advisory and the viewer's eff(p) computes committed / ready / blocked from the board — THREE outputs, not five — so eff(p) will derive `ready` for LP-26 while the stored value reads `in_progress`, and that disagreement is exactly what validation_gates.status_coherence fails on. It is recorded as a divergence with an owner rather than resolved by choosing the weaker word: either eff(p) learns the fifth state, or LP-26 reads `ready` and the manifest says so out loud. A status chosen to make a gate green is the same failure as a point that keeps `committed` to avoid re-deriving. DECLARED OPENLY: the viewer's eff(p) emits only committed / ready / blocked and will therefore derive `ready` against a stored `in_progress` - build_context.status_model already says point status is DERIVED and the stored field advisory, so the disagreement is recorded with an owner rather than settled by choosing the weaker word.", "v1.33.0 LEX-29 CONTRIBUTION TO THE REOPENING: LEX-29 ADDS TWO SUB-TASKS (LP-26.22, LP-26.23) AND TWO manifest_of_steps ENTRIES (E7, E8) TO A POINT STORED `committed`, AND THIS IS THE DIVERGENCE THAT ENTRY RECORDS. Under adoption_standard.reopening_a_committed_point the point declares the divergence in pending_items with an owner and its status is RE-DERIVED rather than left standing: 'a committed point that gains scope and keeps its status is a claim nobody produced.' THIS IS A CONTRIBUTION TO ONE RE-DERIVATION, NOT A SECOND ONE. LEX-24 and LEX-27 are adding six lanes (LP-26.16 - LP-26.21) and six steps to the same point in the same release and that workstream is producing the overall status re-derivation; issuing a competing status here would put two answers on one point, which is the duplication the standard exists to prevent. WHAT LEX-29 CONTRIBUTES TO IT, STATED SO IT CAN BE FOLDED IN WITHOUT RE-READING THIS FILE. (1) TWO MORE OPEN LANES on a point whose parallel_group reads 'nothing outstanding on the build side' and whose sequencing_rationale reads 'COMPLETE on the build side' - both sentences are false with E7 and E8 present, independently of the six. (2) ONE COMMITTED LANE TOUCHED WITHOUT BEING EDITED: LP-26.3, whose export surface is REUSED as the generator's registry and ledger input rather than a second reader being opened; its owner confirms the export carries what the document needs, and if it does not, extending it is the answer and a second reader is not. (3) ONE CONTRACT-CLASS PROPOSAL held and not applied - the Art. 13 per-skill documentation payload on intelligence.registered_definition, which the lanes deliberately do NOT need, since LP-22's existing skill.manifest.json satisfies the contract; no intelligence.* object is created and ddl_body is not modified. (4) ONE ITEM CLAUSE NOT LANDED: the SR 11-7 correction to LP-26.background, held because re-targeting it leans on the undefined DD-63, with the owner named. A re-derivation that counts eight open lanes and misses the held citation would report the point as merely busier, when the point also carries a known-false sentence nobody is yet allowed to fix. NOTHING SHIPPED IS AMENDED: no committed lane's scope or tests_must_cover is edited by this item, because the record of what was built is not amendable by what was added. THE STATUS LEX-29 WOULD SUPPORT, offered as input to the owner rather than as a decision: in_progress - the same value LEX-24/LEX-27's re-derivation reaches, which is why one re-derivation suffices.", "v1.33.0 LEX-26 RESIDUE, AND IT IS NOT THIS POINT'S: ONE ITEM, SMALL, AND IT IS NOT LP-26'S. THE SERVING FINGERPRINT — LEX-26.changes[3]: 'the resolved serving stack is stamped into the same record — model digest, quantisation, engine and version'. Verified absent at v1.32.0: serving_fingerprint 0 · model_digest 0 · engine_version 0 · model_ref 0 · model_version 0 · resolved_model 0. What DOES exist is a POINTER, not a pin: intelligence.agent_run.model_id references intelligence.model_registry ('model actually used'), model_registry.params already holds quantization and the adapter path, and LP-39 (committed) added trained_on_dataset_id / _version so the corpus lineage is answered. The gap is therefore narrow and exact: the run points at a registry ROW that can change after the run, so 'seeded' is recorded honestly against a serving stack nobody pinned. WHERE IT BELONGS: as additive nullable columns set at INSERT on LP-06.1 — 'the SOLE owner of every statement against intelligence.agent_run and intelligence.agent_run_step. No other point authors SQL against those tables.' It is CONTRACT-class and would be an owner-approval proposal; it is NOT raised as an LP-26 lane and is NOT authored in this pass. THE OTHER TWO RESIDUES THE PRIOR PASS NAMED RESOLVE TO NOTHING NEW. The export-pack provenance member is LEX-24's artefact and is carried by LP-26.16, which RECORDS the value and never computes it — and records it ABSENT where LP-06.2 has not written it, because a pack that fabricates provider_default is exactly the misstatement this item exists to prevent. The rendering beside chainVerified follows the columns: rendering a field that does not exist is not buildable, so it belongs with the serving fingerprint at LP-06 and not here. ON THE RULE ITSELF: NOTHING REMAINS. Authoring any lane for it would create a second owner of a rule LP-06.2 states in full, which is the failure no_second_implementation exists to prevent.", "v1.33.0 LEX-25 CONTRIBUTION TO THE REOPENING, AND IT IS A CONTRIBUTION RATHER THAN A SECOND RE-DERIVATION. LP-26 was already re-derived `committed` -> `in_progress` in this release (pending_items[21]) and LEX-29 filed its own contribution to that one entry (pending_items[22]) rather than issuing a competing status; this entry does the same, and the status LEX-25 would support is the value already reached: in_progress. WHAT LEX-25 ADDS TO THE DIVERGENCE, stated so it can be folded in without re-reading this file. (1) FOUR MORE OPEN LANES — LP-26.24 (SQL), LP-26.25 (JAVA), LP-26.26 (REGO), LP-26.27 (TEST) — and four manifest_of_steps entries (E9 … E12), taking the point to twelve open lanes beside its fifteen committed ones. sequencing_rationale's 'COMPLETE on the build side' and parallel_group's 'nothing outstanding on the build side' are false independently of the other eight, and the correction belongs in the single re-derivation. (2) THE REOPENING COST IS LARGELY ALREADY PAID AND IS NOT RE-ARGUED HERE: adoption_standard.reopening_a_committed_point requires a divergence declared with an owner and a re-derived status, and both exist as of pending_items[21]. This item inherits that declaration; it does not open a second one. (3) THE OWNER IS THE SAME OWNER: LP-26's own claimed_by, 'LexIntl LP-26 (D0 -> R5)', jointly with the SME who approves CONTRACT-class proposals — all four lanes are held as proposals and none is applied. (4) ONE INSTRUCTION ALREADY IN THIS POINT'S TEXT IS DISCHARGED, WHICH IS THE ONE THING THIS ENTRY CLOSES RATHER THAN OPENS: fixed_contracts[13] says the issued-pack registry 'is LEX-25's and must land in ONE migration' and LP-26.17's scope repeats that it 'is deliberately not authored here'. It is now authored, once, at LP-26.24. (5) THREE COMMITTED LANES ARE TOUCHED WITHOUT BEING EDITED — LP-26.9, LP-26.10 and LP-26.12 — each with its own entry below naming the re-run it owes. NOTHING SHIPPED IS AMENDED: no committed lane's scope or tests_must_cover is edited by this item, because the record of what was built is not amendable by what was added. (6) THE A1 DERIVATION MEETS FOUR MORE LANES OF NEW FILES: pending_items[12] already tells the LP-26.15 owner that six lanes of created files send lp26_audit_full.py red until each is named by its own lane's gate; these four extend that same fire and are not a separate finding.", "TO THE LP-26.9 OWNER — verify_chain_coverage() RETURNS A DIFFERENT ANSWER THE DAY THE MIGRATION APPLIES, AND IT IS SUPPOSED TO. That function 'asks the catalogue which chained tables the verifier cannot see', so two newly fenced tables enter its answer by construction, and LP-26.9.tests[1] — 'the verifier reports any chained table missing from its own coverage view' — goes RED between the moment the tables exist and the moment they are covered. RED ON ARRIVAL IS THE GATE WORKING and is recorded here so it is not read as a regression on the day it fires; the precedent for landing something red on arrival is validation_gates.status_coherence's own argument. THE RE-RUN OWED: LP-26.9's 48 asserts and 35/35 mutants are re-run with both tables present and must still all pass. ITS SCOPE AND ITS TEST TEXT ARE NOT EDITED by this item. ONE THING THIS ITEM CANNOT ASSERT FROM THE MANIFEST: LEX-25's change text names inclusion in `evidence_chain_rows`, a view name with ZERO occurrences in this manifest at v1.33.0, so LP-26.24 states the REQUIREMENT (both tables are reported COVERED, not merely visible) and does not assert the object's name. The owner supplies it.", "TO THE LP-26.10 OWNER — THE PURGE MUST REMOVE THE NEW ROWS WITH THE DAY, OR THEY ORPHAN PAST RETENTION, exactly as agent_run_event's would have without its day deletion. LP-26.10 identifies fenced tables STRUCTURALLY ('a BEFORE trigger on both UPDATE and DELETE, never by matching names'), so the two tables are FOUND by construction — but being found is not being deleted, and the day sweep is what has to reach them. THE RE-RUN OWED: LP-26.10's 18 asserts, and the script run END TO END including a real purge leaving a PURGED tombstone, with both tables present. ITS SCOPE AND ITS TEST TEXT ARE NOT EDITED. A NOTE THE OWNER SHOULD HAVE IN FRONT OF THEM: this is a retention control on a table whose rejected_alternative was refused precisely because an application log 'would survive a lawful erasure' — a read log the purge misses is that same failure with our name on it.", "TO THE LP-26.12 OWNER — THE VALIDATOR IS THE SECOND THING TO ENTER YOUR PACKAGE THIS RELEASE, AND IT IS ONE RE-RUN, NOT TWO. LP-26.18 already owes a re-run of the 312 Rego tests, 29 mutants and 2304 differential cases agreeing on decision AND reason for AUDIT-007; LP-26.26's obligation-discharge validator owes the identical re-run. Asking for it twice would be a number held twice in the governance rather than in the code. SIGN ONE RE-RUN COVERING BOTH, with the seventh rule and the validator present together. WHAT THE VALIDATOR IS NOT: it decides nothing about a requester and adds no rule to AUDIT-001…007, which is why LEX-25 declares GATE and not POLICY — the package does not acquire a second POLICY declaration in one release.", "OPEN AND NOT SETTLED BY LEX-25 — WHETHER A DENIED EVIDENCE READ IS RECORDED, AND BY WHOM. The obligation to record rides on the ALLOW and structurally cannot ride on the denial (LP-26.12: 'an allow carries its OBLIGATIONS, and a denial structurally cannot'), so a denial row has no obligation compelling anyone to write it. evidence_read_event's decision column therefore records WHICH ALLOW authorised a read that happened; it is NOT a denial store, and this item does not make it one, because inventing a second recorder for refusals beside LP-26.2's built denial path would be a second owner of one fact. THE QUESTION THE OWNER STILL HAS TO ANSWER: an insider-risk review asks about refused attempts as well as successful ones, and today nothing on this surface answers it. Named as an open item rather than closed by defaulting a column. A SECOND, SMALLER ONE IN THE SAME PLACE: the door taxonomy is LP-26.13's forward / reverse / dedicated, two of which are unbuilt and asserted so; whether LP-26.17's hand-back is a FOURTH door value or an op recorded beside the door cannot be read from the manifest and is the owner's call, not this item's.", "v1.34.0 LEX-25 CONTRIBUTION TO THE STANDING REOPENING RECORD: THE REOPENING COST IS LARGELY PAID AND IS NOT RE-ARGUED. adoption_standard.reopening_a_committed_point requires a divergence declared in pending_items with an owner and a status re-derived rather than left standing — 'a committed point that gains scope and keeps its status is a claim nobody produced'. LP-26 already did both in this release: pending_items[21] re-derives committed -> in_progress, names the owner as LP-26's own claimed_by jointly with the SME who approves CONTRACT-class proposals, and names three sub-owners for the three committed lanes touched. LEX-29 then filed a CONTRIBUTION to that one entry (pending_items[22]) instead of issuing a competing status. LEX-25 does the same. WHAT THIS ITEM CONTRIBUTES: four more open lanes (LP-26.24 SQL, LP-26.25 JAVA, LP-26.26 REGO, LP-26.27 TEST) and four more steps (E9…E12), taking the point to twelve open lanes beside fifteen committed ones and making sequencing_rationale's 'COMPLETE on the build side' and parallel_group's 'nothing outstanding on the build side' false a third time over, independently of the other eight lanes. THREE COMMITTED LANES TOUCHED WITHOUT BEING EDITED — LP-26.9, LP-26.10, LP-26.12 — each with its re-run named and an owner to sign it, and the LP-26.12 re-run merged with the one LP-26.18 already owes. ONE INSTRUCTION IN THE POINT'S OWN TEXT IS DISCHARGED RATHER THAN OPENED: fixed_contracts[13]'s 'the issued-pack registry is LEX-25's and must land in ONE migration' now has its author, and LP-26.17's 'deliberately not authored here' now has its counterpart. THE STATUS THIS ITEM WOULD SUPPORT, offered as input rather than as a decision: in_progress — the same value the existing re-derivation reached, which is why one re-derivation still suffices. THE DECLARED DISAGREEMENT IS INHERITED, NOT WORSENED: the viewer's eff(p) emits only committed / ready / blocked and will derive `ready` against a stored `in_progress`, which validation_gates.status_coherence fails on; that is pending_items[21]'s open item with its owner, and four more `ready` lanes change nothing about it in either direction.", "v1.34.0 LEX-25 CONSEQUENCES FOR BUILT WORK, DECLARED NOT DISCOVERED: THREE BUILT THINGS CHANGE WHAT THEY RETURN, AND NONE OF THEM IS EDITED. No committed lane's scope or tests_must_cover is amended by this item — the record of what was built is not amendable by what was added — so each consequence is DECLARED with the re-run it obliges and an owner to sign it. (1) verify_chain_coverage() (LP-26.9, committed: 48 asserts, 35/35 mutants). The function 'asks the catalogue which chained tables the verifier cannot see', so two newly fenced tables enter its answer BY CONSTRUCTION the moment the migration applies. Between the tables existing and the coverage entry landing, LP-26.9.tests[1] — 'the verifier reports any chained table missing from its own coverage view' — goes RED. THAT IS THE GATE WORKING and it is recorded so it is not read as a regression on the day it fires; validation_gates.status_coherence is the precedent for landing something red on arrival. RE-RUN OWED: all 48 asserts and 35/35 mutants with both tables present. ONE THING NOT ASSERTED: LEX-25 names `evidence_chain_rows` as the inclusion point and that token has
