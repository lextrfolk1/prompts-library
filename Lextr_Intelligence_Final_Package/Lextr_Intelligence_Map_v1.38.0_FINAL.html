reported as killed - which makes a correct change harder than no gate at all. TWO MUTANTS, AND THE SECOND IS THE ONE A CONSTANT-PINNING GATE CANNOT PRODUCE: change the settings bound alone and the check goes RED; change all six readings together and it stays GREEN. A SEPARATE ASSERTION, DIFFERENT IN KIND: pgvector's HNSW index refuses more than 2000 dimensions, so a width every artefact agrees on can still be unbuildable. The engine limit is a BOUND ON THE AGREED VALUE, asserted separately, with its own mutant (declare 2049 -> red). IT IS WRITTEN DOWN HERE BECAUSE IT IS WRITTEN DOWN NOWHERE: '2000' has ZERO occurrences in this manifest while `hnsw` has ten, so the index is specified and the ceiling that constrains it is not, and the first proposal for a 4096-dim model meets no objection until CREATE INDEX fails. THE ROUTE TO A DIFFERENT VALUE IS STATED WHERE THE CONSTANT IS, and in this estate it already is: the baseline comment reads 'Divergent-dim tenants get a sibling table embedding_store_<dim> (later migration)'. No Part-M delta is proposed on the embedded DDL - ddl_ownership makes that an owner proposal - and a NEW migration carries its own comment. THE CHECK CONSTRAINT STAYS: the source estate omits it, and it is the only half that survives a writer outside the service.", "APPLIED MIGRATION HISTORY IS NEVER EDITED, AND THE RUNNER HALTS RATHER THAN WARNS. A migration that any environment has applied is immutable. A needed change is a NEW file; where an edit has already happened the reconciliation file states IN ITS OWN HEADER that it is one-time and not a template. The deployment tool keeps a ledger of (filename, content_hash, applied_at, applied_by) WRITTEN AT APPLY TIME and STOPS the deployment when an already-applied file's content differs from its recorded hash. Halt - not warn, not skip, not re-apply. WHAT THE VIOLATION LOOKS LIKE, because it looks like nothing: two environments both report 'migrated' and are running different schemas, and no artefact records which is which. The divergence is a function of WHEN each database last migrated, which nothing writes down, and it surfaces on the NEXT migration rather than the edited one - so the symptom is a plausible figure from one environment and a different plausible figure from its sibling, with no error in either. THIS IS NOT db_conventions[4] AND NOT validation_gates.manifest_integrity, and the difference is the point of stating it. [4] governs AUTHORSHIP: a Part-M delta on the embedded baseline is an owner-approval proposal, never silently applied. It decides who may change a schema and by what route and says nothing about a file that has already run - so it binds an APPROVED edit not at all, while this clause binds an approved edit exactly as hard as an unapproved one. Owner approval is a licence to write a NEW migration, never to edit an applied one. manifest_integrity refuses a recorded hash ON PRINCIPLE and RE-RUNS the generator, because the manifest is DERIVABLE and 'I only changed one point' must be a proof rather than a claim. A migration is not derivable: its effect lives in a database and there is no generator to re-run, so a recorded hash is the only evidence available. WHAT MAKES IT ACCEPTABLE HERE IS WHO WRITES IT - the runner writes the row as a side effect of applying, under its own credentials, so nobody maintains it and nobody can bring it into line by hand. LP-26 records the opposite case as a known limit ('a checksum manifest would go stale silently'); that manifest was hand-maintained, and staleness is precisely the condition this ledger REPORTS. THE LEDGER IS NOT NEW MACHINERY AND MUST NOT BE BUILT TWICE: the DDL is Flyway-owned, `flyway_schema_history` already carries a checksum per applied migration, and what this clause adds is the DISCIPLINE around it - `validate` runs against an ALREADY-MIGRATED environment, not only the clean one, and `repair` is prohibited on a changed migration because repair rewrites the recorded checksum to match the edited file and converts the halt into a silent pass. LP-01.manifest_of_steps already runs `flyway validate`, on a CLEAN PG16 - the single run in which a changed applied file cannot be detected - and migrate_check.sh checks 'from empty' for the same reason. THE RUNNER ALSO REDACTS CREDENTIALS BEFORE PRINTING A DSN and probes for the required extension before starting, so a missing pgvector fails with an actionable message instead of half-applying. MUTANT: change one byte of a comment in an applied migration - the deploy halts and names the file, while every unit suite stays green.", "client_id. Confirmed by the SME, aligning Intelligence to Lextr Core and the Standards & OM source. The tenant lint is renamed with it and keeps its full force: client_id NOT NULL and indexed outside the allow-list, INSIDE every unique constraint and composite foreign key, never in a route signature, path segment or query string. A lint naming a column that no longer exists passes by finding nothing. AND THE NAME IS ADOPTED, NOT THE BEHAVIOUR: every earlier reference to client_id in this manifest is a RECORDED DEFECT of the source estate - a caller-asserted default of 1 reaching a live WHERE clause. Sharing the term does not share the defect, and the lint above is what keeps that true."], "reg": {"asked": "Confirmation that adopted items are compliant with EU AI Act, NIST, 'SR 26-7' and BCBS 239.", "sr_26_7_does_not_exist": "'SR 26-7' occurs ZERO times in this manifest. The estate cites SR 26-2 (3 occurrences) and SR 11-7 (2), all of them on LP-26 and in two changelogs. SR 26-7 is a transposition of SR 26-2.", "and_sr_26_2_is_out_of_scope_by_the_estate_s_own_decision": "changelog_v1_18_0 records DD-63: 'SR 26-2 puts generative and agentic AI OUT OF SCOPE, making the EU AI Act the binding regime.' An SR-26 compliance claim for an agentic surface would assert conformance with a regime this estate has already decided does not bind it.", "dd_63_is_itself_undefined": "DD-63 survives only as that one changelog sentence; it is one of twelve decision ids cited and defined nowhere. The estate's binding regulatory decision is a citation with no definition behind it. DEFINE DD-63 before any item leans on it.", "lp_26_still_cites_the_superseded_regime": "LP-26.background reads 'SR 11-7 effective challenge' while changelog_v1_19_1 records that the CATALOG was corrected for exactly this and the manifest was not.", "footprint": "The entire regulatory footprint of the programme is one paragraph on one point: EU AI Act x3, SR 26-2 x3, SR 11-7 x2, BCBS 239 x1, NIST x1 (the other matches are the substring in 'deterministic'). Forty-six of forty-seven points cite no regime. A control-mapping claim across the estate has nothing to attach to until that changes.", "what_is_claimable": "Not 'compliant' - controls are compliant when they run and are evidenced, which a manifest cannot assert. What IS claimable and now enforced by adoption_standard: every adopted item declares its control mapping against a named article or clause, states whether it SUPPORTS the control or is merely RELATED to its subject, or declares itself UNMAPPED. One of the forty is honestly unmapped (LEX-30).", "control_register": "The per-item mapping is held outside the manifest at claude/V26_AUDIT/ as CONTROLS.json pending owner review, not asserted here."}, "marks": [{"id": "LP-04", "kind": "confidence", "txt": "CONFIDENCE-SIGNAL"}, {"id": "LP-04", "kind": "completeness", "txt": "tool_scope covers every adapter op each registered use case declares, or the build fails (LP-34 completeness gate)"}, {"id": "LP-07", "kind": "confidence", "txt": "-finalizes. reviewQueue.enqueue (completed->in_review + review_level) is a separate transaction from persist (the sweep covers a crash between them). Confidence is a SIGNAL, never a gate"}, {"id": "LP-09", "kind": "confidence", "txt": "RunResult carries resolved facts only: no narrative, no DriverFinding and no confidence value is populated by this skill"}, {"id": "LP-14", "kind": "completeness", "txt": "HAND-LISTED', so an op this point declares enters that generated list automatically and an op declared with no entry FAILS THE BUILD through LP-34's completeness gate. LP-14.3 is ALREADY RED BY DESIGN under TEST[1], because LP-16 is committed and built while its walk_calc_chain has no policy registration anywhere in the estate - so a new declared op would not"}, {"id": "LP-15", "kind": "confidence", "txt": "EvidenceLedgerViewer, RunProgress). Masking is held to the tooltip (figures render only via MaskedValue from backend display; the UI cannot unmask); confidence is a signal chip; always-on review is honest (completed->reviewing banner); tenant from useTenant, never in a URL."}, {"id": "LP-18", "kind": "confidence", "txt": "esidual% on model-safe amounts only; recon->cell via the report's own calc-chain, so the horizontal skill needs no kg_ready). Each adds a signal-only confidence nudge (clamped) and NO driver."}, {"id": "LP-21", "kind": "confidence", "txt": "confidence rendered as a signal chip, never a gate"}, {"id": "LP-22", "kind": "confidence", "txt": "CONFIDENCE-SIGNAL"}, {"id": "LP-22", "kind": "completeness", "txt": "u2192tool_scope binding formalized by DETECTION (declare-then-probe + the LP-34 CI completeness gate), never by generating policy. Skill Registry surface: inventory grid"}, {"id": "LP-24", "kind": "confidence", "txt": "ty run both end with no candidates, and only the stored state tells them apart. WEAK MATCHES ARE SHOWN, never hidden: a weak answer is not no answer. CONFIDENCE IS A SIGNAL; what blocks handover is an UNRESOLVED OPERAND"}, {"id": "LP-25", "kind": "confidence", "txt": "ConformanceResult has NO confidence field"}, {"id": "LP-25", "kind": "completeness", "txt": "in the settled design references it. LP-22 IS a real dependency: UC11 must ship a skill.manifest.json, register through the two writers, and pass the completeness gate that probes per declared op. Net effect: UC11 is buildable now rather than behind two unbuilt roadmap points."}, {"id": "LP-26", "kind": "completeness", "txt": "ctually submitted, which this surface never witnesses; it says nothing about whether THIS output was approved. LP-26's caveats are about the LEDGER's completeness"}, {"id": "LP-34", "kind": "completeness", "txt": "Test coverage + completeness gate"}, {"id": "LP-37", "kind": "completeness", "txt": "Material-pass completeness == edge-operator coverage on the delivered graph (92/4,056 arithmetic today); operator-absent reach is honest structural_only"}, {"id": "LP-39", "kind": "accuracy", "txt": "health is anchor freshness and never an accuracy; the correction rate is a monitor and gates nothing (is_gate rides the wire as constant false)"}, {"id": "LP-41", "kind": "confidence", "txt": "D operand does NOT block the batch - operations are accepted individually, so refusing nine because the ninth needs a look withholds eight good ones; confidence is a SIGNAL and the unresolved operand is the GATE"}, {"id": "LP-45", "kind": "confidence", "txt": "an INSTANCE ask never triggers a run, at any confidence"}, {"id": "LP-49", "kind": "completeness", "txt": "sumes a chain LP-26 has already produced, which is a dependency the existing Wave 7 members do not have on each other. THE COST IS STATED: exec.waves.completeness asserts 'every point in exactly one wave; none orphaned or doubled (checked at generation)', so LANDING THIS POINT REQUIRES AN exec.waves ROW, and this pass is read-only on the manifest - the row is"}, {"id": "LP-49", "kind": "accuracy", "txt": "n the forty-item harvest. EU AI Act Art. 12(1) - SUPPORTS: record-keeping over the lifetime, which a rewritable record does not deliver. BCBS 239 P3 (accuracy and integrity) - SUPPORTS. NIST SP 800-53 AU-10 (non-repudiation) IS NOT CLAIMED HERE AND IS NOT SILENTLY DROPPED: it is the correct control for a detached signature and it is OUTSIDE the footprint L"}, {"id": "LP-50", "kind": "completeness", "txt": "in its own label, and a han leaving the work visible. LP-01.1 is unblocked to BEGIN; it cannot finish until the standard arrives. OWNER: Part-M standard owner."], "LP-02": ["OI-10 EvidenceLedgerViewer prop shape (settle 'trace' vs 'run' once at integration)", "v1.26.0 CARRIED IN FROM LP-20.4: the masking-safe atoms a withdrawn per-use-case renderer would have composed are this point's. A use-case point does not author atoms; it consumes them.", "FOCUS TRAPPING IS NOT ASSERTED AND THE INCONSISTENCY IS RECORDED RATHER THAN HIDDEN: while an open overlay's background is aria-hidden it remains TAB-REACHABLE, so a keyboard user can leave an overlay a screen-reader user cannot hear behind. The three adopted behaviours are what the source estate actually had; a trap is the expensive and easily-wrong part and a half-built trap is worse than none. OWNER: LP-02 owner.", "NO ACCESSIBILITY CONFORMANCE BAR EXISTS ANYWHERE IN THESE 49 POINTS - verified at v1.34.0: 'accessib' 0, 'wcag' 0, 'aria-' 0, 'Escape' 0, 'tabIndex' 0, 'screen reader' 0. THIS ADOPTION STATES THREE BEHAVIOURS AND NOT A BAR, deliberately: the item's own rejected_alternative declined a full conformance point because it has no lexie-ai input at all, and borrowing a bar here would be a claim nobody produced. A bar - and the 164 div-onClick handlers, the evidence grids that should be real tables, landmarks and skip links - is an owner decision and an open V26 item. OWNER: LP-02 owner, with the UI owner.", "DEC-LP-02-1 IS SETTLED 2026-09-14: SPECIFICATION, NOT RETROFIT. The owner ruled it, and the rebuild had already emptied the other answer - the running estate is being discarded, so nothing is built and there is no shipped component to retrofit an obligation onto. THE REASONING THAT POINTED THE SAME WAY BEFORE THE REBUILD IS KEPT, because it is the part that would matter if this were ever reopened: LP-40's audit describes tenant theming as already built, and never mentions MaskedValue, OutputRenderer, EvidenceLedgerViewer, RunProgress or
