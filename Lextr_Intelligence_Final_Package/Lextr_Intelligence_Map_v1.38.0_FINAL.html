"LEX-28 CONTRIBUTION TO THE STANDING REOPENING RECORD, AND IT IS A CONTRIBUTION RATHER THAN A SECOND RE-DERIVATION. pending_items[21] already re-derived this point committed -> in_progress, named the owner as LP-26's own claimed_by jointly with the SME who approves CONTRACT-class proposals, and named sub-owners for the committed lanes touched; LEX-29 (pending_items[22]) and LEX-25 (pending_items[29]) each filed a contribution to that ONE entry rather than issuing a competing status, and this item does the same. THE STATUS THIS ITEM WOULD SUPPORT, offered as input rather than as a decision: in_progress - the value already reached, which is why one re-derivation still suffices. WHAT IT CONTRIBUTES: FIVE more open lanes (LP-26.28 SQL, LP-26.29 JAVA, LP-26.30 JAVA, LP-26.31 REGO, LP-26.32 TEST) and five more steps (E13...E17), taking the point to seventeen open lanes beside fifteen committed ones and making sequencing_rationale's 'COMPLETE on the build side' and parallel_group's 'nothing outstanding on the build side' false a fourth time over, independently of the other twelve. ONE DIFFERENCE FROM THE THREE PRIOR CONTRIBUTIONS, STATED BECAUSE IT MATTERS TO THE OWNER'S SIGNATURE: those lanes were `ready`. ALL FIVE OF THESE ARE `blocked`, so this contribution does NOT extend the declared eff(p) disagreement in pending_items[21] and does not make the board more startable - it makes it larger.", "LEX-28 CONSEQUENCES FOR BUILT WORK, DECLARED NOT DISCOVERED: SIX BUILT OR AUTHORED THINGS CHANGE WHAT THEY RETURN AND NONE OF THEM IS EDITED. No committed lane's scope or tests_must_cover is amended - the record of what was built is not amendable by what was added - so each consequence is DECLARED with the re-run it obliges. (1) verify_chain_coverage() (LP-26.9, committed: 48 asserts, 35/35 mutants). A newly fenced intelligence.evidence_payload_erasure enters its answer BY CONSTRUCTION, and LP-26.9 TEST[1] goes RED between the table existing and the coverage entry landing. RED ON ARRIVAL IS THE GATE WORKING. RE-RUN OWED: all 48 asserts and 35/35 mutants with the table present - and it is the SAME re-run LP-26.24 already owes for its two tables, signed ONCE if the migrations are folded. (2) THE PURGE (LP-26.10, committed: 18 asserts, run end to end). The erasure rows must leave WITH the day or they orphan past retention, exactly as agent_run_event's would have; the lane's structural fence identification FINDS the table without a name list, but found is not deleted. RE-RUN OWED: 18 asserts plus the end-to-end run leaving a PURGED tombstone. (3) THE LIFECYCLE ENGINE (LP-26.4, committed: 46 asserts, 17/17 mutants). An erasure path is authored INTO it and its TEST[1] - 'a day is removed WHOLE, there is deliberately no row-level or range-level variant anywhere' - must still hold, because this item does not add one. RE-RUN OWED: 46 asserts and 17/17 mutants with the erasure path present. (4) THE INVOLVEMENT AND EXPORT CORE (LP-26.3, committed: 106 asserts, 72/72 mutants). It gains a returned availability state and the WITHHELD/ERASED/ABSENT marker; a second reader is NOT opened over the erasure table. RE-RUN OWED: 106 asserts and 72/72 mutants. (5) lextr.ai.evidence_lifecycle (LP-26.12). See the entry below - one re-run, not a third. (6) TOUCHED WITHOUT A RE-RUN OF ITS OWN, NAMED ANYWAY: LP-26.16's pack writer bumps its versioned format identifier for the new member kinds and LP-26.17's verifier takes the canonicalisation version as an INPUT read from the pack's own bytes - it still reads NO validity claim out of the pack, and LP-26.32 proves that rather than assuming it.", "TO THE LP-26.12 OWNER - THE THIRD THING TO ENTER YOUR PACKAGE FAMILY IN CONSECUTIVE RELEASES, AND IT IS STILL ONE RE-RUN. pending_items[27] already merged LP-26.18's AUDIT-007 re-run with LP-26.26's obligation-discharge validator re-run - 312 Rego tests, 29 mutants and 2304 differential cases agreeing on decision AND reason - into a single signature. LP-26.31's erasure-authority rule joins THAT SIGNATURE and does not ask for a third: a number held three times in the governance is the defect this point was built to prevent. NOTE, AS A LIMIT OF THE RECORD RATHER THAN A CLAIM: those figures are reported at LANE granularity and the manifest does not break them down between lextr.ai.audit_read and lextr.ai.evidence_lifecycle, so the re-run is owed and signed at lane granularity. AND A SECOND NOTE THE OWNER SHOULD HAVE IN FRONT OF THEM: unlike the other two, this rule cannot be authored at all until DEC-LP-26-1 is answered, so it may be signed LAST or the signature may be split - that is the owner's call and this item does not take it.", "DEC-LP-26-1 IS OPEN AND IT IS THIS ITEM'S REAL BLOCKER: THE ERASURE OBLIGATION HAS NO DECLARED REGIME. Its basis is GDPR Art. 17, which is cited nowhere in this manifest and is not among the regimes adoption_standard.regime_named_once recognises. Per unmapped_declares_itself the lanes DECLARE the gap and carry controls: ['UNMAPPED'] for the erasure obligation rather than borrowing an article - 'a stretched citation is worse than a blank one, because a blank one is read and a stretched one is believed'. LEX-40's deferred corpus-lifecycle half already declared UNMAPPED for its erasure half on identical grounds, so THE ESTATE MUST REACH ONE ANSWER TO 'ERASE ONE THING WITHOUT DESTROYING THE DAY' RATHER THAN TWO, and LEX-28 is decided in the SAME CONVERSATION as that deferred half rather than after it. UNTIL IT IS ANSWERED LP-26.31's authority vocabulary is EMPTY and every erasure is DENIED, which is the honest state and is proved by a test rather than left as a gap. OWNER: the manifest owner with legal/privacy counsel, who declares the regime, jointly with the LP-26 owner.", "ONE MIGRATION IF BOTH ARE APPROVED, AND THE INSTRUCTION WAS ALREADY WRITTEN. LP-26.24's adjustment records that 'LEX-28 SHARES THIS MIGRATION'S SHAPE AND IS NOT MERGED INTO IT ... IF LEX-28 IS TAKEN BEFORE LP-26.24 IS APPROVED, the two should be one migration - that is the owner's call at approval time and the lane is written so it can be folded rather than re-cut.' LEX-28 IS NOW TAKEN AND LP-26.24 IS NOT YET APPROVED, so the call is live. LP-26.28 is authored foldable: same fence, same GUC, same chain columns, same coverage requirement, no object created twice. FOLDING SAVES ONE CONTRACT-CLASS APPROVAL AGAINST THE FENCED LEDGER, ONE RE-RUN OF verify_chain_coverage() AND ONE RE-RUN OF THE PURGE. DECIDE IT AT APPROVAL TIME. OWNER: the SME who approves CONTRACT-class proposals, with the schema owner.", "THE CANONICALISATION IS THE ITEM'S CENTRAL RISK AND ITS PREMISE IS UNVERIFIED IN THIS MANIFEST - BOTH FACTS ARE RECORDED. LP-49.pending_items[9] and LP-50.pending_items[10] both assert that LEX-28 changes what the chained row CONTAINS, and LP-26.17's verifier, LP-26.19's shared corpus and LP-49.2's notary all re-derive that formula. WHETHER IT ACTUALLY CHANGES depends on whether intelligence.agent_run_step.input is a member of LP-26.1's trigger digest, which cannot be read from ddl_body, from LP-26.1's scope or from LP-26.fixed_contracts[1] - LP-06.2 says only that the in-database link 'hashes COLUMNS and not JSON'. LP-26.32 TEST[0] settles it BY DERIVATION and is the first thing done in this item, and LP-26.32 refuses a receipt taken while it is red, with LP-49.pending_items[9] named as the reason. IF `input` IS NOT A MEMBER the sequencing pressure on LP-49 largely evaporates and this should be known before anyone plans around it; IF IT IS, a version pinned per chain-day is what keeps a formula change a stated fact instead of a break index over an untampered ledger. OWNER: LP-26 owner, with the LP-49 owner.", "THE OBJECT STORE HAS NO OWNER AND IT IS THE SAME SEAM LP-49 RAISES. A content-addressed payload store is not in build_context.pinned_stack, which declares Docker, Kubernetes, Helm, on-prem and SaaS and names no object store at all - identical to LP-49.pending_items[0]'s WORM store and key custodian. RAISED AS ONE CONVERSATION AND ONE ASK, because two answers to 'where do bytes live outside the database and who owns them' is the duplication this manifest exists to prevent. The archive half is LP-06's and the ask is extended there; it is named here so it is not raised a third time. OWNER: the deployment / platform owner, jointly with whoever owns pinned_stack.", "OPEN AND NOT SETTLED BY LEX-28 - WHETHER A REFUSED ERASURE IS RECORDED, AND BY WHOM. LP-26.28 records erasures that HAPPENED, each naming the authority and the policy version that permitted it. A DENIED erasure request has no obligation compelling anyone to write it, for exactly the reason LP-26.12 states - 'an allow carries its OBLIGATIONS, and a denial structurally cannot' - and pending_items[28] already carries the identical open question for denied evidence READS. This item does not invent a second refusal recorder beside LP-26.2's built denial path, and it does not default a column to answer a question nobody has asked. THE TWO OPEN QUESTIONS ARE THE SAME QUESTION AND SHOULD BE CLOSED TOGETHER: an insider-risk review asks about refused attempts, and a refused ERASURE request is the one refusal a data subject may later dispute. OWNER: the LP-26 owner, with pending_items[28]."], "LP-27": ["genuinely unbuilt roadmap gap (autonomous actions, orchestration intelligence, closed-loop fine-tuning)"], "LP-28": ["genuinely unbuilt roadmap gap (continuous monitoring, multi-modal handling)"], "LP-32": ["ADOPTED FROM lexie-ai WITH PROVENANCE, and unlike the pattern this programme over-claimed at v1.28.0 this one SURVIVES CONTACT WITH THE WIRE: the write returns `applied` and `apply_error` as TYPED TOP-LEVEL FIELDS on the 200 (routes/variance_config_routers.py:312-316), not as a composed message, and its own comment states the principle - 'A failure here is not a failure of the change: the decision is stored and will apply on the next start. Saying so beats rolling back a governed record because a provider was briefly unreachable.' That is exactly home (2) of error_conventions.reason_ref, already built. It is taken.", "SECURITY, VERIFIED AND NOT YET TRIAGED - the runtime_config write surface has NO AUTHENTICATION. routes/variance_config_routers.py:58-64 reads X-User-Id and rejects only when it is absent or empty; the value is never checked against a token, session, directory or signature, so any client sending any value passes. Across routes/ there are ZERO occurrences of Depends(, Security(, HTTPBearer, OAuth2, APIKeyHeader, verify_token or jwt, and no role or permission check anywhere. This is the surface that sets the embedding model and the LLM provider. Sibling routers are weaker still, defaulting the actor to 'anonymous' (variance_routers.py:45) and 'demo-console' (variance_demo_data_routers.py:130). Same class as the caller-asserted client_id default already reported.", "PROSPECTIVE, NOT PRESENT - there is no OPA in lexie-ai. Zero .rego files and zero matches for opa, rego, open_policy, policy_decision or an OPA endpoint anywhere in the tree. Every Rego gate this point and AMD-RUN-04 rely on has still to be built, and the refusal today is a pure in-process membership test against a hard-coded dict (variance_config_routers.py:282), changeable only by redeployment. Stated so the 422 decision is not mistaken for a description of running code."], "LP-33": ["OPEN AND LARGER THAN THE JAVA HALF - LP-33 has no PY lane. Verified in lexie-ai: 115 raise HTTPException across 7 route modules choosing status inline, zero exception_handler registered, detail= a string in 100% of cases, 5 distinct response shapes one of which returns a tuple, 17 detail=str(e) sites with a confirmed SQL-and-bound-values leak path at routes/variance_config_routers.py:108-121, and ZERO occurrences of ApiResponse. The envelope this point governs has no implementation in that service at all.", "pending_items[0] IS NOW CARRIED BY LP-33.3 AND IS NO LONGER THE TRACKING RECORD. adoption_standard.a_step_is_not_a_unit_of_work is exact on this: a requirement with no sub-task carrying it is not adopted, and a pending sentence cannot be claimed, gated or shown to have failed. The sentence stays as the evidence behind the lane; the work is the lane.", "OWNER MISSING FOR THE lexie-ai ERROR SURFACE, AND IT IS THE SAME GAP LP-30 ALREADY HIT. LP-30.1 TEST[6] records its lexie-ai half as NOT RUN because 'the estate's verified leak ... is in a service this lane cannot reach'. LP-33.3 is authored against the same service and needs the same owner named. This is an owner question, not an authoring one, and the lane is not claimable until it is answered.", "DEC-LP-33-3 IS OPEN AND NOW DUE (made due by LP-49.2), AND IT DOES NOT BLOCK LP-33.3. It bears on the MAPPING ROWS - whether a review-transition violation, an idempotency conflict and a notarization control failure all stay 409 distinguished only by ErrorDetail.code - and LP-49.pending_items[6] requires the three codes to be declared TOGETHER AND NAMED AS THREE, so no one of them can be added alone. The handler, the typed exceptions, the ApiResponse/ErrorDetail mirror and the generator extension are all authorable and buildable without it; the contested rows generate as UNDECIDED and fail the build if defaulted. Recorded here so the decision is not read as a blocker on the lane, nor the lane as an answer to the decision.", "THE INTERIM IS RECORDED AS INTERIM. If LP-33.3 cannot be scheduled, removing the seventeen detail=str(e) sites and returning the fixed code INTERNAL_ERROR with the echoed correlation state closes the leak and leaves 115 inline statuses, five response shapes and no envelope in that service. That is the ADOPT_NARROWED option and it is a remediation, not a closure - nothing in it stops the next route choosing its own status and its own shape.", "v1.34.0 - THE ITEM STAYS CLOSED AND ITS RESIDUE IS NOW A LANE. meta.v32_do_not_adopt records LEX-33 as SUPERSEDED: it specifies 409 for a refused deployment-controlled write and DEC-LP-33-2 decided 422. LP-33.3 is NOT an adoption of LEX-33; it is the one thing that register says survives - 'ONLY the PY lane survives, and that is already LP-33.pending_items' - moved out of a pending sentence, which cannot be claimed or gated, and into a unit of work that can. The lane is written against error_conventions AS IT NOW STANDS and states 422, refusing change[1] by name."], "LP-34": ["v1.26.0 DEPRECATION CONSEQUENCE: LP-34.2 removed as circular. LP-34 now has ONE sub-task, and its scope is the shared 'orchestrate resolve -> /run -> persist' string, which is wrong for a coverage-and-completeness-gate point. Exposed, not caused, by this pass; it is an UPDATE-class rewrite."], "LP-36": ["OWNER-APPROVAL: new SL logic point(s) for the Intelligence-facing regulatory exposure + a published exposure_ready/graph_ready readiness datum (CONTRACT — SL/Core owner)", "SL object registration for element_definition / element_version / element_dependency is a precondition for the R1/R3/R4/R5 endpoints", "name a DRI for the C1/C9 exposure seam (the SL is Core-owned)", "pin recon to SL stable_v5 ↔ Intelligence stable_v1; re-run on each version bump on either side", "UC8 requirement spec substantially exists already (Semantic_Layer_Host_Contract_for_Intelligence.md + Element_Dependency_Reconciliation_Spec.md + Semantic_Layer_Chat_Prompt.md) — formalize it into the register first", "BLOCKING AND CREATED BY v1.31.0: this point now has ZERO sub-tasks. LP-36.1 was its only lane and was withdrawn as a wire-through that crossed no boundary - lang_tags is ['TEST'], so the point had no implementing lane even before the withdrawal, and its scope cited a /run + schema contract LP-36 does not have. adoption_standard.a_step_is_not_a_unit_of_work names this point BY NAME: 'five steps face one generic wire-through lane that implements none of them'. THE WORK NOW OWED: author lanes carrying manifest_of_steps[0]-[4]. Steps [2] and [3] are cross-product CONTRACT proposals needing the C1/C9 DRI, who is not named anywhere in this manifest; step [4] is a manifest gate in the shape of validation_gates.manifest_integrity, not a wire-through. A point with no lane emits no prompt and cannot be assigned - it is now visibly empty rather than invisibly generic, which is the whole of the improvement."], "LP-37": ["STATUS CORRECTED at v8: the point read 'blocked' while its own background said (BUILT) and the catalog listed it BUILT. Verified against the code before changing — UC2 Impact: 6 skill modules · adapter/impact_ops.py · intelligence-ui slice · tests green. The build had landed; only the point status was never moved.", "Core cross-report edges (walk_component / element_dependency CROSS_REFERENCE) — gating; flip cross_report_ready", "Core DAG-engine wire behind impact.evaluate_edit_checks — flip evaluate_ready (host becomes authoritative, zero code change)", "edge-operator coverage growth; A1 projections S1-S4; host @/contracts impact delta; H1 BHCK2314 absent from the delivered extract", "H3 edit-check op naming unification at UC11; Neo4j GPL-3 decision; deltaModelSafe precision convention at merge; element_dependency reconciliation incl. OPERATOR SEMANTICS", "(A2, nice-to-have — flagged, NOT built) optional dense/compact prop on ImpactAnswer for the INLINE Lexie-panel mount; the renderer works in both mounts as-is", "v1.31.3: `layer` was ABSENT on this point - the only one of 47 - so workPrompt's first two lines printed 'layer=undefined' to every developer building any of its five lanes. Set to product_specific, which all five sub-tasks already carry. Found by validation_gates.generated_prompt_review reading generated output; validateManifest checked a SUB-TASK's layer and never a POINT's, which is why 30 releases of field checks missed it."], "LP-38": ["STATUS CORRECTED at v8: the point read 'blocked' while its own background said (BUILT) and the catalog listed it BUILT. Verified against the code before changing — UC3 Trend: 4 skill modules · adapter/trend_ops.py · intelligence-ui slice · tests green. The build had landed; only the point status was never moved.", "#29 (gating OPS): confirm the gateway series endpoint -> flip data.lextr.ai.trend.series_ready + the preset series_ready declaration (zero code change)", "#30 (host SEAM): masked multi-period series shape under relative_change (feed upgrade lengthens the model-safe suffix)", "#31 (SME): turning_point vocabulary — closed set stays 3; extension lands in ONE place (the shared classifier)", "#33 (follow-up): DatasetTable/RouteOutNotice + shared dataset types promotion to a common home; variance-internal import rewrite to skills/shared", "host @/contracts delta is UC8-shared (dataset + routeOut); nothing further for UC3; mvn test + opa test composed at merge; Y-14Q-H bounds retune = SME"], "LP-39": ["🔴 BLOCKING (inherited, not introduced): X-User-Functions is not emitted by the gateway, so every function set parses empty and EVERY independence-required approval refuses. Correct fail-closed behaviour — and it blocks TDM's happy path end to end: no dataset can be approved, so no run can be initiated.", "GAP: TrainingRunPoller does not exist. lexie-ai holds no outbound client to intelligence-service anywhere, so the executor polls rather than calls back — but something must poll, or a run never leaves `training`. Mirror the stranded-run sweep; a 404 from the executor means a restart lost the job and must surface as a FAILED run to re-initiate.", "GAP: the three authoring wizards (Create Dataset · Add Sample · Bulk Import) are not built — they need the shell's WorkTabBar/DraftShell primitives. The five reading and governing surfaces are complete.", "GAP: the Java half of the shared schema-parity fixtures (schema_parity_cases.json is consumed by the Python suite only) — ~30 lines, and it should land before either validator is next touched.", "SEAM: Trainer is a port; NullTrainer refuses honestly rather than returning an adapter path pointing at nothing. A real QLoRA/PEFT loop needs the client's GPU, base weights and CUDA stack.", "SEAM: Scorer defaults to exact-match, deliberately strict and dumb — the floor a deployment replaces, not a proxy for quality.", "OWNER-APPROVAL: OPA-TDM-006 (contamination) and OPA-TDM-007 (training env) — both extend the estate's original 'closed set of five' policy packages. Built, tested, green; they need a sign-off, not engineering.", "OWNER-APPROVAL: training_env_ready as the 11th REQUIRED_CAPABILITY datum (the one prior file LP-39 modifies).", "OWNER-APPROVAL: LP-39's FKs point at intelligence.registered_definition, which is still unapplied and still pending approval — LP-39 RIDES AN UNAPPROVED CONTRACT. Flagged, not hidden.", "OI-LP39-1: the reused mrm_sod deny strings say 'definition', so refusing a dataset attestation reads 'definition is not pending approval' to a curator looking at a dataset. Generalising to 'subject' is a non-additive change to a character-locked contract string; raised, not applied.", "OI-LP39-2: OPA-TDM-002 names MNPI, but RingFenceInput has no mnpi component — the rule is complete AHEAD of its plumbing. Adding the field is an additive change.", "OPS: load training_data.json as an OPA data document; provision the GPU; flip training_env_ready.", "Part-M: register the four new tables in meta.* (the meta schema is not in this slice; its shape was not invented).", "CORRECTION (Aug 2026, verified against the estate): the shipped content schema variance.horizontal_sample describes a corpus that has never existed. The one real corpus is ~4,750 train / ~250 eval REFERENCE Q&A pairs produced by generate_qlora_training_data.py. Consequence: TDM's first governed schema should be authored against a corpus that exists, and the platform must accept schemas it has never seen — see the corpus-agnostic projection design (schema-declared training projection + per-schema vocabularies + an unanticipated-schema conformance test).", "TDM is INCOMPLETE against its own intent, audited Aug 2026: (a) no prior use case emits a training sample — exactly one file outside /training/ references the package and it is ContentSchemaSource; (b) no routing selects an adapter by task × report_type, so a registered adapter would never be picked up; (c) one content schema ships, and none for UC3/UC8/UC12; (d) no evaluation dataset exists for any use case, so training_run can never legally reach 'registered'; (e) the Trainer port is unfilled, the system prompt is unpinned, and the evaluator's model call is unwired. TDM's real reach among BUILT use cases is UC1a, UC3, UC8, UC12 — UC1b and UC2 call no model and gain nothing."], "LP-40": ["OPEN — is logical_long_nm localized in the Semantic Layer? The SL owner's call, and it decides whether attribute pickers are translatable at all.", "OPEN — which locales ship first? Reason-code renderings are per-locale work, so the list sizes the point.", "NOTE — the Core → Semantic → Intelligence integration manifest, to be run once Intelligence is complete, must verify locale END TO END: captured in Core, carried through the Semantic Layer, honoured by Intelligence, echoed in evidence.", "SCOPE CORRECTED at LexIntl 12. UC10's D4 README claimed the LexiAI floater's non-English ask made LP-40 demo-blocking for Intelligence. It does not: CORE hosts that surface and renders its own chrome against its own i18n. What Intelligence owns is COMPONENT COPY, which is a smaller and real obligation. UC10 D5/D6 discharged half of it — every user-visible string in features/analytical-assist is externalized in i18n/strings.ts with interpolations as FUNCTIONS so a translator owns word order, and a validator asserts no component names a string. The remaining ask is precise and small: a LOCALE ON THE RUN CONTRACT. strings(locale) is already written and falls back rather than throwing.", "WAVE ASSIGNMENT ADDED at LexIntl 12. LP-40 existed as a point but appeared in NO wave — so every wave-driven view of the plan silently omitted it, and a reader working from the waves would not have known localization was on the plan at all. Pre-existing gap, found by the v10 manifest<->estate reconciliation check rather than by reading. Placed in Wave 8 (Global Standards · cross-cutting), which is where product_estate already describes it: 'Localization readiness is LP-40 (Wave 8, global standard)'.", "RESOLVED AT v1.28.0 - where a code rides on the wire. DEC-LP-33-1 gives it ErrorDetail in `data` on an error and a ReasonRef field in the payload on a 2xx. This point constrained the SHAPE of a code and never its LOCATION, and the location was the thing eleven amendments were blocked on."], "LP-41": ["Core: does the builder surface report_id + version to the embedded panel at save? (Step 0 — UI-level, not a backend contract)", "endpoint bindings for the three new ops — raised to LP-13", "surface_id on the run: additive, closed CHECK, never branched on — recommended", "build_handoff PAYLOAD SHAPE BUILT (handoff.py) — operation batch, idempotent by construction, version-anchored. definition.handoff_payload left untouched: it is still correct for a one-shot proposal, and prior files are not rewritten because a newer surface exists.", "G3 BUILT — AnalyticalRunCoordinator.applyBatch(), a SEPARATE entry point from run(). The two are different acts: run() means the analyst ASKED and nothing in Core moved; applyBatch() means they ACCEPTED and Core's definition moved, with no discovery and no catalog searched. Recording an applied batch through run()'s Outcome would leave catalogState, routeOutUc and matchCount carrying values never computed. A STALE batch is recorded with stale=true and nothing applied — a discarded proposal is a different fact from no proposal. Rejections are counted separately from omissions, because a rejection is a signal and an omission is not.", "G1 PARTS 3–4 OUTSTANDING — the operation-batch surface (per-op accept/reject, against_version, stale) and the derived-attribute surface (ƒ(x) marking, banding candidates with provenance, expression shown). The CONTRACT for both is in place (OperationBatchDto, DerivedAttributeDto, BandingCandidateDto); the components are not. NOTE: period-as-PROMPT has no v23 prototype to port from — it must be designed, not synced.", "PERIOD PROMPT BUILT in the simulation (SME, Aug 2026): default = current open period; multiple open periods are normal (Q3-2026 original filing alongside Q2-2026 open for amendment) so the others are named; prior/closed periods remain selectable for restatements and look-backs. Rendered APART from Filters, because changing a filter makes a different report and changing a prompt is running the same report again. SYNCED to v23 (one-way, period concept only). NOT yet in the real slice.", "LP-41.2's OP COUNT RISES FROM THREE TO FIVE. The two Semantic Layer resolve operations (approved-objects and by-object-code) are adapter ops and belong in the UC10 allow-list LP-41.2 already owns, each default-deny and each naming its readiness datum - which is exposure_ready, published by the Semantic Layer per LP-36. LP-41.2 is `proposed` and unstarted, so this is an extension of an unbuilt lane and not a rewrite of a shipped one. OWNER: LP-41.2's. LEX-35 does not author a second REGO lane; a second lane gating the same package would be the second authority anti_dup exists to prevent.", "ASK TO THE SEMANTIC LAYER, THROUGH LP-36: the resolve response must DISTINGUISH 'no logical name exists for this code' from 'this code was not answered for'. Without the distinction on the wire an authoritative empty answer and an exception handler's empty map are the same value, which is precisely how the source estate's outage rendered as a success. Until it exists the seam treats silence as INDETERMINATE and marks the element, which is fail-closed and costs a marked element rather than a disclosed column name. Raised as a proposal, not redefined locally (layer_governance.shared).", "ENDPOINT BINDINGS FOR THE TWO RESOLVE OPS ARE RAISED TO LP-13, which meta.changelog_v1_26_0 records as having NO implementation lane - the same gap LP-41's existing pending item records for the three new ops. Named here so the count is right when someone finally lands that registry, not because this item improves the gap.", "DD-48 IS NARROWED-AROUND, NOT AMENDED, AND LP-24 IS NOT REOPENED. LEX-35's text as harvested says resolution failure 'NEVER falls through to the physical identifier' where the layer 'is unreachable OR RETURNS NO MAPPING' - and the second half is DD-48's own case, decided on a COMMITTED point. Rather than overturn a settled decision from a lane, the failure rule is scoped to the outage and indeterminate cases and DD-48 keeps the authoritative-absence case unchanged. FOR THE OWNER TO CONFIRM, not for a lane to decide: whether a MARKED physical name on screen is still the right answer for a catalog gap now that an UNRESOLVED marker exists beside it and the two are visually adjacent. Recorded so the question is asked once rather than re-litigated per surface.", "LP-41.7 IS BUILDABLE BEFORE LP-36 DELIVERS, WHICH IS A PROPERTY OF THE ITEM AND NOT AN ASSUMPTION ABOUT THE LAYER: the lane's declared depends_on is LP-24 alone, because the path that must work when the Semantic Layer is unavailable is exactly the path that needs nothing from it. The RESOLVED path does need the endpoints and is gated on LP-36 delivery; that half is named here rather than hidden inside a green lane."], "LP-42": ["BLOCKING for scope (B): ASK_SL_ATTRIBUTE_PROMOTION was written and is now SL LP-44, status blocked on (1) owner rulings on the five questions — explicitly including no-silent-rebind and expression-survives — and (2) a CORE dependency: workflow stages for an ATTRIBUTE_PROMOTION task type. V16 provenance columns proposed alongside. Scope (A) remains unaffected.", "Scope (A) is NOT blocked by the above and can be built in full.", "U3+U4 BUILT. expression.py implements DD-61: closed Excel-named row-level set, grounding on SL attributes only, four refusal CLASSES each naming where the capability actually lives (aggregation → Core's Aggregations, lookup → the SL owns joins, volatile → use a prompted as-of, text → a modelling gap). derive_attribute gated in Rego at the HIGH TIER on its own derive_ready datum AND denied whenever auto_apply=true — policy, not UI convention, so a caller that forgets to preview is denied rather than trusted. 19 grammar tests, OPA 263/263, three gate mutants killed.", "G4 BUILT — DerivedAttributeEvidence + three externalized queries, written onto agent_run_step.input as jsonb (one per step; a run may create several). The EXPRESSION is stored as SOURCE, not a parse tree: a tree is our representation of what they wrote, the source is what they wrote, and a parser change could silently alter the former. groundsOn is recorded even though derivable, because it is derivable only by re-parsing with the grammar AS IT STANDS THEN and the closed set grows. Verified on PostgreSQL 16.14: the || merge preserves existing step input, coalesce handles a NULL input, and @> containment answers 'which derived attributes ground on this SL attribute?' — the question asked when an attribute is about to change meaning."], "LP-45": ["MODULE BUILT (report_store.py) against CORE'S REAL VOCABULARY, not our guess. C4 replaced submitted/superseded/run with TWO INDEPENDENT AXES: generation (IN_PROGRESS/COMPLETED/FAILED) and workflow (DRAFT→PENDING_APPROVAL→APPROVED|REJECTED→SUBMITTED_TO_FRB). Only SUBMITTED_TO_FRB means an agency holds the artefact; COMPLETED means it generated. Lineage is VERSION-BASED per C4, which is simpler than our Original/Amendment design and removes a sorting bug. Still blocked for the LIVE path on the adapter binding to Core's /report-generation endpoints.", "Entitlement/existence: if a requester may not access a filing, may they know it exists? A silently filtered result reads as 'no copy was ever produced'. Policy call, raised in the ask.", "Canned-pack and stored ad-hoc runs: in scope for the module, deliberately NOT contracted yet — a canned run and a submitted filing are not the same kind of object.", "G1 PART 2 of 4 DONE — StoreEntryPanel in the real slice. The instance outcome LEADS (a filed report is not a candidate to weigh), BOTH status axes always render, superseded versions stay visible, and the non-regulatory hand-off states plainly that we have not looked. Where no store address is configured it says so rather than rendering a dead link."], "LP-46": ["BLOCKING for items 1–3 and the live adapter: SL LP-43 delivery (their status: blocked, Wave 6) and POL-DM-001, still pending in their bundle.", "ITEM 5 BUILT (resolve_cache.py). TTL read from deployment config, never hardcoded — the SL may make DOMAIN_RESOLVE_TTL_SECONDS tenant-configurable and a number frozen in our source would silently outlive theirs. An ABSENT TTL means cache NOTHING, not 'assume 300': guessing their number would substitute our assumption for their contract. Pinned resolves are immutable and cached without expiry.", "ITEM 4 BUILT, both halves. Producer: resolution_evidence.py. Persistence: V20260821_01__uc10_resolved_value_provenance.sql (held in pending_owner_approval/), ResolvedValue record, ResolvedValueDao + ResolvedValueDaoImpl, four externalized queries. Constraints VERIFIED against PostgreSQL 16.14 — 12 cases, 8 rejected by the named constraint, 4 accepted; every read uses its intended index including the partial one. The compact with the Semantic Layer is now discharged on our side. G2 CLOSED: the impl shipped separately from the interface in the first pass, which is a promise the service cannot keep — every other DAO in the estate has one. The candidates[] array literal is hand-rendered (the column is text[]) and its escape cases are proved against PostgreSQL 16.14 rather than reasoned about.", "Normalisation: SL v2.11.0 switched LP-43 to Unicode case-folding with a declared form. Our adapter must match theirs exactly — two normalisations that ALMOST agree are worse than one that is wrong, because the disagreement only shows on the inputs nobody tested.", "G1 PART 1 of 4 DONE — the REAL UI slice (intelligence-ui), not the v23 prototype. Contract extended with six DTOs, all OPTIONAL so an un-upgraded backend degrades to what it had. ResolvedValuePanel renders the DESCRIPTION never the code alone, keeps the three dates apart (domain version · effective window · as-of), and makes an ASSUMED value visually distinct while SAYING WHY it carries no domain version.", "v1.31.0: B5 CLOSED for this point. LP-46.0 (SQL) authored, lang_tags gains SQL and tech_stack gains DATA - without both, a generator driving off lang_tags emits no prompt for the new lane and the fix would have been invisible."], "LP-44": ["CONTENT BLOCKED on the graph details being loaded: node and edge types, build cadence, whether history is held, and the traversal path per use case. The DECISION that this point should exist is not blocked.", "UC11 WRITE PATH, to be written down as a path rather than left as a gap: UC11 authors COA rules, edit checks and DQ rules. If the graph holds rules of those kinds then authoring eventually CHANGES the graph. 'Intelligence never writes' remains true directly — no DB grant, output handed to Core, a human approving — but we propose content that becomes graph edges, and an edge originating from a Copilot-drafted rule should carry that provenance. Not less valid; a fact worth being able to see.", "Per-purpose readiness lands on LP-13's capability handshake rather than duplicating it here."], "LP-47": ["OI-17 (the largest): 38 typecheck errors across six slices, dominated by prop drift against features/variance/__shims__/externals.d.ts. Pinned by lp47_typecheck_gate.sh, which fails if the count rises AND if it falls without the pin being updated. Needs its own point, scoped slice-first (variance 13, preset-management 13), each with a render test - the shim drift means a typecheck alone will not tell you a prop change is safe.", "OI-7 - PART SETTLED (SME, 28 Aug 2026). `home` is DEFERRED BY DECISION, not undesigned by omission: Lextr Intelligence is an independent module, but AT THIS STAGE its screens are reached EMBEDDED - called inline from Lextr Core, with Core's LHP offering the individual capabilities - so Core has the landing and a Home matters only once Intelligence is presented in its own right. It will be defined then. The destination is KEPT so the standalone shell has somewhere to land, and its placeholder now reads DEFERRED rather than MISSING, because a landing page that reads like an unfinished screen is the first thing anyone opening the app sees. `governance` remains genuinely undesigned - it has a working frame and no prototype.", "The embedded-first posture has a consequence worth stating for every future front-end point: a rail destination is a CAPABILITY Core can call FIRST and a tab in a standalone app SECOND. The standalone shell exists to demonstrate and test the module without Core, not because that is how users arrive. Design effort should follow that ordering.", "`lineage` is EXTERNAL - settled (SME, 28 Aug 2026), correcting LP-47's finding F6 which filed it alongside `home` as an undesigned Intelligence surface. It is not one: the pristine registry declares ownedBy 'Lineage engine (shipped)', the 2b build note records the CSS bridge as ADOPTED FROM that engine's src/shared/constants/lextrTheme.ts - preserving --lx-teal and --lx-blue verbatim so its Cytoscape stylesheet renders unchanged - and no such module exists anywhere in this estate. The theming spine was shaped around a module that ships elsewhere. It needs a MOUNT, not a design. Gate check P2 drops from 3 undesigned Intelligence surfaces to 2, and the number falls because the CLASSIFICATION was wrong rather than because anything was built - a distinction worth keeping, since a count that falls for the wrong reason is how a gate stops meaning anything.", "The lineage PICTORIAL VIEW inside Audit & Evidence is Core's too (SME, 28 Aug 2026), because the audit is FEDERATED and Core holds its own half. Verified against the code rather than assumed: features/audit-evidence renders no graph, and its only `graph.*` references are ANCHOR KINDS (graph.snapshot.traversal), not a view. The boundary is already respected - this records it so it is not crossed later by someone who reads 'Audit & Evidence' and assumes the picture belongs with the evidence. It also narrows OI-13: the subject picker is Intelligence's to design; the lineage picture is not.", "Runtime Policies Catalog, Model Registry and Role & Capability Mapping are drawn in the v23 prototype with no slice behind them (TURN-1 decision 6: out of scope - LP-47 is integration and three new screens is a different kind of work). They now render 'the destination is agreed; the screen behind it has not been built' rather than a blank pane.", "OI-3 - SETTLED (SME, 28 Aug 2026, option b): the three default logo SVGs are currentColor placeholders. The real Lextr assets are absent from the estate. Accepted (option b) - a tenant supplies its own through the 2b config, so this is only ever the unconfigured default, but any Lextr-branded demo will show a box reading 'logo · full' until real assets arrive.", "OI-8 (LP-26 owner): lp26_audit_full.py's 'build note' exemption is hardcoded to README_LP26_, so every LP-47 README trips check B.2. Generalise to README_LP\\d+_.", "OI-14 (lexie-ai owner): the USE_CASE vocabulary splits between domain names and UC codes across seven skills, and OPA tool_scope keys on the same field. The dispatcher carries both and a test pins them to the Python, so a rename fails loudly - but the inconsistency is a cross-service decision.", "OI-12: Reviewer is { id, role } and the session carries no role; the Review Queue wrapper renders 'unknown' rather than inventing something plausible. Folds into the unified reviewer-identity-per-use-case decision.", "OI-13: Audit & Evidence has no subject picker. EvidenceWorkspace takes a SUBJECT's EvidenceRead and nothing lets a user name a subject. Belongs in the Audit & Evidence build chat, where the two-key design lives.", "OI-19: the production bundle's main chunk is 1.59 MB (485 kB gzipped). Not a defect - the first time anyone has been able to see it.", "LP-26 remains entirely held in pending_owner_approval/ and has not merged. Audit & Evidence mounts OFF; a live mount would refuse on every call and read as a broken screen rather than an unbuilt one.", "docs/Lextr_Intelligence_Catalog_v10.jsx is a BASELINE file. Its LP-26 correction is held at pending_owner_approval/baseline_edits/docs/ and the LP-47 chat-8 row is held the same way - never edited in place - until the owner merges the baseline edits.", "v1.26.0 DEPRECATION CONSEQUENCE: LP-47.7 removed. The rebaseline discipline is promoted to build_context.validation_gates.manifest_integrity and applies to every release; the per-release rebaseline belongs to that release's packaging point. LP-47 keeps its six built sub-tasks and stops asserting byte-identity to stable_v20.", "v1.26.0 CARRIED IN FROM LP-20.4: the shell has no operational (UC12) destination. Either add it here, or UC12 is inline-only through the Lexie panel and no point should carry a UC12 screen sub-task."], "LP-48": ["the N3 walkthrough content for all eight screens is drafted from the estate and awaits SME correction - the mechanism is built, the words are a proposal", "the per-file size limit and the accepted extension set are placeholders in the prototype and must be confirmed against the deployment before the server-side rules are written"], "LP-49": ["BLOCKING, AND THE REAL COST OF THIS POINT: A DEPLOYMENT SEAM THE MANIFEST NAMES NOWHERE. This control needs (a) an object store supporting an immutability/retention lock and (b) a key custodian outside the DBA function. build_context.pinned_stack declares Docker/Kubernetes/Helm, on-prem and SaaS and names NEITHER. Both are new external dependencies with no owner today, and the authoring is not the cost - the seam is. RAISE BEFORE ANY LANE IS CLAIMED, because LP-49.5 cannot run without a real store and LP-49.3's custody check reports UNVERIFIABLE without a shared identity provider. OWNER: the deployment / platform owner, jointly with whoever owns pinned_stack, since adding an object store to it is a build_context change and not a lane's to make.", "THE RESIDUAL RISK, STATED PRECISELY AND NOT MITIGATED BY THIS POINT: a signing key held by the same person who holds the DBA credential is a receipt that witnesses nothing, and NOTHING IN THIS ITEM DETECTS THAT ARRANGEMENT. LP-49.3 detects it only where the secret store and the database share an identity provider, and REPORTS UNVERIFIABLE where they do not. The control is exactly as strong as its key custody. OWNER: the deployment owner, as a documented custody arrangement rather than a code change.", "REOPENING A COMMITTED POINT (adoption_standard.reopening_a_committed_point). LP-49.4 turns around LP-26.7's TEST[5] and TEST[8] and requires LP-26.3's committed Java port to derive a new corpus row; LP-49.1 adds columns to LP-26.1's evidence_chain; LP-26.13's workspace gains a third state. LP-26 must DECLARE THE DIVERGENCE in its own pending_items with an owner and have its status RE-DERIVED rather than left standing. LP-26.7's inversion condition means the reopening was ANTICIPATED, not that it is recorded. OWNER: LP-26 owner (LexIntl LP-26).", "NIST SP 800-53 AU-10 (NON-REPUDIATION) IS A FOOTPRINT EXTENSION, NOT A CITATION THIS POINT TAKES. The control register cites it and states plainly that it is outside the manifest's cited footprint (LP-26 cites AU-3/AU-9/AU-11/AU-12). AU-10 is the correct control for a detached signature, which is exactly why adopting it must be an owner's decision on the LP-39 OPA-TDM-006/007 precedent - 'the estate's original closed set of five' - rather than a line a build lane adds. Neither taken nor silently dropped. OWNER: the regulatory-mapping owner.", "B3 (ddl_baseline / ddl_pending_owner_approval split) - PARTIALLY, AND THE ANSWER IS CLEANER HERE THAN ELSEWHERE. LP-49 adds a NEW table and columns to evidence_chain, itself an LP-26 table absent from ddl_body, so the whole point sits unambiguously in the pending_owner_approval half and its half of the split is not in doubt. AUTHORABLE BEFORE B3 CLEARS; NOT GATEABLE BEFORE IT, because validation_gates.SQL requires the migration APPLIED and the constraint shown to FIRE, and LP-26's six migrations are themselves held. OWNER: schema owner.", "THE NOTARIZATION SCHEDULE JOINS LP-26.pending_items[5]'s DEPLOY SWITCHES, 'all off and all needing an owner'. It lands as a governed catalogue row with type, bounds, consequence class and blast radius, under validation_gates.config_is_read. NOTE THE INTERACTION NAMED THERE: the coverage marker is 'the only item whose cost accrues while nothing happens - a day it is off is a day that reads inconclusive forever and can only be bought back with a signed attestation', and A RECEIPT OVER A DAY THE MARKER NEVER MARKED WITNESSES AN INCONCLUSIVE DAY. Turning the notary on without the marker buys less than it appears to. OWNER: deploy-switch owner, with LP-26.", "THE STATUS OF THE REFUSAL IS AN OPEN DECISION AND THE HARVEST RECORD SAYS OTHERWISE - CORRECTED HERE. LEX-37's analysis states 'NOT blocked by any of the eight open decisions'. THAT IS WRONG FOR THIS POINT. DEC-LP-33-3 is OPEN and its subject IS this refusal: it asks whether the three surviving meanings of 409 - a review transition violation (AMD-REV-18), an idempotency conflict (LP-06.2 TEST[6]) and a NOTARIZATION CONTROL FAILURE (AMD-EVD-45) - all stay 409 distinguished only by ErrorDetail.code, and its recorded alternative moves the notarization refusal OFF 409 on the ModelProhibitedException argument. LP-49.2 therefore authors the CODE and the PARAMS and leaves the DIGIT to the owner, and the mapping row lands with whichever answer is taken. DEC-LP-33-3 also requires the three codes to be declared TOGETHER AND NAMED AS THREE, so this code cannot be added alone - the other two have no owner today and this point is what makes the question due. OWNER: the error-contract owner, with DEC-LP-33-3.", "THE ESTATE HAS ALREADY DRAFTED THIS TABLE ONCE AND THE ITEM DID NOT KNOW IT. claude/AMEND_v19/AMD-EVD_evidence_and_audit.md carries CREATE TABLE intelligence.evidence_notarization with named constraints, including CHECK (chain_valid) and a comment saying there is no allow_broken_chain, plus AMD-EVD-45's refusal rule. THE PACK IS UNAPPLIED and gated on adjudicating 25 DECISION-class amendments, so it is a SOURCE and not a decision taken - but no_second_implementation makes reconciling with it mandatory, and LP-49.1 does, naming three divergences: the pack keys a segment by segment_from_seq / segment_to_seq against an intelligence.evidence_ledger with a monotonic chain_seq THAT LP-26 NEVER BUILT (it built evidence_chain, one row per tenant-DAY), so the day range is forced by the shipped estate rather than preferred; the pack's event_count = to_seq - from_seq + 1 arithmetic has no meaning over days and is replaced; and the pack puts signature / signing_key_id on the RECEIPT while LEX-37 puts head_signature / head_signed_at on evidence_chain - both are kept, deliberately, so a chain head with no matching receipt is detectable from either side. WHOEVER ADJUDICATES THE PACK MUST SEE THIS POINT BESIDE IT, or the estate adjudicates a table it has already superseded. OWNER: the manifest owner, with the pack's adjudication.", "head_signature AND head_signed_at CANNOT BE CONFIRMED FROM THIS MANIFEST, AND THE MIGRATION'S SHAPE DEPENDS ON WHETHER THEY EXIST. LEX-37 states they 'have existed since D1 for exactly this' and are written by nobody. Both names occur ZERO times across the whole manifest: LP-26.fixed_contracts[3] describes evidence_chain only as 'one row per tenant-day, head hash advancing monotonically', and ddl_body carries no LP-26 table at all, so the manifest cannot settle it either way. If the columns exist as D1 built them the second migration WRITES them; if they do not, it ADDS them - a different change against an applied, seeded table with a different approval. Verify against LP-26's held migrations before the lane is claimed rather than assuming the item is right. OWNER: LP-26 owner, with the schema owner.", "SEQUENCING AGAINST TWO OTHER HARVESTED ITEMS, recorded so they are not discovered at build time. UPDATED AT THE LEX-28 ADOPTION: LEX-28 IS NOW ADOPTED, RE-CUT ACROSS LP-06 AND LP-26, AND THE OBLIGATION IT CREATED ON THIS POINT IS NOW EXECUTABLE RATHER THAN ADVISORY. IT IS ALSO NOT DISCHARGED, AND THAT IS THE POINT OF THIS ENTRY. The instruction was 'LEX-28 SHOULD LAND FIRST: it changes what the chained row CONTAINS ... so a receipt taken before it witnesses a superseded canonicalisation'. THREE THINGS CHANGED. (1) THE GATE EXISTS: LP-26.32 settles by derivation whether the trigger's column digest includes intelligence.agent_run_step.input, introduces a canonicalisation VERSION pinned per chain-day, and REFUSES a receipt taken while it is red, with this entry named as the reason. LP-49.2 records that version in the receipt it files and LP-49.1's receipt row carries it. THE CONDITION IS THEREFORE: LP-26.32 GREEN BEFORE LP-49.2 NOTARIZES ANYTHING, and it is a check rather than a sentence. (2) THE PREMISE IS UNVERIFIED AND IS NOW SAID SO. Whether LEX-28 changes the formula AT ALL depends on whether `input` is a member of the trigger's digest, which cannot be read from ddl_body, from LP-26.1's scope or from LP-26.fixed_contracts[1]. If it is not a member, this sequencing pressure largely evaporates; if it is, it is exactly as stated. LP-26.32 TEST[0] answers it and is the first thing done. (3) THE SEQUENCE IS NOT SHORTENED BY THE ADOPTION: LEX-28's own lanes are ALL blocked - on B3 and B1 for the schema half, on an ownerless content-addressed object store for the archive half, and on DEC-LP-26-1 (no declared regime for the erasure obligation) for the authority half - so 'LEX-28 first' now means 'the canonicalisation gate first', which is startable once LP-26.1's held migrations can be applied and does NOT wait on the erasure half. LEX-24 (the self-verifying export) MUST CONSUME THIS RECEIPT AND NEVER RE-DERIVE IT; two independent digest derivations over one artefact is the second-authority failure this manifest exists to prevent, and the source estate produced it once already. OWNER: the adoption-pass owner, with the LP-26 owner for LP-26.32.", "chain_discontinuity NEEDS A RUNBOOK STEP, NOT ONLY A TABLE. A restore, failover or partition must be recorded as it happens or the ledger reports a legitimate operation as a gap; the row cannot be written retrospectively by anyone the fence would refuse. The step belongs in docs/runbooks/LP26_EVIDENCE_OPS_RUNBOOK.md rather than a new runbook. OWNER: evidence ops, with LP-26.", "THE JAVA PORT IS NOT COMPILED HERE, AND THE POINT SAYS SO. LP-26.pending_items[6] records that Maven Central is unreachable and NO Spring-annotated class in LP-26 has ever been compiled; validation_gates.JAVA states 'there is no JDK in the authoring sandbox, so NEVER claim Java compiled that has not'. LP-49.2 inherits that condition and any structural-only validation must be labelled as such in its README. OWNER: build environment."], "LP-50": ["BLOCKING AND THE REAL LONG POLE: THE CORE INVENTORY CONTRACT, WHICH HAS NO ASK AND NO DRI TODAY. The reported population is Core's line inventory at (report_id, version) and no such contract exists; the nearest are ASK_CORE.md (an acceptance receipt for a retired hand-over model) and LP-45's still-unbound /report-generation adapter. THE ASK IS docs/asks/ASK_CORE_report_line_inventory.md AND IT IS NOT RAISED UNTIL A NAMED PERSON AT CORE SITS AGAINST IT - 'Core' is not a DRI, and layer_governance.cross_product names LP-36 as what happens when the counterpart DRI is named nowhere. It must settle the line identifier vocabulary and its stability across versions, whether a superseded version's inventory stays retrievable, whether entitlement may narrow the inventory, and the fail-closed contract. RAISE IT BEFORE ANY LANE OF THIS POINT IS CLAIMED, and fold it into the same conversation as LP-26.pending_items[2] and LP-24.pending_items[0], both of which have been waiting. OWNER: the Intelligence owner to name the Core DRI, then that DRI at Lextr Core.", "THE READINESS-DATUM SCOPE QUESTION APPLIES HERE VERBATIM AND IS WORSE. LP-24.pending_items[1]: catalog_ready / handoff_ready are per-DEPLOYMENT booleans, 'WRONG for the SaaS shared-inference tier where one deployment serves several tenants: a FAIL-OPEN BY AGGREGATION, exactly what default-deny exists to prevent.' A reconciliation scoped to a deployment would report one tenant's completeness over another's population. LP-50.1 keys everything per tenant, but whatever answer the owner gives on LP-24 governs how the Core inventory is fetched and scoped. OWNER: deployment model / SME, jointly with LP-24.", "B3 (ddl_baseline / ddl_pending_owner_approval split) - AND THIS IS THE ITEM MOST TIGHTLY BOUND TO IT. The five gates DERIVED BY DATABASE CONSTRAINT are the point's load-bearing claim and validation_gates.SQL requires the migration APPLIED and the constraint shown to FIRE. It can be AUTHORED before B3 clears; LP-50.1 cannot be startable or provable, and building LP-50.2 against an unsettled schema is how a service ends up asserting in code what the schema was supposed to derive. OWNER: schema owner.", "REOPENING TWO COMMITTED LANES (adoption_standard.reopening_a_committed_point). The reconciliation travels VERBATIM inside the export pack, which extends LP-26.3's ExportRules, and NOT_AVAILABLE must render DISTINCTLY from complete on LP-26.13's workspace, on LP-24.6's three-state card pattern rather than a second renderer. LP-26 must declare the divergence in its own pending_items with an owner and have its status RE-DERIVED. THE RENDERING IS DELIBERATELY NOT A LANE OF THIS POINT: LP-26.13 owns that surface and a second renderer there would be a second owner - LP-50.4 asserts the distinction end to end and the work is the reopened lane's. OWNER: LP-26 owner (LexIntl LP-26).", "THE FOUR-EYES HOME IS ARGUED, NOT ASSUMED - AND ITS ADJACENCY IS AN OPEN QUESTION. The estate has TWO four-eyes packages: lextr.ai.mrm_sod (LP-22.5, deliberately definition-agnostic, reused by LP-39.3 and by LP-14.0 for the threshold approval and the CLOSE override) and lextr.ai.evidence_lifecycle (LP-26.12, purge / tier / retention). THIS POINT CITES evidence_lifecycle, because attestation of the evidence file is an evidence-lifecycle act. THE ADJACENCY IS REAL: LP-14.0's close-as-attestation and this point's submission attestation will be performed by the same person minutes apart under DIFFERENT packages, and the manifest has already caught TWO points citing the wrong four-eyes owner (LP-07.fixed_contracts[1] and LP-12.fixed_contracts[1] both attribute it to LP-04). Recorded rather than resolved. OWNER: policy owner, with LP-22 and LP-26.12.", "pending_review vs in_review, INHERITED FROM LP-07 AND LOAD-BEARING HERE. LP-07 names both inside one record and intelligence.run_status carries only in_review (meta.v31_findings, meta.v32_open_findings). THE WRONG PREDICATE SEES ZERO OUTSTANDING ITEMS AND REPORTS THE POPULATION COMPLETE - the same failure LP-14.0 records for its close, and worse here because this row is what an examiner is shown. LP-50.2 derives the predicate from the enum AS APPLIED and asserts a mutant on the wrong literal goes red; the enum question itself is not answered here. OWNER: LP-07 / schema owner.", "THE CONTROL REGISTER'S FOURTH CITATION IS TIGHTENED HERE AND THE REGISTER ROW MUST FOLLOW. The register cites EU AI Act Art. 12(1) alongside BCBS 239 P4, P7 and Art. 14; Art. 12 governs automatic recording of events BY the AI system, and this is a reconciliation over a bank's filed report. It is declared RELATED rather than SUPPORTS, per unmapped_declares_itself. OWNER: the regulatory-mapping owner.", "NO KNOB, AND IT MUST STAY THAT WAY. This point declares NO configuration key of its own - no completeness threshold, no tolerance, no waiver, no 'skip reconciliation', no 'accept partial'. The only configuration in scope is LP-50.3's Core endpoint binding, which carries its wiring_contrast pair and its reader (validation_gates.config_is_read). Recorded so that a later request for a 'temporary tolerance' is answered by the record rather than by whoever is on call: a tolerance here is a knob whose reader is the control itself. OWNER: this point's owner, standing.", "SOFT DEPENDENCY ON LEX-13 (available_actions derived from the transition table, LP-07): the FINALLY-REVIEWED population depends on which review outcomes count as settled. It does not block authoring and it does change the predicate. OWNER: the adoption-pass owner.", "THIS TABLE HAS BEEN DRAFTED ONCE ALREADY, UNDER THE NAME THIS POINT REFUSES, AND ITS DRAFT FAILS OPEN. claude/AMEND_v19/AMD-EVD_evidence_and_audit.md carries CREATE TABLE intelligence.cycle_coverage_reconciliation - the fifth use of 'coverage' - holding reported_lines, detected_lines, analyzed_lines, below_threshold_lines and reviewed_lines as integer NOT NULL beside the identifier arrays, and holding detection_complete, analysis_complete, review_complete, integrity_verified and submission_ready as `boolean NOT NULL` columns A WRITER SUPPLIES. Its only derivation constraint asserts that submission_ready equals the conjunction of the other four and says nothing about whether those four are true, so detection_complete = true beside reported_lines = 0 satisfies every constraint it declares; and it carries NO unavailability state at all, so an unreceived inventory and a complete one are the same row. ITS OWN COMMENT SAYS 'submission_ready is DERIVED by constraint, never asserted by a writer' AND ITS DDL DOES NOT DO THAT - known_defect_classes[3], a success asserted rather than checked, in the estate's own draft of this control. THE PACK IS UNAPPLIED and gated on 25 DECISION-class adjudications, so it is a SOURCE and not a decision taken; LP-50.1 SUPERSEDES it, uses GENERATED ALWAYS rather than a CHECK because PostgreSQL refuses a supplied value outright where a CHECK only refuses an inconsistent set of supplied values, and drives the pack's own row as a NEGATIVE FIXTURE. WHOEVER ADJUDICATES THE PACK MUST SEE THIS POINT BESIDE IT. OWNER: the manifest owner, with the pack's adjudication.", "SEQUENCING, RECORDED SO IT IS NOT DISCOVERED AT BUILD TIME: LEX-24 (the self-verifying export) changes the export pack's member set to include this reconciliation, and LEX-28 (content-addressed payloads) changes what LP-49's receipt covers. Neither blocks authoring; both change what this point's wire-through asserts. OWNER: the adoption-pass owner."], "LP-51": ["THE DECISION THIS POINT CREATES AND DELIBERATELY DOES NOT ANSWER - RAISED IN PARALLEL, NEVER AS A GATE. LEX-39 change[0] named 'the ONE sanctioned use - queue ordering - and every other use forbidden'. LP-07.1 TEST[3] forbids exactly that ('no statement filters, ranks or thresholds on confidence_score - confidence is a signal, and a predicate over it is a gate; asserted with a positive control that goes red when one is added') and LP-07.2 TEST[5] forbids any branch reading a confidence number. MONOTONICITY DOES NOT RESOLVE IT: monotonicity says applying the calibrator will not CHANGE an order, which buys nothing if ordering by confidence was never permitted. THE PROPOSAL IS DECISION-CLASS under correction_feedback.routing_by_class - NOT auto-applied, written as a proposal and held until approved - because it would alter a fixed invariant. IT IS NEVER A BUILD-TIME READING AND NO LANE MAY DECIDE IT. WHAT THE ANSWER CHANGES: this point's headline; the Art. 14 mapping (RELATED today, SUPPORTS if the queue is ordered); and whether a ranking read over agent_run is legal at all. WHAT IT DOES NOT CHANGE, WHICH IS WHY NOTHING HERE WAITS ON IT: what is EMITTED (LP-51.1) and what is RENDERED (LP-51.5) are the same under either answer. OWNER: the LP-07 owner as the invariant's owner, with the regulatory-mapping owner for the Art. 14 consequence - explicitly NOT a lane and not the adoption pass.", "AN OWED EDIT TO LP-26.22 THAT THIS POINT CREATES AND MUST NOT MAKE ITSELF. LP-26.22's scope named 'the calibration report' among inputs it asserts are 'each ALREADY BUILT'; the citation was STRUCK at v1.34.0 (meta.v34_corrections[0], and an adjustment on the lane) for the exact and correct reason that no point LP-51 existed. IF LP-51 LANDS, THE INPUT COMES BACK - as a named live input produced by LP-51.3 and traceable under LP-26.22 TEST[0], not as prose. AND THE STRIKE WAS PARTIAL, WHICH IS A SEPARATE FINDING THE OWNER NEEDS EITHER WAY: LP-26.manifest_of_steps[22] and LP-26.fixed_contracts[14] STILL name 'the calibration report' at v1.34.0, so one citation was removed and two remain - a fact held in three places and corrected in one, which is known_defect_classes[2]'s shape on the record of the lane whose own subject is a document that must not assert an input it cannot trace. THIS PASS EDITS NEITHER: the lane and the point-level fields are LP-26's, and adoption_standard.reopening_a_committed_point requires the divergence to be declared with an owner rather than applied. OWNER: the LP-26.22 owner (LexIntl LP-26), with the manifest owner for the two point-level fields.", "REOPENING THREE POINTS (adoption_standard.reopening_a_committed_point), EACH TO DECLARE THE DIVERGENCE AND HAVE ITS STATUS RE-DERIVED. LP-22 (COMMITTED) gains a THIRD registered kind and one additive definition_kind enum value. LP-39 (COMMITTED) has its field monitor gain a CONDITIONAL form beside the unconditional one - it is not replaced and TWO-CLOCKS-NEVER-MIXED is preserved. LP-25 (COMMITTED) has LP-25.8's confidence component EXTENDED, never duplicated. A committed point that gains scope and keeps its status is a claim nobody produced. OWNERS: the LP-22, LP-39 and LP-25 owners respectively.", "BLOCKING AND INHERITED, NOT INTRODUCED: LP-39.pending_items[0] - 'X-User-Functions is not emitted by the gateway, so every function set parses empty and EVERY independence-required approval refuses.' Correct fail-closed behaviour, and it blocks the four-eyes promotion of a calibrator exactly as it blocks TDM's happy path end to end. LP-51.3 cannot complete until it clears. OWNER: the gateway owner, jointly with LP-39.", "B3 (ddl_baseline / ddl_pending_owner_approval split), PARTIALLY - AND LESS THAN IT LOOKS. FOUR of six lanes need NO new DDL if the calibrator rides LP-22's registered_definition: the two PY lanes, the JAVA promotion lane and the TS lane can be authored and started before B3 clears. LP-51.4 alone needs the split settled, for the definition_kind enum value and the governed-threshold rows. THE INHERITED HAZARD IS NAMED RATHER THAN HIDDEN: registered_definition is itself UNAPPLIED and pending approval - LP-39.pending_items[8] records 'LP-39 RIDES AN UNAPPROVED CONTRACT. Flagged, not hidden' - so LP-51 would be the SECOND point riding it, and a refusal at that approval now stalls two points rather than one. OWNER: the schema owner.", "A SEQUENCING CONSTRAINT THAT IS THE BINDING ONE AND THAT NO MANIFEST DEPENDENCY EXPRESSES: A CALIBRATOR NEEDS A REVIEW HISTORY, AND THERE IS NONE BEFORE UC1a IS IN PRODUCTION. LP-51 cannot be fitted at build time. Shipping it with a calibrator fitted on nothing is LP-39.tests[8]'s 'an empty exam returns {} and not 1.0' one level up, and it is this point's own failure applied to itself. LP-51.2 and LP-51.3 are HELD for that reason and their status says so; the NOT-CALIBRATED state ships from day one so the interval is honest rather than empty. RECORDED SO A LATER READER DOES NOT MISTAKE THE HOLD FOR NEGLECT. OWNER: this point's owner, standing.", "AN exec.waves ROW IS OWED. This pass is read-only on the manifest and exec.waves.completeness requires every point to sit in exactly one wave, checked at generation. Landing LP-51 requires ONE new row for 'Wave 10 (post-deployment - gated on a live review population, not on a manifest dependency - proposed)'. THE FALLBACK is the existing Wave 7 post-registry string with no other change, which would read as a dependency claim this point does not make. OWNER: the manifest owner.", "THE REVIEW-OUTCOME VOCABULARY QUESTION, SHARED WITH LEX-13 AND BLOCKING THE FIT'S CORRECTNESS RATHER THAN ITS AUTHORING. review_decision already spells APPROVE_WITH_EDITS as `correct` and run_status already carries `corrected`; LEX-13 introduces APPROVE_WITH_EDITS and the rendered diff on LP-07. If the two land different spellings the estate gains a second review-outcome vocabulary, which is B1's exact shape in a schema that already holds a live instance of it - and a calibrator fitted against the wrong spelling counts the wrong misses and is wrong in the direction that still looks fine. LP-51.2 resolves against the enum AS APPLIED and asserts a mutant on the wrong literal goes red; the vocabulary decision itself is not taken here. OWNER: the adoption-pass owner with the schema owner, in the same conversation as LEX-13.", "WHERE THE FITTED MAPPING ITSELF LIVES IS A CONTRACT QUESTION AND IS NOT DECIDED HERE. The calibrator's IDENTITY, version, lifecycle and MRM record ride registered_definition; the fitted mapping is a payload. A per-definition documentation payload COLUMN on registered_definition is ALREADY an open proposal on LP-26.22's own adjustments[0] for a different reason, so the two should be answered together rather than twice - a column added for one and a digest reference invented for the other is how one table grows two payload conventions. OWNER: the LP-22 owner with the schema owner and LP-26.22.", "pending_review VS in_review, INHERITED FROM LP-07 AND LOAD-BEARING HERE. LP-07 names both inside one record and intelligence.run_status carries only in_review (meta.v31_findings, meta.v32_open_findings). The wrong predicate selects a different reviewed population and the calibrator is then fitted on it. LP-51.2 derives its population from the enum as applied; the enum question itself is not answered here. OWNER: LP-07 / schema owner.", "NO FOURTH KNOB, AND IT MUST STAY THAT WAY. This point declares THREE governed keys - the observation floor and the absolute and relative promotion thresholds - and NO fourth. No confidence threshold, no display cutoff, no 'trust above X', no bucket-width setting exposed to an operator, and no toggle that would let a deployment turn the NOT-CALIBRATED state off. Recorded so that a later request for 'just a display threshold' is answered by the record rather than by whoever is on call: a display threshold on this number is a gate drawn in pixels. OWNER: this point's owner, standing."], "LP-59": ["N8 - the Core gateway does not emit X-User-Functions, so every independence-required approval refuses with NO_FUNCTIONS. Honest, and it blocks nothing here.", "N2 - nobody holds platform_admin. Asserted by a gate rather than assumed."], "LP-60": ["Where pending_review surfaces during a filing close is a Core-side decision (T6); this point renders whatever Core routes."], "LP-57": ["The golden-set prerequisite: assurance numbers are only as good as the exam behind them, and a curated exam per document family is a TDM deliverable (LP-58 / LP-39), not this point's."], "LP-58": ["The golden-set prerequisite (LP-39): a curated evaluation suite is what a sandbox probe is NOT, and until one exists the distinction rests on the guard alone."], "LP-52": ["Runtime-egress proof in the target environment is outstanding: everything to date ran with HF_HUB_OFFLINE set, which is our flag on our code."], "LP-53": ["Whether a footnote travels INSIDE the chunk or alongside it is decided (alongside, LP-55); this point must not inline one by accident when group /* ---------- TAB 1 ---------- */
const WAVE_ORDER = w => {
  const m = /(\d+)/.exec(w||''); return m ? +m[1] : 99;
};
function tab1(){
  const el = document.getElementById('p1');
  const waves = [...new Set(D.points.map(p=>p.wave||'unassigned'))]
      .sort((a,b)=>WAVE_ORDER(a)-WAVE_ORDER(b)||a.localeCompare(b));
  el.innerHTML = `
   <h2>Dependency graph</h2>
   <p class="note">Click a point to see what it depends on (amber) and what depends on it (green).
     Dependencies are read from each point's <code>depends_on</code>. The manifest declares no
     "conditional" or "configurable" dependency type &mdash; every edge below is a hard
     <code>depends_on</code>, and no other kind is asserted anywhere in it.</p>
   <div class="controls">
     <input type="search" id="q" placeholder="filter by id, title or scope">
     <select id="st"><option value="">any status</option>${
       [...new Set(D.points.map(p=>p.status))].map(s=>`<option>${s}</option>`).join('')}</select>
     <select id="ly"><option value="">any layer</option>${
       [...new Set(D.points.map(p=>p.layer).filter(Boolean))].map(s=>`<option>${s}</option>`).join('')}</select>
     <span class="count" id="cnt"></span>
   </div>
   <div class="legend">
     <span><span class="sw" style="border-color:var(--blue)"></span>selected</span>
     <span><span class="sw" style="border-color:var(--amber);background:#fffdf7"></span>it depends on</span>
     <span><span class="sw" style="border-color:var(--green);background:#f7fdfa"></span>depends on it</span>
   </div>
   <div id="detail"></div>
   <div id="waves"></div>`;
  const draw = () => {
    const q=(document.getElementById('q').value||'').toLowerCase();
    const st=document.getElementById('st').value, ly=document.getElementById('ly').value;
    const vis = D.points.filter(p=>
      (!q || (p.id+p.title+p.scope).toLowerCase().includes(q)) &&
      (!st || p.status===st) && (!ly || p.layer===ly));
    document.getElementById('cnt').textContent = vis.length+' of '+D.points.length+' points';
    document.getElementById('waves').innerHTML = waves.map(w=>{
      const ps = vis.filter(p=>(p.wave||'unassigned')===w);
      if(!ps.length) return '';
      return `<div class="wave"><div class="wavehd">${esc(w)} &middot; ${ps.length}</div>
        <div class="grid">${ps.map(p=>`
          <div class="node" data-id="${p.id}">
            <div class="nid">${p.id}</div>
            <div class="ntitle">${esc(p.title)}</div>
            <div class="nmeta">
              <span class="pill ${p.status}">${p.status}</span>
              <span>${p.lanes} lanes</span>
              <span>${esc(p.langs.join(' '))}</span>
            </div></div>`).join('')}</div></div>`;
    }).join('');
  };
  const select = id => {
    const p = D.points.find(x=>x.id===id); if(!p) return;
    const dependants = D.points.filter(x=>x.dep.includes(id)).map(x=>x.id);
    document.querySelectorAll('.node').forEach(n=>{
      n.classList.remove('sel','dep','dependant');
      const nid=n.dataset.id;
      if(nid===id) n.classList.add('sel');
      else if(p.dep.includes(nid)) n.classList.add('dep');
      else if(dependants.includes(nid)) n.classList.add('dependant');
    });
    document.getElementById('detail').innerHTML = `<div class="detail">
      <div class="nid">${p.id} &middot; <span class="pill ${p.status}">${p.status}</span></div>
      <div class="ntitle" style="font-size:13px;margin:5px 0 9px">${esc(p.title)}</div>
      <dl class="kv">
        <dt>layer</dt><dd>${esc(p.layer||'&mdash;')}</dd>
        <dt>wave</dt><dd>${esc(p.wave||'&mdash;')}</dd>
        <dt>lanes</dt><dd>${p.lanes} &middot; ${esc(p.langs.join(', '))}</dd>
        <dt>tech stack</dt><dd>${esc(p.stack.join(', ')||'&mdash;')}</dd>
        <dt>depends on</dt><dd>${p.dep.length?esc(p.dep.join(', ')):'nothing &mdash; it is a root'}</dd>
        <dt>depended on by</dt><dd>${dependants.length?esc(dependants.join(', ')):'nothing yet'}</dd>
        <dt>scope</dt><dd>${esc(p.scope)||'&mdash;'}</dd>
      </dl></div>`;
  };
  el.addEventListener('input', draw);
  el.addEventListener('click', e=>{ const n=e.target.closest('.node'); if(n) select(n.dataset.id); });
  draw();
}
